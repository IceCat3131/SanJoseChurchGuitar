
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>诗歌</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@coderline/alphatab@latest/dist/alphaTab.js"></script>
  <!-- 简繁转换库：opencc-js（浏览器 UMD 完整版） -->
  <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js"></script>
</head>
<body>
<div class="page">
  <div class="page-inner">

    <!-- 第 1 部分：返回首页 / 上一首 / 标题 / 下一首 -->
    <div class="topbar">
      <div class="topbar-left">
        <button class="topbar-button" id="btn-back" aria-label="返回首页">
  <svg viewBox="0 0 24 24" class="icon-home">
    <path d="M3 10.5 12 3l9 7.5v9.5a1 1 0 0 1-1 1h-5.5v-6h-5v6H4a1 1 0 0 1-1-1v-9.5z"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round" />
  </svg>
</button>
      </div>
      <button class="topbar-button" id="btn-prev" aria-label="上一首">&lt;</button>
      <div class="topbar-title" id="song-title">诗歌</div>
      <button class="topbar-button" id="btn-next" aria-label="下一首">&gt;</button>
    </div>

    <!-- 第 2 部分：搜索框 -->
    <div class="card">
      <div class="search-bar">
        <div class="search-book-toggle">
          <button class="search-book-btn" data-book="c" id="btn-book-c">大本</button>
          <div class="search-book-divider"></div>
          <button class="search-book-btn" data-book="ts" id="btn-book-ts">小本</button>
        </div>
        <div class="search-input-wrap">
          <input
            id="search-input"
            class="search-input"
            type="text"
            inputmode="numeric"
            pattern="[0-9]*"
            placeholder="输入编号，如31"
          />
          <button class="search-icon-btn" id="btn-search">
            <span class="search-icon">🔍</span>
          </button>
        </div>
      </div>
    </div>

    
    <!-- 播放条（放在搜索栏下方） -->
    <div class="player-bar" id="player-bar">
      <button class="pbtn pbtn-prev" id="btn-player-prev" aria-label="上一首">
        <span class="picon">⏮</span>
      </button>
      <button class="pbtn pbtn-play" id="btn-player-play" aria-label="播放/暂停">
        ▶
      </button>
      <button class="pbtn pbtn-next" id="btn-player-next" aria-label="下一首">
        <span class="picon">⏭</span>
      </button>

      <div class="pprogress-wrap" id="pprogress-wrap" aria-label="播放进度">
        <input class="pprogress" id="player-progress" type="range" min="0" max="1000" value="0" />
        <div class="ptime" id="player-time">00:00</div>
      </div>

      <div class="pstatus" id="player-indicator" aria-label="音源状态">音源未加载</div>
    </div>

<div class="player-mid">
        <input class="player-progress" id="player-progress" type="range" min="0" max="1000" value="0" />
        <div class="player-time" id="player-time">00:00 / 00:00</div>
      </div>
      <div class="player-right">
        <div class="player-indicator" id="player-indicator">音源加载中…</div>
      </div>
    </div>

    <!-- 第 3 部分：+ / - / 吉他 / 歌词 / 简繁 -->
    <div class="controls-row">
      <div class="controls-left">
        <button class="icon-plusminus-btn" id="btn-font-plus">+</button>
        <button class="icon-plusminus-btn" id="btn-font-minus">−</button>
        <div class="mode-toggle">
          <button class="mode-btn active" id="btn-mode-score">吉他</button>
          <button class="mode-btn" id="btn-mode-lyrics">歌词</button>
        </div>
      </div>
      <!-- 轨道开关：一个字“轨” -->
      <button class="script-toggle-btn" id="btn-tracks" aria-label="轨道开关">轨</button>
      <!-- 简繁切换按钮：一个字，默认显示“繁”（当前歌词为简体） -->
      <button class="script-toggle-btn" id="btn-script">繁</button>
    </div>

    <!-- 第 4 部分：内容 -->
    <div class="content-card">
      <div id="score-view" class="score-wrap" aria-hidden="false">
        <div id="alphaTab" class="at-viewport"></div>
      </div>
      <div id="lyrics-view" class="lyrics-root" style="display: none;" aria-hidden="true">
        <!-- 歌词 -->
      </div>
    </div>

  </div>
</div>

<script>

  const BOOKS = {
    c: {
      label: "大本诗歌",
      folderText: "c_text",
      gtzPrefix: "assets/c/c",
      svgPrefix: "assets/c/c",
      codePrefix: "c"
    },
    ts: {
      label: "小本诗歌",
      folderText: "ts_text",
      gtzPrefix: "assets/ts/ts",
      svgPrefix: "assets/ts/ts",
      codePrefix: "ts"
    }
  };

  const MAX_RANGES = 20; // 最多支持 2000 首（够用了）

  const state = {
    currentBook: "c",
    currentNo: 1,
    // “显示模式”：score=吉他谱，lyrics=歌词
    mode: "score",
    // 歌词当前显示：simplified=简体, traditional=繁体
    script: "simplified",
    lyricsFontSize: 24,
    data: { c: [], ts: [] },
    loadedRanges: { c: {}, ts: {} }
  };

  let converterToTraditional = null; // 简 -> 繁
  let converterToSimplified = null;  // 繁 -> 简

  function setupConvertersIfNeeded() {
    if (!window.OpenCC) return;
    if (!converterToTraditional) {
      // 简体（cn） -> 繁体（tw）
      converterToTraditional = OpenCC.Converter({ from: "cn", to: "tw" });
    }
    if (!converterToSimplified) {
      // 繁体（tw） -> 简体（cn）
      converterToSimplified = OpenCC.Converter({ from: "tw", to: "cn" });
    }
  }

  function convertTextByScript(text) {
    setupConvertersIfNeeded();
    if (state.script === "traditional" && converterToTraditional) {
      return converterToTraditional(text);
    }
    if (state.script === "simplified" && converterToSimplified) {
      return converterToSimplified(text); // 如果原 JSON 就是简体，这里基本等于原文
    }
    return text;
  }

  
  // ===== alphaTab + .gtz 加载 =====
  function base64ToUint8Array(b64) {
    const binary = atob(b64);
    const len = binary.length;
    const bytes = new Uint8Array(len);
    for (let i = 0; i < len; i++) bytes[i] = binary.charCodeAt(i);
    return bytes;
  }

  async function loadGtzIntoAlphaTab(api, gtzUrl) {
    // 切歌时先停止，避免上一首残留
    try { api.stop && api.stop(); } catch(e) {}
    // 清空进度
    setPlayerUI({ current: 0, total: 0, playing: false });

    const res = await fetch(gtzUrl, { cache: "no-cache" });
    if (!res.ok) throw new Error(`HTTP ${res.status} ${gtzUrl}`);

    // GitHub Pages 可能给 .gtz 设为 application/octet-stream，res.json 依然可用，
    // 但为了最大兼容性：优先 text -> JSON.parse
    const raw = await res.text();
    let gtz;
    try { gtz = JSON.parse(raw); } catch(e) { throw new Error("gtz 不是有效 JSON"); }

    if (!gtz || !gtz.gpBase64) throw new Error("gtz 格式错误：缺少 gpBase64");
    const bytes = base64ToUint8Array(gtz.gpBase64);
    api.load(bytes);
  }


  // -------- 多轨道：默认显示全部轨道 + 轨道开关 --------
  function setupTracks(api){
    const btnTracks = document.getElementById("btn-tracks");
    const panel = document.getElementById("track-panel");
    const listEl = document.getElementById("track-list");
    const btnClose = document.getElementById("btn-track-close");
    const btnAll = document.getElementById("btn-track-all");
    const btnNone = document.getElementById("btn-track-none");

    if (!btnTracks || !panel || !listEl) return;

    function openPanel(){ panel.style.display = "block"; }
    function closePanel(){ panel.style.display = "none"; }

    btnTracks.addEventListener("click", () => {
      if (panel.style.display === "block") closePanel(); else openPanel();
    });
    btnClose?.addEventListener("click", closePanel);

    // 点击遮罩关闭：这里用简单的“点面板外关闭”
    document.addEventListener("click", (e) => {
      if (panel.style.display !== "block") return;
      const t = e.target;
      if (t === btnTracks) return;
      if (panel.contains(t)) return;
      closePanel();
    });

    function getTrackIndexes(){
      const tracks = (api.score && api.score.tracks) ? api.score.tracks : [];
      return tracks.map((t, i) => (typeof t.index === "number" ? t.index : i));
    }

    function applyTracks(indexes){
      try{
        // alphaTab Web：通过 settings.core.tracks 控制显示轨道
        api.settings.core = api.settings.core || {};
        api.settings.core.tracks = indexes;
        api.updateSettings();
      }catch(err){
        // 兼容：如果 updateSettings 不存在，就尝试直接 render
        try{ api.render(); }catch(e){}
      }
    }

    function rebuildPanel(){
      const tracks = (api.score && api.score.tracks) ? api.score.tracks : [];
      const allIdx = getTrackIndexes();
      // 如果没有轨道信息，就先清空
      listEl.innerHTML = "";
      tracks.forEach((t, i) => {
        const idx = (typeof t.index === "number" ? t.index : i);
        const name = (t.name || t.trackName || `Track ${idx+1}`);
        const row = document.createElement("label");
        row.innerHTML = `<input type="checkbox" data-track="${idx}" checked /> <span>${escapeHtml(name)}</span>`;
        listEl.appendChild(row);
      });

      // 默认：全部选中显示
      applyTracks(allIdx);

      // 绑定 change
      listEl.querySelectorAll("input[type=checkbox]").forEach(cb => {
        cb.addEventListener("change", () => {
          const selected = Array.from(listEl.querySelectorAll("input[type=checkbox]"))
            .filter(x => x.checked)
            .map(x => parseInt(x.getAttribute("data-track"), 10))
            .filter(n => !Number.isNaN(n));
          // 至少保留 1 条，避免空白
          applyTracks(selected.length ? selected : [allIdx[0] ?? 0]);
        });
      });

      btnAll?.addEventListener("click", () => {
        listEl.querySelectorAll("input[type=checkbox]").forEach(x => x.checked = true);
        applyTracks(allIdx);
      });
      btnNone?.addEventListener("click", () => {
        const cbs = Array.from(listEl.querySelectorAll("input[type=checkbox]"));
        cbs.forEach(x => x.checked = false);
        if (cbs[0]) cbs[0].checked = true;
        applyTracks([parseInt(cbs[0].getAttribute("data-track"),10) || 0]);
      });
    }

    // 在每次加载新谱后重建轨道面板
    try{ api.scoreLoaded && api.scoreLoaded.on && api.scoreLoaded.on(() => { rebuildPanel(); }); }catch(e){}
  }

  // -------- GTZ 歌词显示补偿：字体/字间距 + 段落行距（通过调整 y） --------
  function setupLyricTuning(api){
    const extraRowGap = 6; // 每一行歌词额外增加的间距（像素）
    // renderFinished 在每次渲染 SVG 后触发：我们对 SVG 里歌词 text 做轻量修正
    api.renderFinished.on(() => {
      try{
        const container = document.getElementById("score-container");
        const svg = container ? container.querySelector("svg") : null;
        if (!svg) return;

        // 找到“看起来像歌词”的 text
        const texts = Array.from(svg.querySelectorAll('text[class*="lyric"], text[class*="Lyric"], text.at-lyrics, .at-lyrics text'));
        if (!texts.length) return;

        // 收集行（按 y 分组）
        const rowsMap = new Map(); // yKey -> [el...]
        texts.forEach(el => {
          const yAttr = el.getAttribute("y");
          if (!yAttr) return;
          const y = parseFloat(yAttr);
          if (!Number.isFinite(y)) return;
          const yKey = Math.round(y); // 容错
          if (!rowsMap.has(yKey)) rowsMap.set(yKey, []);
          rowsMap.get(yKey).push(el);

          // 记录原始 y，避免重复叠加
          if (!el.getAttribute("data-orig-y")) el.setAttribute("data-orig-y", yAttr);
        });

        const rowKeys = Array.from(rowsMap.keys()).sort((a,b)=>a-b);
        rowKeys.forEach((yKey, idx) => {
          const delta = idx * extraRowGap;
          rowsMap.get(yKey).forEach(el => {
            const orig = parseFloat(el.getAttribute("data-orig-y"));
            if (!Number.isFinite(orig)) return;
            el.setAttribute("y", String(orig + delta));
          });
        });
      }catch(e){
        // 静默失败：不影响主渲染
      }
    });
  }

  function msToMMSS(ms) {
    const totalSec = Math.max(0, Math.floor(ms / 1000));
    const m = String(Math.floor(totalSec / 60)).padStart(2, "0");
    const s = String(totalSec % 60).padStart(2, "0");
    return `${m}:${s}`;
  }

  let __playerUi = null;
  function setupPlayerBar(api) {
    if (__playerUi) return;
    const btnPrev = document.getElementById("btn-player-prev");
    const btnPlay = document.getElementById("btn-player-play");
    const btnNext = document.getElementById("btn-player-next");
    const timeEl = document.getElementById("player-time");
    const progressEl = document.getElementById("player-progress");
    const indicatorEl = document.getElementById("player-indicator");

    __playerUi = { btnPrev, btnPlay, btnNext, timeEl, progressEl, indicatorEl, isSeeking: false, totalMs: 0 };

    // 复用页面已有上一首/下一首逻辑（按钮在顶部）
    btnPrev?.addEventListener("click", () => document.getElementById("btn-prev")?.click());
    btnNext?.addEventListener("click", () => document.getElementById("btn-next")?.click());

    // 播放/暂停：用户点击时再提示“音源加载”
    btnPlay?.addEventListener("click", async () => {
      try {
        indicatorEl.textContent = "音源加载中…";
        indicatorEl.style.display = "block";
        await api.playPause();
      } catch (e) {
        indicatorEl.textContent = "播放失败";
        console.error(e);
      }
    });

    // ---- 事件（不同版本可能没有，全部做防御）----
    try {
      api.soundFontLoad && api.soundFontLoad.on && api.soundFontLoad.on((e) => {
        const pct = (e && e.total) ? Math.floor((e.loaded / e.total) * 100) : 0;
        indicatorEl.textContent = `音源加载中… ${pct}%`;
        indicatorEl.style.display = "block";
      });
    } catch(e){}

    try {
      api.playerReady && api.playerReady.on && api.playerReady.on(() => {
        indicatorEl.style.display = "none";
        indicatorEl.textContent = "";
      });
    } catch(e){}

    try {
      api.playerStateChanged && api.playerStateChanged.on && api.playerStateChanged.on((args) => {
        const st = args && args.state;
        const playing = (alphaTab && alphaTab.synth && alphaTab.synth.PlayerState)
          ? (st === alphaTab.synth.PlayerState.Playing)
          : (String(st).toLowerCase().includes("playing"));
        btnPlay.textContent = playing ? "⏸" : "▶";
      });
    } catch(e){}

    // 进度刷新
    let previousSec = -1;
    try {
      api.playerPositionChanged && api.playerPositionChanged.on && api.playerPositionChanged.on((args) => {
        const cur = args?.currentTime ?? 0;
        const end = args?.endTime ?? 0;
        __playerUi.totalMs = end;
        const currentSec = Math.floor(cur / 1000);
        if (currentSec === previousSec) return;
        previousSec = currentSec;

        if (!__playerUi.isSeeking) {
          const max = Math.max(1, end);
          const v = Math.floor((cur / max) * 1000);
          progressEl.value = String(isFinite(v) ? v : 0);
          updateProgressVisual(progressEl);
        }
        timeEl.textContent = `${msToMMSS(cur)} / ${msToMMSS(end)}`;
      });
    } catch(e){}

    // 拖动进度条：圆点=thumb，拖动即 seek
    progressEl?.addEventListener("input", () => {
      __playerUi.isSeeking = true;
      updateProgressVisual(progressEl);

      const v = parseInt(progressEl.value, 10);
      const total = __playerUi.totalMs || parseTimeFromText((timeEl.textContent || "00:00 / 00:00").split("/")[1] || "00:00");
      const target = Math.floor(total * (v / 1000));
      timeEl.textContent = `${msToMMSS(target)} / ${msToMMSS(total)}`;
    });

    progressEl?.addEventListener("change", () => {
      const v = parseInt(progressEl.value, 10);
      const total = __playerUi.totalMs || parseTimeFromText((timeEl.textContent || "00:00 / 00:00").split("/")[1] || "00:00");
      const target = Math.floor(total * (v / 1000));
      try { api.timePosition = target; } catch(e) {}
      __playerUi.isSeeking = false;
    });

    // 谱面加载完成（不依赖音源）
    try{
      api.scoreLoaded && api.scoreLoaded.on && api.scoreLoaded.on(() => {
        indicatorEl.textContent = "就绪";
        indicatorEl.style.display = "block";
      });
    }catch(e){}

    // 初始 UI
    btnPlay.textContent = "▶";
    indicatorEl.textContent = "音源未加载";
    indicatorEl.style.display = "block";
    updateProgressVisual(progressEl);
  }

  
  function updateProgressVisual(rangeEl){
    if (!rangeEl) return;
    const min = parseFloat(rangeEl.min || "0");
    const max = parseFloat(rangeEl.max || "1000");
    const val = parseFloat(rangeEl.value || "0");
    const pct = (max>min) ? ((val-min)/(max-min))*100 : 0;
    // 用 background-size 模拟“已播放蓝色/未播放灰色”
    rangeEl.style.backgroundSize = `${pct}% 100%`;
  }

function parseTimeFromText(t) {
    // t like " 03:12" or "03:12"
    const s = (t || "").trim();
    const m = s.match(/^(\d+):(\d{2})$/);
    if (!m) return 0;
    const min = parseInt(m[1], 10);
    const sec = parseInt(m[2], 10);
    return (min * 60 + sec) * 1000;
  }

  function setPlayerUI({ current, total, playing }) {
    const timeEl = document.getElementById("player-time");
    const progressEl = document.getElementById("player-progress");
    if (timeEl) timeEl.textContent = `${msToMMSS(current)} / ${msToMMSS(total)}`;
    if (progressEl) { progressEl.value = "0"; updateProgressVisual(progressEl); }
    const btnPlay = document.getElementById("btn-player-play");
    if (btnPlay) btnPlay.textContent = playing ? "⏸" : "▶";
  }
  // ===== /alphaTab + .gtz 加载 =====

function pad4(num) {
    return String(num).padStart(4, "0");
  }

  function parseQuery() {
    const params = new URLSearchParams(window.location.search);
    const book = params.get("book") || "c";
    let no = parseInt(params.get("no") || "1", 10);
    if (!Number.isFinite(no) || no < 1) no = 1;
    state.currentBook = (book === "ts") ? "ts" : "c";
    state.currentNo = no;
  }

  function getRangeIndex(no) {
    return Math.floor((no - 1) / 100); // 1-100 -> 0, 101-200 -> 1 ...
  }

  function getRangeFilePath(bookKey, rangeIndex) {
    const start = rangeIndex * 100 + 1;
    const end = (rangeIndex + 1) * 100;
    const folder = BOOKS[bookKey].folderText;
    return `assets/${folder}/${bookKey}_${start}_${end}.json`;
  }

  async function loadRange(bookKey, rangeIndex) {
    if (state.loadedRanges[bookKey][rangeIndex]) return true;
    const url = getRangeFilePath(bookKey, rangeIndex);
    try {
      const res = await fetch(url);
      if (!res.ok) {
        state.loadedRanges[bookKey][rangeIndex] = true;
        return false;
      }
      const json = await res.json();
      if (!Array.isArray(json) || json.length === 0) {
        state.loadedRanges[bookKey][rangeIndex] = true;
        return false;
      }
      state.data[bookKey] = state.data[bookKey].concat(json);
      state.loadedRanges[bookKey][rangeIndex] = true;
      return true;
    } catch (e) {
      console.error("加载区间失败", bookKey, rangeIndex, e);
      state.loadedRanges[bookKey][rangeIndex] = true;
      return false;
    }
  }

  async function ensureRangeForNo(bookKey, no) {
    const rangeIndex = getRangeIndex(no);
    return await loadRange(bookKey, rangeIndex);
  }

  function findLocalSong(bookKey, no) {
    const songs = state.data[bookKey] || [];
    return songs.find(s => s.no === no) || null;
  }

  async function getSong(bookKey, no) {
    await ensureRangeForNo(bookKey, no);
    return findLocalSong(bookKey, no);
  }

  function renderScore(bookKey, no) {
    const container = document.getElementById("score-view");
    // alphaTab 渲染容器（在 HTML 里我们放了 #alphaTab）
    const atEl = document.getElementById("alphaTab");

    // 首次初始化 alphaTab API
    if (!window.__atApi) {
      const settings = {
        // 文件由我们手动 load(ArrayBuffer) 提供，因此这里不设置 file
        display: {
          scale: 1.0
        },
        player: {
          enablePlayer: true,
          // alphaTab 官方教程示例音源（SoundFont2）
          soundFont: 'https://cdn.jsdelivr.net/npm/@coderline/alphatab@latest/dist/soundfont/sonivox.sf2',
          // 播放时滚动这个元素
          scrollElement: container
        }
      };

      window.__atApi = new alphaTab.AlphaTabApi(atEl, settings);

      // 播放条绑定
      setupPlayerBar(window.__atApi);

      // 多轨道：默认全部轨道显示 + 轨道开关 UI
      setupTracks(window.__atApi);

      // GTZ 歌词显示：字体与段落间距补偿（避免 gtz 未带出设置时太小/太挤）
      setupLyricTuning(window.__atApi);
    }

    // 加载 .gtz (JSON) -> 解 base64 -> load 到 alphaTab
    const gtzPrefix = BOOKS[bookKey].gtzPrefix || BOOKS[bookKey].svgPrefix;
    const gtzUrl = `${gtzPrefix}${pad4(no)}_cn_g.gtz`; // 如 assets/c/c0001_cn_g.gtz

    loadGtzIntoAlphaTab(window.__atApi, gtzUrl).catch(err => {
      console.error("加载 gtz 失败:", err);
      // fallback: 如果没有 gtz，就尝试旧的 svg（便于过渡）
      try {
        container.innerHTML = "";
        const folderPrefix = BOOKS[bookKey].svgPrefix;
        const src = `${folderPrefix}${pad4(no)}_cn_g.svg`;
        const img = document.createElement("img");
        img.alt = `${BOOKS[bookKey].label} 第 ${no} 首 吉他谱`;
        img.src = src;
        container.appendChild(img);
      } catch (e) {}
    });
  }


  function renderLyrics(song) {
    const root = document.getElementById("lyrics-view");
    root.innerHTML = "";
    if (!song || !song.lyrics) return;

    root.style.fontSize = state.lyricsFontSize + "px";

    song.lyrics.forEach(section => {
      const sec = document.createElement("div");
      sec.className = "lyrics-section";

      const noDiv = document.createElement("div");
      noDiv.className = "lyrics-section-no";
      noDiv.textContent = section.section_no || "";

      const linesWrap = document.createElement("div");
      linesWrap.className = "lyrics-lines";

      (section.lines || []).forEach(lineText => {
        const p = document.createElement("p");
        p.textContent = convertTextByScript(lineText || "");
        linesWrap.appendChild(p);
      });

      sec.appendChild(noDiv);
      sec.appendChild(linesWrap);
      root.appendChild(sec);
    });
  }

  function updateTitle(song) {
    const titleEl = document.getElementById("song-title");
    if (song && song.title) {
      titleEl.textContent = song.title;
      document.title = song.title + " - 召会诗歌吉他谱";
    } else {
      titleEl.textContent = `${BOOKS[state.currentBook].label} 第 ${state.currentNo} 首`;
      document.title = titleEl.textContent;
    }
  }

  function setMode(mode) {
    state.mode = mode;
    const scoreView = document.getElementById("score-view");
    const lyricsView = document.getElementById("lyrics-view");

    const btnScore = document.getElementById("btn-mode-score");
    const btnLyrics = document.getElementById("btn-mode-lyrics");

    if (mode === "score") {
      scoreView.style.display = "";
      scoreView.setAttribute("aria-hidden", "false");
      lyricsView.style.display = "none";
      lyricsView.setAttribute("aria-hidden", "true");
      btnScore.classList.add("active");
      btnLyrics.classList.remove("active");
    } else {
      scoreView.style.display = "none";
      scoreView.setAttribute("aria-hidden", "true");
      lyricsView.style.display = "";
      lyricsView.setAttribute("aria-hidden", "false");
      btnScore.classList.remove("active");
      btnLyrics.classList.add("active");
    }
  }

  function syncBookButtons() {
    document.getElementById("btn-book-c").classList.toggle("active", state.currentBook === "c");
    document.getElementById("btn-book-ts").classList.toggle("active", state.currentBook === "ts");
  }

  function syncScriptButton() {
    const btn = document.getElementById("btn-script");
    // 当前歌词是简体 -> 按钮显示“繁”；当前歌词繁体 -> 按钮显示“简”
    if (state.script === "simplified") {
      btn.textContent = "繁";
      btn.classList.remove("active");
    } else {
      btn.textContent = "简";
      btn.classList.add("active");
    }
  }

  function updateURL() {
    const url = new URL(window.location.href);
    url.searchParams.set("book", state.currentBook);
    url.searchParams.set("no", String(state.currentNo));
    window.history.replaceState({}, "", url.toString());
  }

  async function loadAndRenderCurrentSong() {
    const song = await getSong(state.currentBook, state.currentNo);
    if (!song) {
      alert("找不到这首诗歌的歌词数据。");
      return;
    }
    updateTitle(song);
    renderScore(state.currentBook, state.currentNo);
    renderLyrics(song);
    setMode(state.mode); // 保持当前 吉他 / 歌词 模式
    syncScriptButton();
  }

  async function tryGoTo(delta) {
    const newNo = state.currentNo + delta;
    if (newNo <= 0) {
      alert("已经是第一首了。");
      return;
    }
    const song = await getSong(state.currentBook, newNo);
    if (!song) {
      alert(delta > 0 ? "已经是最后一首了。" : "已经是第一首了。");
      return;
    }
    state.currentNo = newNo;
    updateURL();
    await loadAndRenderCurrentSong();
  }

  function goToNumber(no) {
    state.currentNo = no;
    updateURL();
    loadAndRenderCurrentSong();
  }

  function handleSearch() {
    const raw = document.getElementById("search-input").value.trim();
    if (!raw) return;
    const digitsMatch = raw.match(/(\d{1,4})$/);
    if (!digitsMatch) {
      alert("请输入正确的编号，如 31");
      return;
    }
    const no = parseInt(digitsMatch[1], 10);
    if (!Number.isFinite(no)) {
      alert("请输入正确的编号，如 31");
      return;
    }
    goToNumber(no);
  }

  document.addEventListener("DOMContentLoaded", async () => {
    parseQuery();
    document.getElementById("search-input").value = state.currentNo;  // ★ 显示当前编号
    syncBookButtons();
    syncScriptButton(); // 默认：歌词简体，按钮显示“繁”

    document.getElementById("btn-back").addEventListener("click", () => {
      window.location.href = "index.html";
    });

    document.getElementById("btn-prev").addEventListener("click", () => {
      tryGoTo(-1);
    });

    document.getElementById("btn-next").addEventListener("click", () => {
      tryGoTo(1);
    });

    // 大本 / 小本切换
    document.querySelectorAll(".search-book-btn").forEach(btn => {
      btn.addEventListener("click", async () => {
        const book = btn.dataset.book;
        if (state.currentBook === book) return;
        state.currentBook = book;
        syncBookButtons();
        // 同编号若不存在，会在 loadAndRenderCurrentSong 里提示
        updateURL();
        await loadAndRenderCurrentSong();
      });
    });

    // 搜索
    document.getElementById("btn-search").addEventListener("click", handleSearch);
    document.getElementById("search-input").addEventListener("keydown", e => {
      if (e.key === "Enter") {
        e.preventDefault();
        handleSearch();
      }
    });

    // 吉他 / 歌词模式
    document.getElementById("btn-mode-score").addEventListener("click", () => {
      setMode("score");
    });
    document.getElementById("btn-mode-lyrics").addEventListener("click", () => {
      setMode("lyrics");
    });

    // 简繁按钮：一个位置，文字互换
    document.getElementById("btn-script").addEventListener("click", () => {
      state.script = (state.script === "simplified") ? "traditional" : "simplified";
      syncScriptButton();
      // 重新渲染歌词，让转换生效
      getSong(state.currentBook, state.currentNo).then(song => {
        if (song) renderLyrics(song);
      });
    });

    // 字号 + / -
    document.getElementById("btn-font-plus").addEventListener("click", () => {
  // 每次 +3，最大 32
  state.lyricsFontSize = Math.min(state.lyricsFontSize + 3, 40);
  getSong(state.currentBook, state.currentNo).then(song => {
    if (song) renderLyrics(song);
      });
    });
   document.getElementById("btn-font-minus").addEventListener("click", () => {
  // 每次 -3，最小 12 保持不变
  state.lyricsFontSize = Math.max(state.lyricsFontSize - 3, 12);
  getSong(state.currentBook, state.currentNo).then(song => {
    if (song) renderLyrics(song);
      });
    });

    await loadAndRenderCurrentSong();
  });

</script>

  <!-- 轨道开关面板 -->
  <div class="track-panel" id="track-panel" role="dialog" aria-modal="true" aria-label="轨道开关">
    <div class="track-title">
      <div style="font-weight:700;">轨道</div>
      <button class="player-btn" id="btn-track-close" style="padding:6px 10px; border-radius:12px;">关闭</button>
    </div>
    <div class="track-list" id="track-list"></div>
    <div class="track-actions">
      <button class="player-btn" id="btn-track-all" style="padding:8px 10px;">全选</button>
      <button class="player-btn" id="btn-track-none" style="padding:8px 10px;">全不选</button>
    </div>
  </div>

</body>
</html>
