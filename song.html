<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>乐谱</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body class="page-body song-page-body">
  <div class="mobile-shell song-shell">
    <section class="toolbar-card">
      <div class="toolbar-scroll">
        <div class="toolbar-row">
          <button id="btnHome" class="toolbar-btn icon-only" type="button" aria-label="首页">⌂</button>
          <button id="btnTempo" class="toolbar-btn value-btn" type="button">95</button>
          <button id="btnKey" class="toolbar-btn value-btn" type="button">Ab</button>
          <button id="btnCapo" class="toolbar-btn value-btn" type="button">CP0</button>
          <button id="btnMode" class="toolbar-btn value-btn" type="button">吉</button>
          <button id="btnPrev" class="toolbar-btn icon-only" type="button" aria-label="上一首">◀</button>
          <button id="btnPlay" class="toolbar-btn play-btn" type="button" aria-label="播放">▶</button>
          <button id="btnNext" class="toolbar-btn icon-only" type="button" aria-label="下一首">▶</button>
          <button id="btnText" class="toolbar-btn value-btn" type="button">字</button>
          <button id="btnTracks" class="toolbar-btn value-btn" type="button">轨</button>
          <button id="btnNotation" class="toolbar-btn value-btn focus-btn" type="button">谱</button>
          <button id="btnLang" class="toolbar-btn icon-only" type="button" aria-label="语言">🌐</button>
          <button id="btnSearch" class="toolbar-btn icon-only" type="button" aria-label="搜索">⌕</button>
        </div>
      </div>

      <div id="panelTempo" class="menu-panel hidden">
        <div class="menu-title">速度</div>
        <div class="slider-row">
          <input id="tempoRange" type="range" min="40" max="240" step="1" />
          <span id="tempoValueLabel" class="slider-value">95</span>
        </div>
        <div class="menu-actions">
          <button id="tempoReset" class="soft-btn" type="button">恢复</button>
        </div>
      </div>

      <div id="panelTranspose" class="menu-panel hidden">
        <div class="menu-title">转调</div>
        <div class="stepper-row">
          <button id="transposeDown" class="round-btn" type="button">−</button>
          <div id="transposeValueLabel" class="stepper-value">0</div>
          <button id="transposeUp" class="round-btn" type="button">＋</button>
        </div>
        <div class="menu-actions">
          <button id="transposeReset" class="soft-btn" type="button">恢复</button>
        </div>
      </div>

      <div id="panelMode" class="menu-panel hidden option-grid two-col">
        <button data-mode="score" class="option-btn active" type="button">吉他谱</button>
        <button data-mode="lyrics" class="option-btn" type="button">歌词</button>
      </div>

      <div id="panelText" class="menu-panel hidden stacked-panel">
        <div class="menu-subgroup">
          <div class="menu-subtitle">谱词字号</div>
          <div class="stepper-row compact">
            <button id="fontDown" class="round-btn" type="button">−</button>
            <div id="fontValueLabel" class="stepper-value">30</div>
            <button id="fontUp" class="round-btn" type="button">＋</button>
          </div>
        </div>
        <div class="menu-subgroup">
          <div class="menu-subtitle">谱间距</div>
          <div class="stepper-row compact">
            <button id="spacingDown" class="round-btn" type="button">−</button>
            <div id="spacingValueLabel" class="stepper-value">2.0x</div>
            <button id="spacingUp" class="round-btn" type="button">＋</button>
          </div>
        </div>
      </div>

      <div id="panelTracks" class="menu-panel hidden stacked-panel">
        <div class="menu-title">轨道</div>
        <div class="menu-actions track-actions">
          <button id="tracksAll" class="soft-btn" type="button">全选</button>
          <button id="tracksNone" class="soft-btn" type="button">全不选</button>
        </div>
        <div id="trackList" class="track-list"></div>
      </div>

      <div id="panelNotation" class="menu-panel hidden option-grid two-col">
        <button data-notation="staff" class="option-btn active" type="button">五线谱</button>
        <button data-notation="jianpu" class="option-btn" type="button">简谱</button>
      </div>

      <div id="panelLang" class="menu-panel hidden option-grid three-col">
        <button data-lang="zh-cn" class="option-btn active" type="button">简体</button>
        <button data-lang="zh-hant" class="option-btn" type="button">繁体</button>
        <button data-lang="en" class="option-btn" type="button">EN</button>
      </div>

      <div id="panelSearch" class="menu-panel hidden search-panel song-search-panel">
        <div class="search-book-toggle">
          <button id="songBookC" class="book-chip active" type="button">大本</button>
          <button id="songBookTs" class="book-chip" type="button">小本</button>
        </div>
        <div class="search-input-row">
          <input id="songSearchInput" class="song-search-input" type="text" placeholder="输入编号，如 1" />
          <button id="songSearchBtn" class="icon-btn ghost" type="button" aria-label="搜索">⌕</button>
        </div>
      </div>

      <div class="progress-wrap">
        <input id="progressRange" class="progress-range" type="range" min="0" max="1000" value="0" />
        <div id="timeLabel" class="time-label">00:00</div>
      </div>
    </section>

    <section class="title-block">
      <h1 id="mainTitle" class="main-title">加载中…</h1>
      <div id="subTitle" class="sub-title"></div>
    </section>

    <section id="scoreView" class="score-view visible">
      <div id="alphaTabHost" class="alphatab-host"></div>
      <div id="errorBox" class="error-box hidden"></div>
    </section>

    <section id="lyricsView" class="lyrics-view hidden">
      <div id="lyricsContent" class="lyrics-content"></div>
    </section>
  </div>

  <script src="./assets/alphatab/alphaTab.js"></script>
  <script src="./app.js"></script>
</body>
</html>
