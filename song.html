
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>V20 Rebuild Test</title>
<style>
body { font-family: Arial; }
#version { position:fixed;bottom:5px;right:10px;color:#888;font-size:12px; }
</style>
</head>
<body>

<h2>V20 Rebuild Test (Skeleton)</h2>

<script>
// ===== V20 CORE STATE =====
const currentPerformanceState = {
  mode: "original",
  pattern: "R3231323",
  transpose: 0,
  targetKey: "Ab",
  schemeId: "A",
  scheme: { capo: 1, shapeFamily: "G", chordMap: {} }
};

function updateState(patch){
  Object.assign(currentPerformanceState, patch);
  computeAndRender();
}

function computeTargetKey(){
  currentPerformanceState.targetKey = "DemoKey";
}

function computeScheme(){
  currentPerformanceState.scheme = {
    capo: currentPerformanceState.schemeId === "A" ? 1 :
          currentPerformanceState.schemeId === "B" ? 3 : 6,
    shapeFamily: ["G","F","D"][["A","B","C"].indexOf(currentPerformanceState.schemeId)],
    chordMap: {}
  };
}

function computeAndRender(){
  computeTargetKey();
  computeScheme();
  renderFromState();
}

function renderFromState(){
  console.log("RENDER", JSON.stringify(currentPerformanceState,null,2));
}
</script>

<div id="version">build: V20-rebuild</div>

</body>
</html>
