<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Safe Version</title></head>
<body>
<h3>Auto Accompaniment Safe Version</h3>
<button id="btnSwitchRhythm">切换节奏</button>

<script>
window.__rhythmPatternIndex = 0;

function switchRhythmPattern() {
  window.__rhythmPatternIndex =
    (window.__rhythmPatternIndex + 1) % 3;

  console.log("当前节奏索引:", window.__rhythmPatternIndex);
}

document.getElementById('btnSwitchRhythm')
  ?.addEventListener('click', switchRhythmPattern);

// mock existing vars so user can test
window.__autoAccompanimentSong = new Array(18).fill({measure:1});
window.__autoAccompanimentCurrentBar = {measure:1, chordRaw:'G'};
</script>
</body>
</html>
