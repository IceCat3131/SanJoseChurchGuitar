
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>诗歌</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="stylesheet" href="style.css" />
  <script src="assets/alphatab/alphaTab.js"></script>
  <!-- 简繁转换库：opencc-js（浏览器 UMD 完整版） -->
  <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js"></script>

<style id="responsive-refactor-style">
  :root{
    --shell-bg:#ffffff;
    --shell-fg:#111827;
    --shell-muted:#6b7280;
    --shell-blue:#2563eb;
    --shell-soft:#eef3fb;
    --shell-border:#d8e1ef;
    --shell-card:#ffffff;
    --shell-shadow:0 6px 24px rgba(37,99,235,.08);
    --shell-radius:18px;
    --page-max:1400px;
  }
  body{background:#eef2f7;}
  .page{max-width:var(--page-max); margin:0 auto;}
  .page-inner{padding-top:12px;}
  .topbar,.player-bar,.meta-row,.adjust-row,.controls-row,.card > .search-bar{display:none !important;}
  #app-shell{display:block; margin:0 auto 10px; padding:10px 12px 0;}
  .shell-toolbar{
    display:grid;
    grid-template-columns:auto auto auto auto auto auto auto auto auto auto auto auto auto;
    gap:8px;
    align-items:center;
    background:rgba(255,255,255,.86);
    backdrop-filter:blur(8px);
    border:1px solid var(--shell-border);
    border-radius:22px;
    padding:10px 12px;
    box-shadow:var(--shell-shadow);
  }
  .shell-btn,.shell-pill{
    border:none;
    background:transparent;
    color:var(--shell-fg);
    font-weight:700;
    min-height:38px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:0 8px;
    border-radius:999px;
    cursor:pointer;
    white-space:nowrap;
  }
  .shell-btn:hover,.shell-pill:hover{background:#f3f6fb;}
  .shell-icon{font-size:18px;}
  .shell-play{
    width:42px; height:42px; padding:0; background:var(--shell-blue); color:#fff;
    box-shadow:0 6px 16px rgba(37,99,235,.25);
  }
  .shell-pill{font-size:15px;}
  .shell-pill.shell-mini{min-width:34px; padding:0 6px;}
  .shell-progress-wrap{position:relative; padding:10px 4px 0;}
  .shell-progress{
    width:100%; accent-color:var(--shell-blue);
  }
  .shell-time{
    text-align:center; margin-top:2px; color:#6b7280; font-size:14px; font-weight:600;
  }
  .shell-title-wrap{
    text-align:center; padding:8px 12px 10px;
  }
  .shell-main-title{font-size:clamp(22px,3.2vw,34px); line-height:1.25; font-weight:800; color:#111827;}
  .shell-sub-title{margin-top:4px; font-size:clamp(15px,2.2vw,22px); line-height:1.35; color:#374151; font-weight:700;}
  .shell-panels{
    display:grid;
    grid-template-columns:repeat(6,minmax(0,1fr));
    gap:12px;
    margin:0 0 12px;
  }
  .shell-panel{
    grid-column:span 2;
    background:rgba(255,255,255,.94);
    border:1px solid var(--shell-border);
    border-radius:18px;
    padding:14px;
    box-shadow:var(--shell-shadow);
  }
  .shell-panel-title{font-size:14px; color:var(--shell-muted); font-weight:700; margin-bottom:10px;}
  .shell-panel-row{display:flex; align-items:center; gap:10px;}
  .shell-panel-row input[type="range"]{flex:1; accent-color:var(--shell-blue);}
  .shell-panel-value{font-size:18px; font-weight:800; color:var(--shell-blue); min-width:48px; text-align:center;}
  .shell-panel-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:12px;}
  .shell-panel-btn,.shell-option-btn,.shell-seg-btn,.shell-step-btn{
    border:1px solid var(--shell-border);
    background:#fff;
    color:var(--shell-fg);
    border-radius:12px;
    min-height:40px;
    padding:0 14px;
    font-weight:700;
    cursor:pointer;
  }
  .shell-primary{background:var(--shell-blue); color:#fff; border-color:transparent;}
  .shell-option-list{display:flex; gap:10px; flex-wrap:wrap;}
  .shell-grid-two{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px;}
  .shell-control-card{background:var(--shell-soft); border-radius:14px; padding:10px;}
  .shell-control-label{font-size:13px; color:var(--shell-muted); margin-bottom:8px; font-weight:700;}
  .shell-panel-stepper{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .shell-step-btn{width:40px; padding:0; font-size:24px; line-height:1;}
  .shell-search-book{display:flex; gap:8px; margin-bottom:10px;}
  .shell-seg-btn.active,.shell-option-btn.active{background:var(--shell-blue); color:#fff; border-color:transparent;}
  .shell-search-row{display:flex; gap:8px;}
  .shell-search-input{
    flex:1; min-width:0; border:1px solid var(--shell-border); border-radius:12px; min-height:42px; padding:0 12px; font-size:16px;
  }
  .shell-panel-note{margin-top:8px; color:var(--shell-muted); font-size:12px;}
  .content-card{background:#fff; border-radius:24px; box-shadow:var(--shell-shadow); border:1px solid var(--shell-border);}
  #score-view{padding-top:8px;}
  @media (max-width: 1024px){
    .shell-toolbar{
      grid-template-columns:repeat(13,minmax(0,auto));
      overflow-x:auto;
      scrollbar-width:none;
    }
    .shell-toolbar::-webkit-scrollbar{display:none;}
    .shell-panels{grid-template-columns:repeat(2,minmax(0,1fr));}
    .shell-panel{grid-column:span 1;}
  }
  @media (max-width: 767px){
    .page-inner{padding-top:6px;}
    #app-shell{padding:8px 8px 0;}
    .shell-toolbar{
      grid-template-columns:repeat(13,max-content);
      gap:6px;
      padding:8px 10px;
      border-radius:18px;
    }
    .shell-btn,.shell-pill{min-height:34px; font-size:14px; padding:0 6px;}
    .shell-play{width:38px; height:38px;}
    .shell-progress-wrap{padding:8px 2px 0;}
    .shell-time{font-size:13px;}
    .shell-title-wrap{padding:6px 8px 8px;}
    .shell-main-title{font-size:clamp(16px,6vw,28px);}
    .shell-sub-title{font-size:clamp(13px,4.2vw,18px);}
    .shell-panels{grid-template-columns:1fr; gap:10px;}
    .shell-panel{grid-column:span 1; padding:12px;}
    .shell-grid-two{grid-template-columns:1fr;}
    .content-card{border-radius:18px;}
  }
</style>


<style id="responsive-safe-refactor">
  :root{
    --bg:#eef2f7;
    --card:#ffffff;
    --text:#111827;
    --muted:#6b7280;
    --blue:#2563eb;
    --border:#dbe4f0;
    --radius:18px;
    --shadow:0 8px 24px rgba(37,99,235,.08);
  }
  html,body{background:var(--bg);}
  body{color:var(--text);}
  .page{max-width:1400px; margin:0 auto;}
  .page-inner{padding:10px 12px 24px;}
  .card,.player-bar,.meta-row,.adjust-row,.content-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
  }

  .topbar{
    display:grid;
    grid-template-columns:auto auto 1fr auto;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
    padding:0 4px;
  }
  .topbar-left{display:flex; align-items:center;}
  .topbar-button{
    min-width:40px; height:40px; border:none; background:transparent; color:var(--blue);
    border-radius:999px; font-size:20px; font-weight:700;
  }
  .topbar-button:hover{background:#edf4ff;}
  .topbar-title{
    text-align:center; font-size:clamp(20px,2.6vw,34px); font-weight:800; line-height:1.2;
    min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }

  .search-bar{
    display:grid;
    grid-template-columns:auto 1fr;
    align-items:center;
    gap:12px;
    padding:12px 14px;
  }
  .search-book-toggle{
    display:flex; align-items:center; gap:0; background:#f3f6fb; border-radius:999px; padding:4px;
  }
  .search-book-btn{
    border:none; background:transparent; color:#64748b; font-weight:800; font-size:18px;
    padding:10px 14px; border-radius:999px;
  }
  .search-book-btn.active{background:#e8f0ff; color:var(--blue);}
  .search-book-divider{width:1px; height:22px; background:#cbd5e1;}
  .search-input-wrap{display:grid; grid-template-columns:1fr auto; align-items:center; gap:8px;}
  .search-input{
    width:100%; min-width:0; border:none; background:#f3f6fb; border-radius:999px;
    min-height:48px; padding:0 18px; font-size:20px; text-align:center; color:var(--text);
  }
  .search-input::placeholder{color:#94a3b8;}
  .search-icon-btn{
    border:none; background:#f3f6fb; border-radius:999px; min-width:48px; height:48px; font-size:22px;
  }

  .player-bar{
    display:grid;
    grid-template-columns:auto 1fr auto;
    align-items:center;
    gap:14px;
    padding:12px 14px;
    margin-top:10px;
  }
  .player-left{display:flex; align-items:center; gap:10px;}
  .player-btn{
    min-width:44px; height:44px; border:none; border-radius:14px; background:#f3f6fb; color:var(--blue);
    font-size:20px; font-weight:700;
  }
  .player-btn-primary{background:var(--blue); color:#fff; min-width:52px; height:52px; border-radius:18px;}
  .player-mid{min-width:0;}
  .player-time{text-align:center; font-size:14px; color:var(--muted); font-weight:700; margin-bottom:4px;}
  .player-progress{width:100%; accent-color:var(--blue);}
  .player-right{min-width:120px; text-align:right;}
  .player-indicator{font-size:13px; color:var(--muted);}

  .meta-row{
    display:flex; flex-wrap:wrap; gap:10px;
    padding:12px 14px;
    margin-top:10px;
  }
  .meta-pill{
    display:inline-flex; align-items:center; gap:4px; min-height:38px;
    padding:0 14px; border-radius:999px; background:#eef4ff; color:var(--blue); font-weight:800;
  }

  .adjust-row{
    display:grid;
    grid-template-columns:repeat(5,minmax(0,1fr));
    gap:12px;
    padding:12px 14px;
    margin-top:10px;
  }
  .adjust-group{
    min-width:0; display:flex; align-items:center; justify-content:center; gap:10px;
    background:#f8fbff; border-radius:14px; min-height:56px; padding:0 10px;
  }
  .adjust-group-slider{justify-content:space-between;}
  .adjust-label{font-size:15px; color:var(--muted); font-weight:700; white-space:nowrap;}
  .adjust-value{font-size:24px; color:var(--blue); font-weight:800; min-width:46px; text-align:center;}
  .mini-adjust-btn{
    width:34px; height:34px; border:none; border-radius:999px; background:#e9f1ff; color:var(--blue);
    font-size:26px; line-height:1; font-weight:800;
  }
  .tempo-slider{flex:1; min-width:80px; accent-color:var(--blue);}

  .controls-row{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    margin:12px 0;
    padding:0 4px;
  }
  .controls-left{display:flex; align-items:center; gap:10px; min-width:0;}
  .icon-plusminus-btn{
    width:42px; height:42px; border:none; background:transparent; color:var(--blue); font-size:34px; font-weight:800;
  }
  .mode-toggle{
    display:flex; align-items:center; background:#f3f6fb; border-radius:999px; padding:4px;
  }
  .mode-btn{
    border:none; background:transparent; min-width:72px; height:40px; border-radius:999px;
    color:#4b5563; font-size:18px; font-weight:800;
  }
  .mode-btn.active{background:var(--blue); color:#fff;}
  .script-toggle-btn{
    min-width:44px; height:42px; border:none; background:transparent; color:var(--blue); font-size:18px; font-weight:800;
  }

  .tracks-panel{
    position:fixed; right:12px; top:88px; z-index:9999;
    background:#fff; border:1px solid var(--border); border-radius:18px; box-shadow:var(--shadow);
  }

  .content-card{padding:8px; overflow:hidden;}
  #score-view.score-wrap{display:block; overflow:auto;}
  #alphaTab{max-width:100%;}
  #alphaTab svg, #alphaTab canvas{max-width:100%; height:auto !important;}
  .lyrics-root{padding:20px 16px;}

  @media (max-width: 1199px){
    .adjust-row{grid-template-columns:repeat(3,minmax(0,1fr));}
  }
  @media (max-width: 767px){
    .page-inner{padding:8px 8px 20px;}
    .topbar{grid-template-columns:auto auto 1fr auto; gap:6px;}
    .topbar-title{font-size:clamp(16px,6vw,26px);}
    .search-bar{grid-template-columns:1fr; gap:10px; padding:10px 12px;}
    .search-book-toggle{justify-self:start;}
    .search-input{font-size:18px; min-height:44px;}
    .search-icon-btn{min-width:44px; height:44px;}
    .player-bar{grid-template-columns:1fr; gap:10px;}
    .player-left,.player-right{justify-content:center;}
    .player-right{min-width:0; text-align:center;}
    .meta-row{gap:8px; padding:10px 12px;}
    .meta-pill{min-height:34px; padding:0 12px; font-size:14px;}
    .adjust-row{grid-template-columns:1fr; gap:10px; padding:10px 12px;}
    .adjust-group{justify-content:space-between; min-height:52px;}
    .adjust-value{font-size:22px;}
    .controls-row{gap:8px; align-items:center;}
    .controls-left{gap:6px;}
    .mode-btn{min-width:62px; font-size:17px;}
    .tracks-panel{right:8px; left:8px; top:auto; bottom:12px;}
    .content-card{padding:6px;}
  }
</style>

</head>
<body>
<div class="page">
  <div class="page-inner">

    <!-- 第 1 部分：返回首页 / 上一首 / 标题 / 下一首 -->
    <div class="topbar">
      <div class="topbar-left">
        <button class="topbar-button" id="btn-back" aria-label="返回首页">
  <svg viewBox="0 0 24 24" class="icon-home">
    <path d="M3 10.5 12 3l9 7.5v9.5a1 1 0 0 1-1 1h-5.5v-6h-5v6H4a1 1 0 0 1-1-1v-9.5z"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round" />
  </svg>
</button>
      </div>
      <button class="topbar-button" id="btn-prev" aria-label="上一首">&lt;</button>
      <div class="topbar-title" id="song-title">诗歌</div>
      <button class="topbar-button" id="btn-next" aria-label="下一首">&gt;</button>
    </div>

    <!-- 第 2 部分：搜索框 -->
    <div class="card">
      <div class="search-bar">
        <div class="search-book-toggle">
          <button class="search-book-btn" data-book="c" id="btn-book-c">大本</button>
          <div class="search-book-divider"></div>
          <button class="search-book-btn" data-book="ts" id="btn-book-ts">小本</button>
        </div>
        <div class="search-input-wrap">
          <input
            id="search-input"
            class="search-input"
            type="text"
            inputmode="numeric"
            pattern="[0-9]*"
            placeholder="输入编号，如31"
          />
          <button class="search-icon-btn" id="btn-search">
            <span class="search-icon">🔍</span>
          </button>
        </div>
      </div>
    </div>

    
    <!-- 播放条（放在搜索栏下方） -->
    <div class="player-bar card" id="player-bar">
      <div class="player-left">
        <button class="player-btn" id="btn-player-prev" aria-label="上一首">⏮</button>
        <button class="player-btn player-btn-primary" id="btn-player-play" aria-label="播放/暂停">▶</button>
        <button class="player-btn" id="btn-player-next" aria-label="下一首">⏭</button>
      </div>
      <div class="player-mid">
        <div class="player-time" id="player-time">00:00 / 00:00</div>
        <input class="player-progress" id="player-progress" type="range" min="0" max="1000" value="0" />
      </div>
      <div class="player-right">
        <div class="player-indicator" id="player-indicator"><span id="player-status">音源未加载</span></div>
      </div>
    </div>

    <div class="meta-row card" id="meta-row">
      <div class="meta-pill">速度 <span id="meta-tempo">--</span></div>
      <div class="meta-pill">调 <span id="meta-key">--</span></div>
      <div class="meta-pill">Capo <span id="meta-capo">0</span></div>
      <div class="meta-pill">播放 <span id="meta-speed">100%</span></div>
    </div>

    <div class="adjust-row card">
      <div class="adjust-group">
        <span class="adjust-label">谱词字号</span>
        <button class="mini-adjust-btn" id="btn-score-font-minus">−</button>
        <span class="adjust-value" id="score-font-value">30</span>
        <button class="mini-adjust-btn" id="btn-score-font-plus">+</button>
      </div>
      <div class="adjust-group">
        <span class="adjust-label">谱词距</span>
        <button class="mini-adjust-btn" id="btn-spacing-minus">−</button>
        <span class="adjust-value" id="spacing-value">2.0x</span>
        <button class="mini-adjust-btn" id="btn-spacing-plus">+</button>
      </div>
      <div class="adjust-group adjust-group-slider">
        <span class="adjust-label">速度</span>
        <input id="tempo-slider" class="tempo-slider" type="range" min="50" max="150" value="100" step="5" />
        <span class="adjust-value" id="tempo-slider-value">100%</span>
      </div>
      <div class="adjust-group">
        <span class="adjust-label">转调</span>
        <button class="mini-adjust-btn" id="btn-transpose-minus">−</button>
        <span class="adjust-value" id="transpose-value">0</span>
        <button class="mini-adjust-btn" id="btn-transpose-plus">+</button>
      </div>
      <div class="adjust-group">
        <span class="adjust-label">原始Capo</span>
        <span class="adjust-value" id="capo-value">0</span>
      </div>
    </div>

    <!-- 第 3 部分：+ / - / 吉他 / 歌词 / 简繁 -->
    <div class="controls-row">
      <div class="controls-left">
        <button class="icon-plusminus-btn" id="btn-font-plus">+</button>
        <button class="icon-plusminus-btn" id="btn-font-minus">−</button>
        <div class="mode-toggle">
          <button class="mode-btn active" id="btn-mode-score">吉他</button>
          <button class="mode-btn" id="btn-mode-lyrics">歌词</button>
        </div>
      </div>
      <!-- 简繁切换按钮：一个字，默认显示“繁”（当前歌词为简体） -->
      <button class="script-toggle-btn" id="btn-script">繁</button>
      <button class="script-toggle-btn" id="btn-tracks">轨</button>
      <div id="tracks-panel" class="tracks-panel hidden" role="dialog" aria-label="轨道开关">
        <div class="tracks-panel-inner">
          <div class="tracks-panel-title">轨道</div>
          <div class="tracks-panel-actions">
            <button type="button" id="tracks-all">全选</button>
            <button type="button" id="tracks-none">全不选</button>
            <button type="button" id="tracks-close">关闭</button>
          </div>
          <div id="tracks-list" class="tracks-list"></div>
        </div>
      </div>
    </div>

    <!-- 第 4 部分：内容 -->
    
    <div id="app-shell" class="app-shell">
      <div class="shell-toolbar">
        <button class="shell-btn shell-icon" id="shell-home" aria-label="首页">⌂</button>
        <button class="shell-pill" id="shell-speed-btn"><span id="shell-speed-label">95</span></button>
        <button class="shell-pill" id="shell-key-btn"><span id="shell-key-label">--</span></button>
        <div class="shell-pill shell-capo" id="shell-capo-pill">CP<span id="shell-capo-label">0</span></div>
        <button class="shell-pill shell-mode" id="shell-mode-btn"><span id="shell-mode-label">吉</span></button>
        <button class="shell-btn shell-icon" id="shell-prev" aria-label="上一首">⏮</button>
        <button class="shell-btn shell-play" id="shell-play" aria-label="播放">▶</button>
        <button class="shell-btn shell-icon" id="shell-next" aria-label="下一首">⏭</button>
        <button class="shell-pill shell-mini" id="shell-text-btn">字</button>
        <button class="shell-pill shell-mini" id="shell-track-btn">轨</button>
        <button class="shell-pill shell-mini" id="shell-staff-btn">谱</button>
        <button class="shell-btn shell-icon" id="shell-lang-btn" aria-label="语言">🌐</button>
        <button class="shell-btn shell-icon" id="shell-search-btn" aria-label="搜索">⌕</button>
      </div>
      <div class="shell-progress-wrap">
        <input class="shell-progress" id="shell-progress" type="range" min="0" max="1000" value="0" />
        <div class="shell-time" id="shell-time">00:00</div>
      </div>

      <div class="shell-title-wrap">
        <div class="shell-main-title" id="shell-main-title"></div>
        <div class="shell-sub-title" id="shell-sub-title"></div>
      </div>

      <div class="shell-panels">
        <div class="shell-panel" id="panel-speed" hidden>
          <div class="shell-panel-title">速度</div>
          <div class="shell-panel-row">
            <input id="panel-speed-range" type="range" min="50" max="150" step="5" value="100" />
            <div class="shell-panel-value" id="panel-speed-value">100%</div>
          </div>
          <div class="shell-panel-actions">
            <button class="shell-panel-btn" id="panel-speed-reset">恢复</button>
            <button class="shell-panel-btn shell-primary" data-close-panel>完成</button>
          </div>
        </div>

        <div class="shell-panel" id="panel-key" hidden>
          <div class="shell-panel-title">转调</div>
          <div class="shell-panel-row shell-panel-stepper">
            <button class="shell-step-btn" id="panel-key-minus">−</button>

<script>
  const BOOKS = {
    c: {
      label: "大本诗歌",
      folderText: "c_text",
      gtzPrefix: "assets/c/c",
      svgPrefix: "assets/c/c",
      codePrefix: "c"
    },
    ts: {
      label: "小本诗歌",
      folderText: "ts_text",
      gtzPrefix: "assets/ts/ts",
      svgPrefix: "assets/ts/ts",
      codePrefix: "ts"
    }
  };

  const MAX_RANGES = 20; // 最多支持 2000 首（够用了）

  const state = {
    currentBook: "c",
    currentNo: 1,
    // “显示模式”：score=吉他谱，lyrics=歌词
    mode: "score",
    // 歌词当前显示：simplified=简体, traditional=繁体
    script: "simplified",
    lyricsFontSize: 24,
    data: { c: [], ts: [] },
    loadedRanges: { c: {}, ts: {} }
  };

  const DEFAULT_VIEWER_PREFS = {
    scoreFontSizePx: 30,
    scoreSpacingFactor: 2.0,
    pureLyricsFontSize: 24,
    playbackSpeedPercent: 100,
    transposeSemitones: 0
  };

  let viewerPrefs = loadViewerPrefs();
  let __currentMeta = null;

  let converterToTraditional = null; // 简 -> 繁
  let converterToSimplified = null;  // 繁 -> 简

  function setupConvertersIfNeeded() {
    if (!window.OpenCC) return;
    if (!converterToTraditional) {
      // 简体（cn） -> 繁体（tw）
      converterToTraditional = OpenCC.Converter({ from: "cn", to: "tw" });
    }
    if (!converterToSimplified) {
      // 繁体（tw） -> 简体（cn）
      converterToSimplified = OpenCC.Converter({ from: "tw", to: "cn" });
    }
  }

  function convertTextByScript(text) {
    setupConvertersIfNeeded();
    if (state.script === "traditional" && converterToTraditional) {
      return converterToTraditional(text);
    }
    if (state.script === "simplified" && converterToSimplified) {
      return converterToSimplified(text); // 如果原 JSON 就是简体，这里基本等于原文
    }
    return text;
  }

  function loadViewerPrefs() {
    try {
      const raw = localStorage.getItem('sjcg.viewerPrefs.v1');
      if (!raw) return { ...DEFAULT_VIEWER_PREFS };
      const obj = JSON.parse(raw);
      if (obj && Object.prototype.hasOwnProperty.call(obj, 'capoOverride')) {
        try { delete obj.capoOverride; } catch (e) {}
      }
      return { ...DEFAULT_VIEWER_PREFS, ...obj };
    } catch (e) {
      return { ...DEFAULT_VIEWER_PREFS };
    }
  }

  function saveViewerPrefs() {
    try { localStorage.setItem('sjcg.viewerPrefs.v1', JSON.stringify(viewerPrefs)); } catch (e) {}
  }

  function getSongCapo() {
    const metaCapo = parseInt(window.__gtzMeta?.capo, 10);
    return Number.isFinite(metaCapo) ? Math.max(0, Math.min(12, metaCapo)) : 0;
  }

  function getEffectiveCapo() {
    return getSongCapo();
  }

  function getUserTranspose() {
    const n = parseInt(viewerPrefs.transposeSemitones, 10);
    return Number.isFinite(n) ? Math.max(-11, Math.min(11, n)) : 0;
  }

  function getEffectiveTranspose() {
    return getSongCapo() + getUserTranspose();
  }

  const NOTE_INDEX_SHARP = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
  const NOTE_INDEX_FLAT  = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];
  const NOTE_TO_INDEX = {
    C: 0, 'B#': 0,
    'C#': 1, Db: 1,
    D: 2,
    'D#': 3, Eb: 3,
    E: 4, Fb: 4,
    F: 5, 'E#': 5,
    'F#': 6, Gb: 6,
    G: 7,
    'G#': 8, Ab: 8,
    A: 9,
    'A#': 10, Bb: 10,
    B: 11, Cb: 11
  };

  function prefersFlatsFromKeyName(keyName) {
    if (!keyName) return true;
    return String(keyName).includes('b') || /^F(?:$|m)/i.test(String(keyName));
  }

  function transposePitchName(name, semitones, preferFlats) {
    if (!name || !Number.isFinite(semitones)) return name || '--';
    const normalized = String(name).trim();
    const m = normalized.match(/^([A-G](?:#|b)?)(.*)$/);
    if (!m) return normalized;
    const root = m[1];
    const suffix = m[2] || '';
    const idx = NOTE_TO_INDEX[root];
    if (idx == null) return normalized;
    const next = (idx + semitones % 12 + 12) % 12;
    const names = preferFlats ? NOTE_INDEX_FLAT : NOTE_INDEX_SHARP;
    return names[next] + suffix;
  }


  function transposeChordSymbol(symbol, semitones, preferFlats) {
    const raw = String(symbol || '').trim();
    if (!raw || !Number.isFinite(semitones) || semitones === 0) return raw;
    const m = raw.match(/^([A-G](?:#|b)?)([^/]*?)(?:\/([A-G](?:#|b)?))?$/);
    if (!m) return raw;
    const root = m[1];
    const quality = m[2] || '';
    const bass = m[3] || '';
    if (NOTE_TO_INDEX[root] == null) return raw;
    if (bass && NOTE_TO_INDEX[bass] == null) return raw;
    const nextRoot = transposePitchName(root, semitones, preferFlats);
    const nextBass = bass ? transposePitchName(bass, semitones, preferFlats) : '';
    return nextRoot + quality + (nextBass ? '/' + nextBass : '');
  }

  function looksLikeChordSymbol(text) {
    const s = String(text || '').trim();
    if (!s || s.length > 20) return false;
    if (!/^[A-G](?:#|b)?/.test(s)) return false;
    if (/[^A-Ga-g0-9#b\/()\-+susmajdimaugaddnoø°△mM ]/.test(s)) return false;
    return /^(?:[A-G](?:#|b)?)(?:m|maj|min|sus|dim|aug|add|[0-9]|\(|\/|$)/i.test(s);
  }

  function rewriteRenderedChordTexts() {
    const root = document.getElementById('alphaTab');
    if (!root) return;
    const semitones = getUserTranspose();
    const preferFlats = prefersFlatsFromKeyName((__currentMeta && __currentMeta.key_name) || '');
    const nodes = root.querySelectorAll('text, tspan');
    nodes.forEach((el) => {
      if (el.children && el.children.length) return;
      const current = (el.textContent || '').trim();
      if (!current) return;
      const original = el.getAttribute('data-orig-chord') || current;
      if (!looksLikeChordSymbol(original)) return;
      if (!el.getAttribute('data-orig-chord')) {
        el.setAttribute('data-orig-chord', original);
      }
      const next = semitones === 0 ? original : transposeChordSymbol(original, semitones, preferFlats);
      if (next && next !== current) {
        el.textContent = next;
      }
    });
  }

  let __chordObserver = null;
  let __chordRewriteTimer = null;
  function scheduleChordRewrite(delay = 80) {
    try { if (__chordRewriteTimer) clearTimeout(__chordRewriteTimer); } catch (e) {}
    __chordRewriteTimer = setTimeout(() => {
      rewriteRenderedChordTexts();
    }, delay);
  }

  function ensureChordObserver() {
    const root = document.getElementById('alphaTab');
    if (!root || __chordObserver) return;
    __chordObserver = new MutationObserver(() => {
      scheduleChordRewrite(30);
    });
    __chordObserver.observe(root, { childList: true, subtree: true, characterData: false });
  }

  function computeDisplayedKeyName(meta) {
    const m = meta || {};
    const original = m.key_name || '--';
    const semitones = getUserTranspose();
    if (!original || original === '--' || semitones === 0) return original;
    const preferFlats = prefersFlatsFromKeyName(original);
    return transposePitchName(original, semitones, preferFlats);
  }

  function getAllTracks(api) {
    const tracks = api?.score?.tracks || __currentScore?.tracks || [];
    return Array.isArray(tracks) ? tracks : [];
  }

  function getSelectedTrackIndices(api) {
    const tracks = getAllTracks(api);
    if (!tracks.length) return [];
    if (Array.isArray(__visibleTrackIndices)) return __visibleTrackIndices.slice();
    return tracks.map((_, i) => i);
  }

  function applyPlaybackTrackVisibility(api) {
    if (!api) return;
    const tracks = getAllTracks(api);
    if (!tracks.length || typeof api.changeTrackMute !== 'function') return;

    const selected = new Set(getSelectedTrackIndices(api));
    const hasExplicitSelection = Array.isArray(__visibleTrackIndices);
    const useAll = !hasExplicitSelection;

    tracks.forEach((track, i) => {
      const muted = useAll ? false : !selected.has(i);
      try { api.changeTrackMute([track], muted); } catch (e) {}
    });
  }

  function applyScoreTransposition(api) {
    if (!api || !api.settings) return;
    const tracks = getAllTracks(api);
    const trackCount = tracks.length;
    const semitones = getEffectiveTranspose();
    try {
      if (!api.settings.notation) api.settings.notation = {};
      api.settings.notation.transpositionPitches = trackCount > 0 ? Array(trackCount).fill(semitones) : [semitones];
      api.updateSettings();
      if (typeof api.changeTrackTranspositionPitch === 'function' && tracks.length) {
        try { api.changeTrackTranspositionPitch(tracks, semitones); } catch (e) { console.warn('live transpose failed', e); }
      }
      try { api.render(); } catch (e) {}
      scheduleChordRewrite(120);
      scheduleTabCapoOverlay(140);
    } catch (e) {
      console.warn('applyScoreTransposition failed', e);
    }
  }

  function updateMetaRow(meta) {
    __currentMeta = meta || __currentMeta || {};
    const m = __currentMeta || {};
    const tempoEl = document.getElementById('meta-tempo');
    const keyEl = document.getElementById('meta-key');
    const capoEl = document.getElementById('meta-capo');
    const speedEl = document.getElementById('meta-speed');
    if (tempoEl) tempoEl.textContent = (m.tempo != null && m.tempo !== '') ? String(m.tempo) : '--';
    if (keyEl) keyEl.textContent = computeDisplayedKeyName(m);
    if (capoEl) capoEl.textContent = String(getEffectiveCapo());
    if (speedEl) speedEl.textContent = `${viewerPrefs.playbackSpeedPercent}%`;
  }

  function refreshAdjustUI() {
    const a = document.getElementById('score-font-value');
    const b = document.getElementById('spacing-value');
    const c = document.getElementById('tempo-slider');
    const d = document.getElementById('tempo-slider-value');
    const e = document.getElementById('meta-speed');
    const f = document.getElementById('transpose-value');
    const g = document.getElementById('capo-value');
    if (a) a.textContent = String(viewerPrefs.scoreFontSizePx);
    if (b) b.textContent = `${viewerPrefs.scoreSpacingFactor.toFixed(1)}x`;
    if (c) c.value = String(viewerPrefs.playbackSpeedPercent);
    if (d) d.textContent = `${viewerPrefs.playbackSpeedPercent}%`;
    if (e) e.textContent = `${viewerPrefs.playbackSpeedPercent}%`;
    if (f) {
      const t = getUserTranspose();
      f.textContent = t > 0 ? `+${t}` : String(t);
    }
    if (g) g.textContent = String(getEffectiveCapo());
  }

  function applyViewerPrefsToScore() {
    if (!window.__atApi) return;
    applyLyricsFont(window.__atApi, viewerPrefs.scoreFontSizePx);
    applyLyricSpacing(window.__atApi, viewerPrefs.scoreSpacingFactor);
    applyScoreTransposition(window.__atApi);
    try { window.__atApi.playbackSpeed = viewerPrefs.playbackSpeedPercent / 100; } catch (e) {}
    scheduleTabCapoOverlay(120);
  }


  let __tabCapoOverlayTimer = null;

  function ensureTabCapoOverlayRoot() {
    const host = document.getElementById('alphaTab');
    if (!host) return null;
    host.style.position = host.style.position || 'relative';
    let root = host.querySelector('.tab-capo-overlay-root');
    if (!root) {
      root = document.createElement('div');
      root.className = 'tab-capo-overlay-root';
      root.style.position = 'absolute';
      root.style.left = '0';
      root.style.top = '0';
      root.style.right = '0';
      root.style.bottom = '0';
      root.style.pointerEvents = 'none';
      root.style.zIndex = '20';
      host.appendChild(root);
    }
    return root;
  }

  function clearTabCapoOverlay() {
    const root = document.querySelector('#alphaTab .tab-capo-overlay-root');
    if (root) root.innerHTML = '';
  }

  function isTabBarBounds(barBounds) {
    const staff = barBounds?.bar?.staff;
    if (!staff) return false;
    if (!staff.showTablature) return false;
    if (staff.showStandardNotation) return false;
    return true;
  }

  function getDisplayedFretForCapo(note) {
    if (!note || !Number.isFinite(note.fret) || note.fret < 0) return null;
    const capo = getEffectiveCapo();
    if (!capo) return null;
    const displayed = note.fret - capo;
    if (!Number.isFinite(displayed) || displayed < 0) return null;
    return displayed;
  }

  function renderTabCapoOverlay() {
    const api = window.__atApi;
    const root = ensureTabCapoOverlayRoot();
    if (!api || !root) return;
    root.innerHTML = '';

    const capo = getEffectiveCapo();
    const lookup = api.boundsLookup || api.renderer?.boundsLookup || null;
    if (!capo || !lookup || !Array.isArray(lookup.staffSystems)) return;

    for (const system of lookup.staffSystems) {
      const masterBars = Array.isArray(system?.bars) ? system.bars : [];
      for (const masterBar of masterBars) {
        const barBoundsList = Array.isArray(masterBar?.bars) ? masterBar.bars : [];
        for (const barBounds of barBoundsList) {
          if (!isTabBarBounds(barBounds)) continue;
          const beats = Array.isArray(barBounds?.beats) ? barBounds.beats : [];
          for (const beatBounds of beats) {
            const notes = Array.isArray(beatBounds?.notes) ? beatBounds.notes : [];
            for (const noteBounds of notes) {
              const note = noteBounds?.note;
              const displayFret = getDisplayedFretForCapo(note);
              const box = noteBounds?.noteHeadBounds;
              if (displayFret === null || !box) continue;
              const el = document.createElement('div');
              el.className = 'tab-capo-overlay-note';
              el.textContent = String(displayFret);
              el.style.position = 'absolute';
              el.style.left = `${box.x}px`;
              el.style.top = `${box.y}px`;
              el.style.width = `${box.w}px`;
              el.style.height = `${box.h}px`;
              el.style.display = 'flex';
              el.style.alignItems = 'center';
              el.style.justifyContent = 'center';
              el.style.background = '#fff';
              el.style.color = '#111';
              el.style.fontWeight = '700';
              el.style.fontSize = `${Math.max(12, Math.round(box.h * 0.95))}px`;
              el.style.lineHeight = '1';
              el.style.borderRadius = '2px';
              el.style.boxSizing = 'border-box';
              root.appendChild(el);
            }
          }
        }
      }
    }
  }

  function scheduleTabCapoOverlay(delay = 60) {
    try { if (__tabCapoOverlayTimer) clearTimeout(__tabCapoOverlayTimer); } catch (e) {}
    __tabCapoOverlayTimer = setTimeout(() => {
      try { renderTabCapoOverlay(); } catch (e) { console.warn('renderTabCapoOverlay failed', e); }
    }, delay);
  }


  function applyViewerPrefsToLyricsPage() {
    state.lyricsFontSize = viewerPrefs.pureLyricsFontSize;
    const root = document.getElementById('lyrics-view');
    if (root) root.style.fontSize = state.lyricsFontSize + 'px';
  }

  function bindViewerControls() {
    document.getElementById('btn-score-font-plus')?.addEventListener('click', () => {
      viewerPrefs.scoreFontSizePx = Math.min(viewerPrefs.scoreFontSizePx + 2, 52);
      saveViewerPrefs(); refreshAdjustUI(); applyViewerPrefsToScore();
    });
    document.getElementById('btn-score-font-minus')?.addEventListener('click', () => {
      viewerPrefs.scoreFontSizePx = Math.max(viewerPrefs.scoreFontSizePx - 2, 14);
      saveViewerPrefs(); refreshAdjustUI(); applyViewerPrefsToScore();
    });
    document.getElementById('btn-spacing-plus')?.addEventListener('click', () => {
      viewerPrefs.scoreSpacingFactor = Math.min(Math.round((viewerPrefs.scoreSpacingFactor + 0.1) * 10) / 10, 3.5);
      saveViewerPrefs(); refreshAdjustUI(); applyViewerPrefsToScore();
    });
    document.getElementById('btn-spacing-minus')?.addEventListener('click', () => {
      viewerPrefs.scoreSpacingFactor = Math.max(Math.round((viewerPrefs.scoreSpacingFactor - 0.1) * 10) / 10, 1.0);
      saveViewerPrefs(); refreshAdjustUI(); applyViewerPrefsToScore();
    });
    document.getElementById('tempo-slider')?.addEventListener('input', (ev) => {
      viewerPrefs.playbackSpeedPercent = parseInt(ev.target.value, 10) || 100;
      refreshAdjustUI();
      updateMetaRow();
      try { if (window.__atApi) window.__atApi.playbackSpeed = viewerPrefs.playbackSpeedPercent / 100; } catch (e) {}
    });
    document.getElementById('tempo-slider')?.addEventListener('change', () => {
      saveViewerPrefs();
    });

    document.getElementById('btn-transpose-plus')?.addEventListener('click', () => {
      viewerPrefs.transposeSemitones = Math.min(getUserTranspose() + 1, 11);
      saveViewerPrefs(); refreshAdjustUI(); updateMetaRow(); applyViewerPrefsToScore();
    });
    document.getElementById('btn-transpose-minus')?.addEventListener('click', () => {
      viewerPrefs.transposeSemitones = Math.max(getUserTranspose() - 1, -11);
      saveViewerPrefs(); refreshAdjustUI(); updateMetaRow(); applyViewerPrefsToScore();
    });

  }

  
  
  function setPlayerStatus(text) {
    const el = document.getElementById("player-status");
    if (el) el.textContent = text || "";
  }
// ===== alphaTab + .gtz 加载 =====
  function base64ToUint8Array(b64) {
    const binary = atob(b64);
    const len = binary.length;
    const bytes = new Uint8Array(len);
    for (let i = 0; i < len; i++) bytes[i] = binary.charCodeAt(i);
    return bytes;
  }

  async function loadGtzIntoAlphaTab(api, gtzUrl) {
    try { api.stop(); } catch(e) {}
    setPlayerUI({ current: 0, total: 0, playing: false });

    const res = await fetch(gtzUrl);
    if (!res.ok) throw new Error(`HTTP ${res.status} ${gtzUrl}`);
    const txt = await res.text();
    let gtz;
    try { gtz = JSON.parse(txt); } catch(e) { throw new Error('gtz 不是合法 JSON: ' + e.message); }

    let scoreB64 = null;
    if (gtz?.gpBase64) scoreB64 = gtz.gpBase64;
    else if (gtz?.score?.data) scoreB64 = gtz.score.data;
    else if (gtz?.scoreBase64) scoreB64 = gtz.scoreBase64;
    if (!scoreB64) throw new Error('gtz 格式错误：缺少谱面数据');

    const st = gtz?.state || null;
    const vs = gtz?.viewerState || null;
    window.__gtzState = {
      fontSizePx: st?.fontSizePx ?? vs?.fontSizePx ?? DEFAULT_VIEWER_PREFS.scoreFontSizePx,
      spacingFactor: st?.spacingFactor ?? vs?.spacingFactor ?? DEFAULT_VIEWER_PREFS.scoreSpacingFactor,
      zoom: st?.zoom ?? (vs?.zoom != null ? Math.round(vs.zoom * 100) : 100),
      visibleTrackIndices: st?.visibleTrackIndices ?? vs?.visibleTrackIndices ?? null
    };
    window.__gtzMeta = gtz?.meta || null;
    updateMetaRow(window.__gtzMeta || null);

    const bytes = base64ToUint8Array(scoreB64);
    api.load(bytes);

    setPlayerStatus('谱面已加载');
    return gtz;
  }

  function msToMMSS(ms) {
    const totalSec = Math.max(0, Math.floor(ms / 1000));
    const m = String(Math.floor(totalSec / 60)).padStart(2, "0");
    const s = String(totalSec % 60).padStart(2, "0");
    return `${m}:${s}`;
  }


  // ===== 从 .gtz.state 还原“导出时的显示效果” =====
  function applyLyricsFont(api, px) {
    if (!api || !px) return;
    try {
      const settings = api.settings;
      if (!settings.display) settings.display = {};
      if (!settings.display.resources) settings.display.resources = {};
      if (!settings.display.resources.elementFonts) settings.display.resources.elementFonts = new Map();

      const FontCtor = window.alphaTab?.model?.Font || window.alphaTab?.Font;
      const ne = window.alphaTab?.NotationElement;

      if (settings.display.resources.elementFonts && typeof settings.display.resources.elementFonts.set === 'function' && FontCtor && ne) {
        const fontObj = new FontCtor('Microsoft YaHei', px, window.alphaTab.model.FontStyle.Plain, window.alphaTab.model.FontWeight.Regular);
        try { fontObj.families = ['Microsoft YaHei', 'Arial', 'sans-serif']; } catch (e) {}
        if (ne.EffectLyrics != null) settings.display.resources.elementFonts.set(ne.EffectLyrics, fontObj);
        api.updateSettings();
      }
    } catch (e) {
      console.warn('applyLyricsFont failed', e);
    }
  }

  function applyLyricSpacing(api, factor) {
    if (!api || !factor) return;
    // 与 gp-lyrics-fixed-export 保持一致：1.00x => 0px, 2.00x => 12px
    const padding = Math.max(0, Math.round((factor - 1) * 12));
    try {
      const settings = api.settings;
      if (!settings.display) settings.display = {};
      if ('lyricLinesPaddingBetween' in settings.display) {
        settings.display.lyricLinesPaddingBetween = padding;
        api.updateSettings();
      } else {
        // 旧版本兜底：不报错即可（必要时再走 SVG 后处理）
      }
    } catch (e) {
      console.warn('applyLyricSpacing failed', e);
    }
  }

  function applyZoom(api, zoom) {
    if (!api || !zoom) return;
    try {
      const settings = api.settings;
      if (!settings.display) settings.display = {};
      // 这里以 1.0 为基准缩放（你导出的 zoom=100 表示不缩放）
      settings.display.scale = (zoom / 100);
      __exportBaseScale = settings.display.scale || 1.0;
      api.updateSettings();
    } catch (e) {}
  }

  
  // ===== 响应式：控制每行小节数（barsPerRow）与横竖屏 =====
  // 目标：
  // - 手机竖屏：>=2 小节/行
  // - 手机横屏：>=3 小节/行
  // - iPad/电脑：>=5 小节/行（宽屏可到 6）
  let __exportBaseScale = 1.0; // 来自 .gtz.state.zoom
  let __lastBarsPerRow = null;
  let __lastResponsiveScale = null;

  function computeBarsPerRow(width, isLandscape) {
    // width: alphaTab 容器可用宽度
    if (width <= 0 || !isFinite(width)) return -1;
    if (width < 520) return isLandscape ? 3 : 2;        // 手机
    if (width < 740) return isLandscape ? 4 : 3;        // 大屏手机/小平板
    if (width < 1100) return 5;                         // iPad/笔记本
    return 6;                                           // 大屏桌面
  }

  function computeResponsiveScale(width, isLandscape) {
    // 为了保证“每行小节数”能达到目标，小屏适当缩放
    if (width < 520) return isLandscape ? 0.88 : 0.92;
    if (width < 740) return isLandscape ? 0.90 : 0.94;
    if (width < 1100) return 0.96;
    return 1.0;
  }

  function applyResponsiveLayout(api) {
    if (!api) return;
    const el = document.getElementById('score-view') || document.getElementById('alphaTab') || document.body;
    const w = (el && el.clientWidth) ? el.clientWidth : window.innerWidth;
    const isLandscape = window.matchMedia && window.matchMedia('(orientation: landscape)').matches;

    const bars = computeBarsPerRow(w, isLandscape);
    const mul = computeResponsiveScale(w, isLandscape);

    try {
      const settings = api.settings;
      if (!settings.display) settings.display = {};

      // 强制 Page 布局，barsPerRow 才会生效
      if (window.alphaTab?.LayoutMode) {
        settings.display.layoutMode = window.alphaTab.LayoutMode.Page;
      }

      // 使用系统自动布局（避免小屏变成 1 小节/行）
      if (window.alphaTab?.SystemsLayoutMode) {
        settings.display.systemsLayoutMode = window.alphaTab.SystemsLayoutMode.Automatic;
      }

      // 设置每行小节数
      settings.display.barsPerRow = bars;

      // 缩放：导出基准 * 响应式乘子
      const responsiveScale = (__exportBaseScale || 1.0) * mul;
      settings.display.scale = responsiveScale;

      // 仅当有变化才更新，减少闪烁
      if (__lastBarsPerRow !== bars || Math.abs((__lastResponsiveScale||0) - responsiveScale) > 0.001) {
        __lastBarsPerRow = bars;
        __lastResponsiveScale = responsiveScale;
        api.updateSettings();
        // alphaTab 会自动响应 resize，但 barsPerRow/scale 变化最好强制 render
        try { api.render(); } catch(e) {}
      }
    } catch (e) {
      console.warn('applyResponsiveLayout failed', e);
    }
  }

  let __resizeTimer = null;
  function scheduleResponsiveLayout(api) {
    if (__resizeTimer) clearTimeout(__resizeTimer);
    __resizeTimer = setTimeout(() => applyResponsiveLayout(api), 120);
  }

// ===== 多轨道同页显示 + 轨道开关 =====
  let __currentScore = null;
  let __visibleTrackIndices = null;

  function renderVisibleTracks(api) {
    if (!api || !__currentScore) return;
    let idxs = Array.isArray(__visibleTrackIndices) ? __visibleTrackIndices.slice() : [];
    if (!idxs.length) {
      // 默认：全选
      idxs = __currentScore.tracks.map((_, i) => i);
    }
    try {
      api.renderScore(__currentScore, idxs);
    } catch (e) {
      console.warn('renderScore failed, fallback render', e);
      try { api.render(); } catch(e2) {}
    }
    applyPlaybackTrackVisibility(api);
  }

  function buildTracksPanel(score) {
    const panel = document.getElementById('tracks-panel');
    const list = document.getElementById('tracks-list');
    if (!panel || !list || !score) return;

    list.innerHTML = '';
    const tracks = score.tracks || [];
    const selected = new Set(Array.isArray(__visibleTrackIndices) && __visibleTrackIndices.length ? __visibleTrackIndices : tracks.map((_, i) => i));

    tracks.forEach((t, i) => {
      const row = document.createElement('label');
      row.className = 'track-item';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = selected.has(i);
      cb.addEventListener('change', () => {
        const now = new Set(Array.isArray(__visibleTrackIndices) ? __visibleTrackIndices : []);
        if (!now.size) tracks.forEach((_, k) => now.add(k)); // 如果之前为空=全选
        if (cb.checked) now.add(i); else now.delete(i);
        __visibleTrackIndices = Array.from(now).sort((a,b)=>a-b);
        renderVisibleTracks(window.__atApi);
        // 同步应用“每行小节数”与缩放
        scheduleResponsiveLayout(window.__atApi);
      });

      const name = document.createElement('div');
      name.className = 'track-name';
      name.textContent = (t.name || t.shortName || `Track ${i+1}`);

      row.appendChild(cb);
      row.appendChild(name);
      list.appendChild(row);
    });

    // 面板按钮
    const btnAll = document.getElementById('tracks-all');
    const btnNone = document.getElementById('tracks-none');
    const btnClose = document.getElementById('tracks-close');

    if (btnAll) btnAll.onclick = () => {
      __visibleTrackIndices = tracks.map((_, i) => i);
      buildTracksPanel(__currentScore);
      renderVisibleTracks(window.__atApi);
    };
    if (btnNone) btnNone.onclick = () => {
      __visibleTrackIndices = [];
      buildTracksPanel(__currentScore);
      renderVisibleTracks(window.__atApi);
    };
    if (btnClose) btnClose.onclick = () => panel.classList.add('hidden');
  }

  function setupTracksButton() {
    const btn = document.getElementById('btn-tracks');
    const panel = document.getElementById('tracks-panel');
    if (!btn || !panel) return;

    btn.addEventListener('click', () => {
      if (!__currentScore) return;
      buildTracksPanel(__currentScore);
      panel.classList.toggle('hidden');
    });

    // 点击遮罩关闭
    panel.addEventListener('click', (e) => {
      if (e.target === panel) panel.classList.add('hidden');
    });
  }

  // ===== 播放位置标记（长竖线光标） =====
  function enableCursor(api) {
    try {
      const settings = api.settings;
      if (!settings.player) settings.player = {};
      if ('enableCursor' in settings.player) settings.player.enableCursor = true;
      if ('enableAnimatedBeatCursor' in settings.player) settings.player.enableAnimatedBeatCursor = true;
      api.updateSettings();
    } catch (e) {}
  }
  let __playerUi = null;
  function setupPlayerBar(api) {
    if (__playerUi) return;
    const btnPrev = document.getElementById("btn-player-prev");
    const btnPlay = document.getElementById("btn-player-play");
    const btnNext = document.getElementById("btn-player-next");
    const timeEl = document.getElementById("player-time");
    const progressEl = document.getElementById("player-progress");
    const indicatorEl = document.getElementById("player-indicator");

    __playerUi = { btnPrev, btnPlay, btnNext, timeEl, progressEl, indicatorEl, isSeeking: false };

    // 复用页面已有上一首/下一首逻辑（按钮在顶部）
    btnPrev.addEventListener("click", () => document.getElementById("btn-prev")?.click());
    btnNext.addEventListener("click", () => document.getElementById("btn-next")?.click());
    btnPlay.addEventListener("click", () => api.playPause());

    // SoundFont 加载指示
    api.soundFontLoad.on((e) => {
      const pct = Math.floor((e.loaded / e.total) * 100);
      indicatorEl.textContent = `<span id="player-status">音源未加载</span> ${pct}%`;
      indicatorEl.style.display = "block";
    });
    api.playerReady.on(() => {
      indicatorEl.style.display = "none";
      btnPlay.disabled = false;
      btnPrev.disabled = false;
      btnNext.disabled = false;
    });

    // 播放状态变化：切换 ▶ / ⏸
    api.playerStateChanged.on((args) => {
      const playing = (args.state === alphaTab.synth.PlayerState.Playing);
      btnPlay.textContent = playing ? "⏸" : "▶";
    });

    // 进度刷新
    let previousSec = -1;
    api.playerPositionChanged.on((args) => {
      const currentSec = Math.floor(args.currentTime / 1000);
      if (currentSec === previousSec) return;
      previousSec = currentSec;

      if (!__playerUi.isSeeking) {
        const max = Math.max(1, args.endTime);
        const v = Math.floor((args.currentTime / max) * 1000);
        progressEl.value = String(isFinite(v) ? v : 0);
      }
      timeEl.textContent = `${msToMMSS(args.currentTime)} / ${msToMMSS(args.endTime)}`;
    });

    // 拖动进度条进行 seek（通过 api.timePosition）
    progressEl.addEventListener("input", () => {
      __playerUi.isSeeking = true;
      const v = parseInt(progressEl.value, 10);
      // 这里拿不到 endTime，只能读最近一次 UI 上的总时长
      const text = timeEl.textContent || "00:00 / 00:00";
      const total = parseTimeFromText(text.split("/")[1] || "00:00");
      const target = Math.floor(total * (v / 1000));
      timeEl.textContent = `${msToMMSS(target)} / ${msToMMSS(total)}`;
    });

    progressEl.addEventListener("change", () => {
      const v = parseInt(progressEl.value, 10);
      const text = timeEl.textContent || "00:00 / 00:00";
      const total = parseTimeFromText(text.split("/")[1] || "00:00");
      const target = Math.floor(total * (v / 1000));
      try { api.timePosition = target; } catch(e) {}
      __playerUi.isSeeking = false;
    });

    // 初始禁用，直到 playerReady
    btnPlay.disabled = true;
    btnPrev.disabled = true;
    btnNext.disabled = true;
  }

  function parseTimeFromText(t) {
    // t like " 03:12" or "03:12"
    const s = (t || "").trim();
    const m = s.match(/^(\d+):(\d{2})$/);
    if (!m) return 0;
    const min = parseInt(m[1], 10);
    const sec = parseInt(m[2], 10);
    return (min * 60 + sec) * 1000;
  }

  function setPlayerUI({ current, total, playing }) {
    const timeEl = document.getElementById("player-time");
    const progressEl = document.getElementById("player-progress");
    if (timeEl) timeEl.textContent = `${msToMMSS(current)} / ${msToMMSS(total)}`;
    if (progressEl) progressEl.value = "0";
    const btnPlay = document.getElementById("btn-player-play");
    if (btnPlay) btnPlay.textContent = playing ? "⏸" : "▶";
  }
  // ===== /alphaTab + .gtz 加载 =====

function pad4(num) {
    return String(num).padStart(4, "0");
  }

  function parseQuery() {
    const params = new URLSearchParams(window.location.search);
    const book = params.get("book") || "c";
    let no = parseInt(params.get("no") || "1", 10);
    if (!Number.isFinite(no) || no < 1) no = 1;
    state.currentBook = (book === "ts") ? "ts" : "c";
    state.currentNo = no;
  }

  function getRangeIndex(no) {
    return Math.floor((no - 1) / 100); // 1-100 -> 0, 101-200 -> 1 ...
  }

  function getRangeFilePath(bookKey, rangeIndex) {
    const start = rangeIndex * 100 + 1;
    const end = (rangeIndex + 1) * 100;
    const folder = BOOKS[bookKey].folderText;
    return `assets/${folder}/${bookKey}_${start}_${end}.json`;
  }

  async function loadRange(bookKey, rangeIndex) {
    if (state.loadedRanges[bookKey][rangeIndex]) return true;
    const url = getRangeFilePath(bookKey, rangeIndex);
    try {
      const res = await fetch(url);
      if (!res.ok) {
        state.loadedRanges[bookKey][rangeIndex] = true;
        return false;
      }
      const json = await res.json();
      if (!Array.isArray(json) || json.length === 0) {
        state.loadedRanges[bookKey][rangeIndex] = true;
        return false;
      }
      state.data[bookKey] = state.data[bookKey].concat(json);
      state.loadedRanges[bookKey][rangeIndex] = true;
      return true;
    } catch (e) {
      console.error("加载区间失败", bookKey, rangeIndex, e);
      state.loadedRanges[bookKey][rangeIndex] = true;
      return false;
    }
  }

  async function ensureRangeForNo(bookKey, no) {
    const rangeIndex = getRangeIndex(no);
    return await loadRange(bookKey, rangeIndex);
  }

  function findLocalSong(bookKey, no) {
    const songs = state.data[bookKey] || [];
    return songs.find(s => s.no === no) || null;
  }

  async function getSong(bookKey, no) {
    await ensureRangeForNo(bookKey, no);
    return findLocalSong(bookKey, no);
  }

  function renderScore(bookKey, no) {
    const container = document.getElementById("score-view");
    // alphaTab 渲染容器（在 HTML 里我们放了 #alphaTab）
    const atEl = document.getElementById("alphaTab");

    // 首次初始化 alphaTab API
    if (!window.__atApi) {
      const settings = {
        core: {
          includeNoteBounds: true
        },
        // 文件由我们手动 load(ArrayBuffer) 提供，因此这里不设置 file
        display: {
          scale: 1.0
        },
        player: {
          enablePlayer: true,
          // alphaTab 官方教程示例音源（SoundFont2）
          soundFont: 'https://cdn.jsdelivr.net/npm/@coderline/alphatab@latest/dist/soundfont/sonivox.sf2',
          // 播放时滚动这个元素
          scrollElement: container
        }
      };

      window.__atApi = new alphaTab.AlphaTabApi(atEl, settings);

      // 轨道开关按钮（只影响多轨显示）
      setupTracksButton();

      // 响应式：根据屏幕宽度/横竖屏调整每行小节数
      applyResponsiveLayout(window.__atApi);
      window.addEventListener('resize', () => scheduleResponsiveLayout(window.__atApi));
      window.addEventListener('orientationchange', () => scheduleResponsiveLayout(window.__atApi));

      // 载入谱面后：还原歌词字号/行距/缩放/多轨
      window.__atApi.scoreLoaded.on((e) => {
        __currentScore = e.score || window.__atApi.score;
        const st = window.__gtzState || {};
        __visibleTrackIndices = Array.isArray(st.visibleTrackIndices) ? st.visibleTrackIndices.slice() : null;

        if (!viewerPrefs.__initializedFromSong) {
          viewerPrefs.scoreFontSizePx = st.fontSizePx || viewerPrefs.scoreFontSizePx;
          viewerPrefs.scoreSpacingFactor = st.spacingFactor || viewerPrefs.scoreSpacingFactor;
          viewerPrefs.__initializedFromSong = true;
          saveViewerPrefs();
        }
        applyZoom(window.__atApi, st.zoom);
        applyViewerPrefsToScore();
        refreshAdjustUI();
        updateMetaRow(window.__gtzMeta || null);

        enableCursor(window.__atApi);

        renderVisibleTracks(window.__atApi);
        applyScoreTransposition(window.__atApi);
        applyPlaybackTrackVisibility(window.__atApi);
        scheduleTabCapoOverlay(180);
      });

      window.__atApi.renderFinished.on(() => {
        scheduleTabCapoOverlay(40);
      });

      // 播放条绑定
      setupPlayerBar(window.__atApi);
    }

    // 加载 .gtz (JSON) -> 解 base64 -> load 到 alphaTab
    const gtzPrefix = BOOKS[bookKey].gtzPrefix || BOOKS[bookKey].svgPrefix;
    const gtzUrl = `${gtzPrefix}${pad4(no)}_cn_g.gtz`; // 如 assets/c/c0001_cn_g.gtz

    loadGtzIntoAlphaTab(window.__atApi, gtzUrl).catch(err => {
      console.error("加载 gtz 失败:", err);
      setPlayerStatus('加载失败: ' + (err && err.message ? err.message : err));
      // fallback: 如果没有 gtz，就尝试旧的 svg（便于过渡）
      try {
        container.innerHTML = "";
        const folderPrefix = BOOKS[bookKey].svgPrefix;
        const src = `${folderPrefix}${pad4(no)}_cn_g.svg`;
        const img = document.createElement("img");
        img.alt = `${BOOKS[bookKey].label} 第 ${no} 首 吉他谱`;
        img.src = src;
        container.appendChild(img);
      } catch (e) {}
    });
  }


  function renderLyrics(song) {
    const root = document.getElementById("lyrics-view");
    root.innerHTML = "";
    if (!song || !song.lyrics) return;

    state.lyricsFontSize = viewerPrefs.pureLyricsFontSize;
    root.style.fontSize = state.lyricsFontSize + "px";

    song.lyrics.forEach(section => {
      const sec = document.createElement("div");
      sec.className = "lyrics-section";

      const noDiv = document.createElement("div");
      noDiv.className = "lyrics-section-no";
      noDiv.textContent = section.section_no || "";

      const linesWrap = document.createElement("div");
      linesWrap.className = "lyrics-lines";

      (section.lines || []).forEach(lineText => {
        const p = document.createElement("p");
        p.textContent = convertTextByScript(lineText || "");
        linesWrap.appendChild(p);
      });

      sec.appendChild(noDiv);
      sec.appendChild(linesWrap);
      root.appendChild(sec);
    });
  }

  function updateTitle(song) {
    const titleEl = document.getElementById("song-title");
    if (song && song.title) {
      titleEl.textContent = song.title;
      document.title = song.title + " - 召会诗歌吉他谱";
    } else {
      titleEl.textContent = `${BOOKS[state.currentBook].label} 第 ${state.currentNo} 首`;
      document.title = titleEl.textContent;
    }
  }

  function setMode(mode) {
    state.mode = mode;
    const scoreView = document.getElementById("score-view");
    const lyricsView = document.getElementById("lyrics-view");

    const btnScore = document.getElementById("btn-mode-score");
    const btnLyrics = document.getElementById("btn-mode-lyrics");

    if (mode === "score") {
      scoreView.style.display = "";
      scoreView.setAttribute("aria-hidden", "false");
      lyricsView.style.display = "none";
      lyricsView.setAttribute("aria-hidden", "true");
      btnScore.classList.add("active");
      btnLyrics.classList.remove("active");
    } else {
      scoreView.style.display = "none";
      scoreView.setAttribute("aria-hidden", "true");
      lyricsView.style.display = "";
      lyricsView.setAttribute("aria-hidden", "false");
      btnScore.classList.remove("active");
      btnLyrics.classList.add("active");
    }
  }

  function syncBookButtons() {
    document.getElementById("btn-book-c").classList.toggle("active", state.currentBook === "c");
    document.getElementById("btn-book-ts").classList.toggle("active", state.currentBook === "ts");
  }

  function syncScriptButton() {
    const btn = document.getElementById("btn-script");
    // 当前歌词是简体 -> 按钮显示“繁”；当前歌词繁体 -> 按钮显示“简”
    if (state.script === "simplified") {
      btn.textContent = "繁";
      btn.classList.remove("active");
    } else {
      btn.textContent = "简";
      btn.classList.add("active");

  function updateURL() {
    const url = new URL(window.location.href);
    url.searchParams.set("book", state.currentBook);
    url.searchParams.set("no", String(state.currentNo));
    window.history.replaceState({}, "", url.toString());
  }

  async function loadAndRenderCurrentSong() {
    const song = await getSong(state.currentBook, state.currentNo);
    if (!song) {
      alert("找不到这首诗歌的歌词数据。");
      return;
    }
    updateTitle(song);
    renderScore(state.currentBook, state.currentNo);
    renderLyrics(song);
    setMode(state.mode); // 保持当前 吉他 / 歌词 模式
    syncScriptButton();
  }

  async function tryGoTo(delta) {
    const newNo = state.currentNo + delta;
    if (newNo <= 0) {
      alert("已经是第一首了。");
      return;
    }
    const song = await getSong(state.currentBook, newNo);
    if (!song) {
      alert(delta > 0 ? "已经是最后一首了。" : "已经是第一首了。");
      return;
    }
    state.currentNo = newNo;
    updateURL();
    await loadAndRenderCurrentSong();
  }

  function goToNumber(no) {
    state.currentNo = no;
    updateURL();
    loadAndRenderCurrentSong();
  }

  function handleSearch() {
    const raw = document.getElementById("search-input").value.trim();
    if (!raw) return;
    const digitsMatch = raw.match(/(\d{1,4})$/);
    if (!digitsMatch) {
      alert("请输入正确的编号，如 31");
      return;
    }
    const no = parseInt(digitsMatch[1], 10);
    if (!Number.isFinite(no)) {
      alert("请输入正确的编号，如 31");
      return;
    }
    goToNumber(no);
  }

  document.addEventListener("DOMContentLoaded", async () => {
    parseQuery();
    document.getElementById("search-input").value = state.currentNo;  // ★ 显示当前编号

    syncScriptButton(); // 默认：歌词简体，按钮显示“繁”

      window.location.href = "index.html";

    // 吉他 / 歌词模式

      setMode("lyrics");

    // 简繁按钮：一个位置，文字互换
    document.getElementById("btn-script").addEventListener("click", () => {
      state.script = (state.script === "simplified") ? "traditional" : "simplified";
      syncScriptButton();
      // 重新渲染歌词，让转换生效
      getSong(state.currentBook, state.currentNo).then(song => {
        if (song) renderLyrics(song);
      });
    });

    bindViewerControls();
    refreshAdjustUI();
    applyViewerPrefsToLyricsPage();

    // 字号 + / - ：歌词页调纯歌词字号；乐谱页调谱内歌词字号
    document.getElementById("btn-font-plus").addEventListener("click", () => {
      if (state.mode === 'lyrics') {
        viewerPrefs.pureLyricsFontSize = Math.min(viewerPrefs.pureLyricsFontSize + 3, 48);
        saveViewerPrefs();
        applyViewerPrefsToLyricsPage();
        getSong(state.currentBook, state.currentNo).then(song => { if (song) renderLyrics(song); });
      } else {
        viewerPrefs.scoreFontSizePx = Math.min(viewerPrefs.scoreFontSizePx + 2, 52);
        saveViewerPrefs();
        refreshAdjustUI();
        applyViewerPrefsToScore();
      }
    });
    document.getElementById("btn-font-minus").addEventListener("click", () => {
      if (state.mode === 'lyrics') {
        viewerPrefs.pureLyricsFontSize = Math.max(viewerPrefs.pureLyricsFontSize - 3, 12);
        saveViewerPrefs();
        applyViewerPrefsToLyricsPage();
        getSong(state.currentBook, state.currentNo).then(song => { if (song) renderLyrics(song); });
      } else {
        viewerPrefs.scoreFontSizePx = Math.max(viewerPrefs.scoreFontSizePx - 2, 14);
        saveViewerPrefs();
        refreshAdjustUI();
        applyViewerPrefsToScore();
      }
    });

    await loadAndRenderCurrentSong();
  });
</script>

<script id="responsive-refactor-script">
(function(){
  function $(sel, root=document){ return root.querySelector(sel); }
  function $all(sel, root=document){ return Array.from(root.querySelectorAll(sel)); }

  function injectShell(){
    const contentCard = document.querySelector('.content-card');
    const pageInner = document.querySelector('.page-inner');
    if (!contentCard || !pageInner || document.getElementById('app-shell')) return;
    contentCard.insertAdjacentHTML('beforebegin', `
    <div id="app-shell" class="app-shell">
      <div class="shell-toolbar">
        <button class="shell-btn shell-icon" id="shell-home" aria-label="首页">⌂</button>
        <button class="shell-pill" id="shell-speed-btn"><span id="shell-speed-label">95</span></button>
        <button class="shell-pill" id="shell-key-btn"><span id="shell-key-label">--</span></button>
        <div class="shell-pill shell-capo" id="shell-capo-pill">CP<span id="shell-capo-label">0</span></div>
        <button class="shell-pill shell-mode" id="shell-mode-btn"><span id="shell-mode-label">吉</span></button>
        <button class="shell-btn shell-icon" id="shell-prev" aria-label="上一首">⏮</button>
        <button class="shell-btn shell-play" id="shell-play" aria-label="播放">▶</button>
        <button class="shell-btn shell-icon" id="shell-next" aria-label="下一首">⏭</button>
        <button class="shell-pill shell-mini" id="shell-text-btn">字</button>
        <button class="shell-pill shell-mini" id="shell-track-btn">轨</button>
        <button class="shell-pill shell-mini" id="shell-staff-btn">谱</button>
        <button class="shell-btn shell-icon" id="shell-lang-btn" aria-label="语言">🌐</button>
        <button class="shell-btn shell-icon" id="shell-search-btn" aria-label="搜索">⌕</button>
      </div>
      <div class="shell-progress-wrap">
        <input class="shell-progress" id="shell-progress" type="range" min="0" max="1000" value="0" />
        <div class="shell-time" id="shell-time">00:00</div>
      </div>

      <div class="shell-title-wrap">
        <div class="shell-main-title" id="shell-main-title"></div>
        <div class="shell-sub-title" id="shell-sub-title"></div>
      </div>

      <div class="shell-panels">
        <div class="shell-panel" id="panel-speed" hidden>
          <div class="shell-panel-title">速度</div>
          <div class="shell-panel-row">
            <input id="panel-speed-range" type="range" min="50" max="150" step="5" value="100" />
            <div class="shell-panel-value" id="panel-speed-value">100%</div>
          </div>
          <div class="shell-panel-actions">
            <button class="shell-panel-btn" id="panel-speed-reset">恢复</button>
            <button class="shell-panel-btn shell-primary" data-close-panel>完成</button>
          </div>
        </div>

        <div class="shell-panel" id="panel-key" hidden>
          <div class="shell-panel-title">转调</div>
          <div class="shell-panel-row shell-panel-stepper">
            <button class="shell-step-btn" id="panel-key-minus">−</button>
            <div class="shell-panel-value" id="panel-key-value">0</div>
            <button class="shell-step-btn" id="panel-key-plus">+</button>
          </div>
          <div class="shell-panel-actions">
            <button class="shell-panel-btn" id="panel-key-reset">恢复</button>
            <button class="shell-panel-btn shell-primary" data-close-panel>完成</button>
          </div>
        </div>

        <div class="shell-panel" id="panel-mode" hidden>
          <div class="shell-panel-title">内容</div>
          <div class="shell-option-list">
            <button class="shell-option-btn" id="panel-mode-score">吉他</button>
            <button class="shell-option-btn" id="panel-mode-lyrics">歌词</button>
          </div>
        </div>

        <div class="shell-panel" id="panel-text" hidden>
          <div class="shell-panel-title">字</div>
          <div class="shell-panel-row shell-grid-two">
            <div class="shell-control-card">
              <div class="shell-control-label">谱词字号</div>
              <div class="shell-panel-stepper">
                <button class="shell-step-btn" id="panel-font-minus">−</button>
                <div class="shell-panel-value" id="panel-font-value">30</div>
                <button class="shell-step-btn" id="panel-font-plus">+</button>
              </div>
            </div>
            <div class="shell-control-card">
              <div class="shell-control-label">谱词距</div>
              <div class="shell-panel-stepper">
                <button class="shell-step-btn" id="panel-spacing-minus">−</button>
                <div class="shell-panel-value" id="panel-spacing-value">2.0x</div>
                <button class="shell-step-btn" id="panel-spacing-plus">+</button>
              </div>
            </div>
          </div>
        </div>

        <div class="shell-panel" id="panel-staff" hidden>
          <div class="shell-panel-title">谱</div>
          <div class="shell-option-list">
            <button class="shell-option-btn" id="panel-staff-five">五线谱</button>
            <button class="shell-option-btn" id="panel-staff-jian">简谱</button>
          </div>
          <div class="shell-panel-note">当前版本为测试切换。</div>
        </div>

        <div class="shell-panel" id="panel-lang" hidden>
          <div class="shell-panel-title">语言</div>
          <div class="shell-option-list">
            <button class="shell-option-btn" id="panel-lang-simplified">简体</button>
            <button class="shell-option-btn" id="panel-lang-traditional">繁体</button>
          </div>
        </div>

        <div class="shell-panel" id="panel-search" hidden>
          <div class="shell-panel-title">搜索</div>
          <div class="shell-search-book">
            <button class="shell-seg-btn" id="panel-book-c">大本</button>
            <button class="shell-seg-btn" id="panel-book-ts">小本</button>
          </div>
          <div class="shell-search-row">
            <input id="panel-search-input" class="shell-search-input" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="输入编号，如31" />
            <button class="shell-panel-btn shell-primary" id="panel-search-go">搜索</button>
          </div>
        </div>
      </div>
    </div>
`);
  }

  function openPanel(id){
    $all('.shell-panel').forEach(p => p.hidden = true);
    if (!id) return;
    const el = document.getElementById(id);
    if (el) el.hidden = false;
  }
  function closePanels(){ openPanel(null); }

  function click(id){ const el = document.getElementById(id); if (el) el.click(); }
  function setInputValue(id, value){
    const el = document.getElementById(id);
    if (!el) return;
    el.value = value;
    el.dispatchEvent(new Event('input', {bubbles:true}));
    el.dispatchEvent(new Event('change', {bubbles:true}));
  }

  function syncTitles(){
    const t = document.getElementById('song-title')?.textContent?.trim() || '诗歌';
    const main = document.getElementById('shell-main-title');
    const sub = document.getElementById('shell-sub-title');
    if (main) main.textContent = t;

    const params = new URLSearchParams(location.search);
    const book = params.get('book') || 'c';
    const no = parseInt(params.get('no') || '1', 10);
    if (typeof getSong === 'function'){
      Promise.resolve(getSong(book, no)).then(song => {
        if (!song) return;
        if (main) main.textContent = (song.big_title || song.title || t);
        if (sub) sub.textContent = (song.big_title && song.title) ? song.title : (song.full_title && song.full_title !== song.title ? song.full_title : '');
      }).catch(()=>{});
    }
  }

  function getText(id){ return document.getElementById(id)?.textContent?.trim() || ''; }

  function syncShell(){
    const tempoMeta = getText('meta-tempo');
    const keyMeta = getText('meta-key');
    const capoMeta = getText('meta-capo');
    const speedPctText = getText('meta-speed').replace('%','') || '100';
    const transText = getText('transpose-value') || '0';
    const fontText = getText('score-font-value') || '30';
    const spacingText = getText('spacing-value') || '2.0x';
    const playerTime = document.getElementById('player-time')?.textContent || '00:00 / 00:00';
    const currentTime = playerTime.split('/')[0].trim();

    const speedPct = parseInt(speedPctText, 10) || 100;
    const originalTempo = parseInt(tempoMeta, 10);
    const displayTempo = Number.isFinite(originalTempo) ? Math.round(originalTempo * speedPct / 100) : speedPct;

    const speedLabel = document.getElementById('shell-speed-label');
    const keyLabel = document.getElementById('shell-key-label');
    const capoLabel = document.getElementById('shell-capo-label');
    const modeLabel = document.getElementById('shell-mode-label');
    const playBtn = document.getElementById('shell-play');
    const shellTime = document.getElementById('shell-time');
    const shellProg = document.getElementById('shell-progress');

    if (speedLabel) speedLabel.textContent = String(displayTempo || tempoMeta || '95');
    if (keyLabel) keyLabel.textContent = keyMeta || '--';
    if (capoLabel) capoLabel.textContent = String(capoMeta || '0');
    if (modeLabel) modeLabel.textContent = document.getElementById('btn-mode-lyrics')?.classList.contains('active') ? '词' : '吉';
    if (playBtn) playBtn.textContent = (document.getElementById('btn-player-play')?.textContent || '▶').includes('⏸') ? '⏸' : '▶';
    if (shellTime) shellTime.textContent = currentTime || '00:00';

    const hiddenProg = document.getElementById('player-progress');
    if (shellProg && hiddenProg) shellProg.value = hiddenProg.value || '0';

    const pr = document.getElementById('panel-speed-range');
    const prv = document.getElementById('panel-speed-value');
    if (pr) pr.value = String(speedPct);
    if (prv) prv.textContent = speedPct + '%';

    const pkv = document.getElementById('panel-key-value');
    if (pkv) pkv.textContent = transText;

    const pfv = document.getElementById('panel-font-value');
    if (pfv) pfv.textContent = fontText;
    const psv = document.getElementById('panel-spacing-value');
    if (psv) psv.textContent = spacingText;

    const searchInput = document.getElementById('search-input');
    const panelSearch = document.getElementById('panel-search-input');
    if (searchInput && panelSearch && document.activeElement !== panelSearch) panelSearch.value = searchInput.value || '';

    document.getElementById('panel-book-c')?.classList.toggle('active', document.getElementById('btn-book-c')?.classList.contains('active'));
    document.getElementById('panel-book-ts')?.classList.toggle('active', document.getElementById('btn-book-ts')?.classList.contains('active'));
    document.getElementById('panel-mode-score')?.classList.toggle('active', document.getElementById('btn-mode-score')?.classList.contains('active'));
    document.getElementById('panel-mode-lyrics')?.classList.toggle('active', document.getElementById('btn-mode-lyrics')?.classList.contains('active'));

    const scriptBtnText = document.getElementById('btn-script')?.textContent?.trim() || '繁';
    document.getElementById('panel-lang-simplified')?.classList.toggle('active', scriptBtnText === '繁');
    document.getElementById('panel-lang-traditional')?.classList.toggle('active', scriptBtnText === '简');

    const staffMode = (localStorage.getItem('staffMode') || 'five');
    document.getElementById('panel-staff-five')?.classList.toggle('active', staffMode === 'five');
    document.getElementById('panel-staff-jian')?.classList.toggle('active', staffMode === 'jian');

    syncTitles();
  }

  function initShellBindings(){
    document.getElementById('shell-home')?.addEventListener('click', ()=> click('btn-back'));
    document.getElementById('shell-prev')?.addEventListener('click', ()=> click('btn-player-prev'));
    document.getElementById('shell-play')?.addEventListener('click', ()=> click('btn-player-play'));
    document.getElementById('shell-next')?.addEventListener('click', ()=> click('btn-player-next'));

    document.getElementById('shell-speed-btn')?.addEventListener('click', ()=> openPanel('panel-speed'));
    document.getElementById('shell-key-btn')?.addEventListener('click', ()=> openPanel('panel-key'));
    document.getElementById('shell-mode-btn')?.addEventListener('click', ()=> openPanel('panel-mode'));
    document.getElementById('shell-text-btn')?.addEventListener('click', ()=> openPanel('panel-text'));
    document.getElementById('shell-track-btn')?.addEventListener('click', ()=> click('btn-tracks'));
    document.getElementById('shell-staff-btn')?.addEventListener('click', ()=> openPanel('panel-staff'));
    document.getElementById('shell-lang-btn')?.addEventListener('click', ()=> openPanel('panel-lang'));
    document.getElementById('shell-search-btn')?.addEventListener('click', ()=> openPanel('panel-search'));

    $all('[data-close-panel]').forEach(btn => btn.addEventListener('click', closePanels));

    const speedRange = document.getElementById('panel-speed-range');
    speedRange?.addEventListener('input', e => setInputValue('tempo-slider', e.target.value));
    document.getElementById('panel-speed-reset')?.addEventListener('click', ()=> setInputValue('tempo-slider', 100));

    document.getElementById('panel-key-plus')?.addEventListener('click', ()=> click('btn-transpose-plus'));
    document.getElementById('panel-key-minus')?.addEventListener('click', ()=> click('btn-transpose-minus'));
    document.getElementById('panel-key-reset')?.addEventListener('click', ()=>{
      const txt = getText('transpose-value').replace('+','');
      const n = parseInt(txt, 10) || 0;
      if (n > 0) { for (let i=0;i<n;i++) click('btn-transpose-minus'); }
      else if (n < 0) { for (let i=0;i<Math.abs(n);i++) click('btn-transpose-plus'); }
    });

    document.getElementById('panel-mode-score')?.addEventListener('click', ()=> { click('btn-mode-score'); syncShell(); closePanels(); });
    document.getElementById('panel-mode-lyrics')?.addEventListener('click', ()=> { click('btn-mode-lyrics'); syncShell(); closePanels(); });

    document.getElementById('panel-font-plus')?.addEventListener('click', ()=> click('btn-score-font-plus'));
    document.getElementById('panel-font-minus')?.addEventListener('click', ()=> click('btn-score-font-minus'));
    document.getElementById('panel-spacing-plus')?.addEventListener('click', ()=> click('btn-spacing-plus'));
    document.getElementById('panel-spacing-minus')?.addEventListener('click', ()=> click('btn-spacing-minus'));

    document.getElementById('panel-lang-simplified')?.addEventListener('click', ()=>{
      if ((document.getElementById('btn-script')?.textContent || '').trim() !== '繁') click('btn-script');
      syncShell(); closePanels();
    });
    document.getElementById('panel-lang-traditional')?.addEventListener('click', ()=>{
      if ((document.getElementById('btn-script')?.textContent || '').trim() !== '简') click('btn-script');
      syncShell(); closePanels();
    });

    document.getElementById('panel-book-c')?.addEventListener('click', ()=> { click('btn-book-c'); syncShell(); });
    document.getElementById('panel-book-ts')?.addEventListener('click', ()=> { click('btn-book-ts'); syncShell(); });
    document.getElementById('panel-search-go')?.addEventListener('click', ()=>{
      const v = document.getElementById('panel-search-input')?.value || '';
      const input = document.getElementById('search-input');
      if (input) input.value = v;
      click('btn-search');
      closePanels();
    });

    const shellProg = document.getElementById('shell-progress');
    shellProg?.addEventListener('input', ()=>{
      const hiddenProg = document.getElementById('player-progress');
      if (!hiddenProg) return;
      hiddenProg.value = shellProg.value;
      hiddenProg.dispatchEvent(new Event('input', {bubbles:true}));
    });
    shellProg?.addEventListener('change', ()=>{
      const hiddenProg = document.getElementById('player-progress');
      if (!hiddenProg) return;
      hiddenProg.value = shellProg.value;
      hiddenProg.dispatchEvent(new Event('change', {bubbles:true}));
    });

    document.getElementById('panel-staff-five')?.addEventListener('click', ()=>{
      try { localStorage.setItem('staffMode','five'); } catch(e){}
      if (typeof window.applyStaffMode === 'function') window.applyStaffMode();
      syncShell(); closePanels();
    });
    document.getElementById('panel-staff-jian')?.addEventListener('click', ()=>{
      try { localStorage.setItem('staffMode','jian'); } catch(e){}
      if (typeof window.applyStaffMode === 'function') window.applyStaffMode();
      syncShell(); closePanels();
    });

    document.addEventListener('click', (e)=>{
      if (!e.target.closest('.shell-panel') && !e.target.closest('.shell-toolbar')) {
        if (!e.target.closest('#tracks-panel')) closePanels();
      }
    });
  }

  function wireTrackPanel(){
    const panel = document.getElementById('tracks-panel');
    if (!panel || panel.dataset.shellMoved === '1') return;
    panel.dataset.shellMoved = '1';
    document.body.appendChild(panel);
    panel.style.position = 'fixed';
    panel.style.right = '12px';
    panel.style.top = '76px';
    panel.style.zIndex = '9999';
  }

  function periodicSync(){
    syncShell();
    wireTrackPanel();
  }

  document.addEventListener('DOMContentLoaded', ()=>{
    injectShell();
    initShellBindings();
    periodicSync();
    setInterval(periodicSync, 400);
    setTimeout(periodicSync, 1200);
    const mo = new MutationObserver(periodicSync);
    mo.observe(document.body, {subtree:true, childList:true, characterData:true});
  });
})();
</script>
