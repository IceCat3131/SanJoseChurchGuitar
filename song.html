<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GTZ 乐谱 v7</title>
  <link rel="stylesheet" href="./styles.css" />
  <script src="./assets/alphatab/alphaTab.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="toolbar-scroll">
        <div class="toolbar-row">
          <button class="tool-btn" id="homeBtn" type="button" title="返回首页">⌂</button>

          <button class="tool-btn" id="tempoBtn" type="button">95</button>
          <button class="tool-btn" id="keyBtn" type="button">Ab</button>
          <button class="tool-btn" id="capoBtn" type="button">CP1</button>

          <button class="tool-btn" id="modeBtn" type="button">吉</button>

          <button class="tool-btn" id="prevBtn" type="button">◀</button>
          <button class="tool-btn" id="playBtn" type="button">▶</button>
          <button class="tool-btn" id="nextBtn" type="button">▶</button>

          <button class="tool-btn" id="fontBtn" type="button">字</button>
          <button class="tool-btn" id="trackBtn" type="button">轨</button>
          <button class="tool-btn active" id="notationBtn" type="button">谱</button>

          <button class="tool-btn" id="searchBtn" type="button">⌕</button>
        </div>
      </div>
    </header>

    <div class="menus-layer">
      <div class="dropdown-menu hidden" id="tempoMenu">
        <div class="menu-title">速度</div>
        <div class="menu-value">当前 <span id="tempoValue">95</span></div>
        <input id="tempoRange" type="range" min="40" max="220" step="1" value="95" />
        <div class="menu-actions">
          <button class="menu-btn" id="tempoResetBtn" type="button">恢复</button>
        </div>
      </div>

      <div class="dropdown-menu hidden" id="keyMenu">
        <div class="menu-title">原始调</div>
        <div class="menu-value">当前 <span id="keyValue">Ab</span></div>
        <div class="menu-help">此版先显示，不做转调逻辑。</div>
      </div>

      <div class="dropdown-menu hidden" id="modeMenu">
        <div class="menu-title">显示模式</div>
        <div class="option-list">
          <button class="option-btn selected" data-mode-option="score" type="button">吉他谱</button>
          <button class="option-btn" data-mode-option="lyrics" type="button">纯歌词（预留）</button>
        </div>
      </div>

      <div class="dropdown-menu hidden" id="fontMenu">
        <div class="menu-title">字号 / 谱间距</div>

        <div class="rowline">
          <span>字号</span>
          <span id="fontSizeValue">30</span>
        </div>
        <div class="stepper">
          <button class="menu-btn" id="fontMinusBtn" type="button">-</button>
          <button class="menu-btn" id="fontPlusBtn" type="button">+</button>
        </div>

        <div class="rowline">
          <span>谱间距</span>
          <span id="spacingValue">2.0</span>
        </div>
        <div class="stepper">
          <button class="menu-btn" id="spacingMinusBtn" type="button">-</button>
          <button class="menu-btn" id="spacingPlusBtn" type="button">+</button>
        </div>
      </div>

      <div class="dropdown-menu hidden" id="trackMenu">
        <div class="menu-title">轨道</div>
        <div id="trackList" class="track-list">暂无轨道信息</div>
      </div>

      <div class="dropdown-menu hidden" id="notationMenu">
        <div class="menu-title">谱</div>
        <div class="option-list">
          <button class="option-btn selected" id="staffOption" type="button">五线谱</button>
          <button class="option-btn" id="jianpuOption" type="button">简谱</button>
        </div>
      </div>

      <div class="dropdown-menu hidden" id="langMenu">
        <div class="menu-title">语言</div>
        <div class="option-list">
          <button class="option-btn selected" type="button">简体</button>
          <button class="option-btn" type="button">繁体</button>
        </div>
      </div>
    </div>

    <main class="content">
      <section class="song-header">
        <h1 id="songTitle"># 正在读取... v7</h1>
        <h2 id="songSubtitle"></h2>
      </section>

      <section class="path-panel">
        <div class="path-title">读取 GTZ</div>
        <div class="path-row">
          <input id="pathInput" type="text" placeholder="文件路径" />
          <button id="reloadBtn" type="button">重新读取</button>
        </div>
      </section>

      <section class="player-bar">
        <div class="time-text" id="timeLabel">00:00</div>
      </section>

      <section class="score-section">
        <div id="scoreLoading" class="score-loading">正在加载 GTZ 与乐谱... v7</div>
        <div id="scoreError" class="score-error hidden"></div>
        <div id="lyricsPlaceholder" class="lyrics-placeholder hidden">
          纯歌词模式预留。当前版仍以乐谱显示为主。
        </div>
        <div id="alphaTabHost" class="alpha-tab-host"></div>
      </section>
    </main>
  </div>

  <script src="./app.js"></script>
</body>
</html>
