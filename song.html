
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>诗歌</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="stylesheet" href="style.css" />
  <script src="assets/alphatab/alphaTab.js"></script>
  
  <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js"></script>

  <style>
    .title-nav-row{display:flex;align-items:center;justify-content:center;gap:12px;padding:6px 12px 2px;}
    .title-nav-center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;flex:1;}
    .big-title-line{font-size:20px;font-weight:700;line-height:1.25;text-align:center;word-break:break-word;}
    .sub-title-line{font-size:16px;line-height:1.25;text-align:center;word-break:break-word;margin-top:4px;opacity:.95;}
    .title-nav-row .core-btn{flex:0 0 auto;}
    .score-top-toolbar{display:flex;align-items:center;justify-content:flex-start;gap:8px;flex-wrap:wrap;padding:8px 0 10px;}
    .score-top-toolbar .core-btn,.score-top-toolbar .core-btn-capo{flex:0 0 auto;}
    .score-toolbar-spacer{flex:1 1 auto;min-width:12px;}
    .score-song-code{margin-left:auto;display:flex;align-items:center;justify-content:flex-end;min-width:72px;font-size:16px;font-weight:700;line-height:1;color:#6b4f1d;text-align:right;white-space:nowrap;}
    .core-ui{background:#fff7e8 !important;border:1px solid #ead8b0 !important;border-radius:14px !important;box-shadow:0 2px 10px rgba(0,0,0,.04) !important;}
    .core-ui-toolbar{background:#f3e2b8;border-radius:12px;padding:8px 10px;box-shadow:inset 0 -1px 0 rgba(0,0,0,.05);}
    .title-nav-row{background:#fffaf0;border-radius:10px;padding-top:10px;padding-bottom:8px;margin-top:6px;}
    .content-card{background:transparent !important;box-shadow:none !important;border:none !important;padding:0 !important;}
    #score-view.score-wrap{background:transparent !important;box-shadow:none !important;border:none !important;}
    #alphaTab.at-viewport{background:transparent !important;}
    html,body,.page,.page-inner{background:#fff !important;}
    .core-ui-title-wrap{display:none !important;}
    .core-ui-toolbar .moved-to-title{display:none !important;}

    .core-ui-toolbar-icons{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;flex-wrap:nowrap;overflow-x:auto;padding:8px 6px 10px;}
    .core-btn-tile{display:inline-flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;min-width:54px;min-height:auto;padding:4px 4px 2px;border-radius:12px;color:var(--primary);background:transparent;}
    .core-btn-tile:hover{background:#edf4ff;}
    .core-btn-icon-wrap{width:24px;height:24px;display:flex;align-items:center;justify-content:center;flex:0 0 24px;}
    .core-btn-svg{width:24px;height:24px;display:block;}
    .core-btn-svg-play{width:26px;height:26px;}
    .core-btn-note{font-size:11px;line-height:1;color:#4b5563;font-weight:700;white-space:nowrap;}
    .core-btn-home-glyph{font-size:22px;line-height:1;color:#2563eb;font-weight:700;}
    .title-nav-row .core-btn-side{min-width:58px;padding-top:2px;}
    .core-panel-actions-icons{display:flex;gap:10px;flex-wrap:wrap;}
    .core-option-btn-icon{display:inline-flex;align-items:center;gap:6px;padding:8px 10px;}
    .core-option-svg{width:20px;height:20px;display:block;}
  </style>
</head>

<div class="page">
  <div class="page-inner">

    <div class="core-ui card" id="core-ui">
      <div class="core-ui-toolbar core-ui-toolbar-icons">
        <button class="core-btn core-btn-tile" id="ui-home" aria-label="首页"><span class="core-btn-icon-wrap core-btn-home-glyph">⌂</span><span class="core-btn-note">首页</span></button>
        <button class="core-btn core-btn-tile core-btn-tile-rhythm" id="ui-rhythm" aria-label="原谱"><span class="core-btn-icon-wrap"><img class="core-btn-svg" src="assets/ui_icons/original.svg" alt=""></span><span class="core-btn-note" id="ui-rhythm-note">原谱</span></button>
        <button class="core-btn core-btn-tile" id="ui-track" aria-label="轨道"><span class="core-btn-icon-wrap"><img class="core-btn-svg" src="assets/ui_icons/tracks.svg" alt=""></span><span class="core-btn-note">轨道</span></button>
        <button class="core-btn core-btn-tile core-btn-tile-play" id="ui-play" aria-label="播放"><span class="core-btn-icon-wrap"><img class="core-btn-svg core-btn-svg-play" src="assets/ui_icons/play.svg" alt=""></span><span class="core-btn-note">播放</span></button>
        <button class="core-btn core-btn-tile" id="ui-text" aria-label="文字"><span class="core-btn-icon-wrap"><img class="core-btn-svg" src="assets/ui_icons/text-settings.svg" alt=""></span><span class="core-btn-note">文字</span></button>
        <button class="core-btn core-btn-tile" id="ui-staff" aria-label="谱"><span class="core-btn-icon-wrap"><img class="core-btn-svg" src="assets/ui_icons/staff-five.svg" alt=""></span><span class="core-btn-note">谱</span></button>
        <button class="core-btn core-btn-tile" id="ui-lang" aria-label="语言"><span class="core-btn-icon-wrap"><img class="core-btn-svg" src="assets/ui_icons/language.svg" alt=""></span><span class="core-btn-note">语言</span></button>
        <button class="core-btn core-btn-tile" id="ui-search" aria-label="搜索"><span class="core-btn-icon-wrap"><img class="core-btn-svg" src="assets/ui_icons/search.svg" alt=""></span><span class="core-btn-note">搜索</span></button>
      </div>
      <div class="core-ui-progress-wrap">
        <input class="core-ui-progress" id="ui-progress" type="range" min="0" max="1000" value="0" />
        <div class="core-ui-time" id="ui-time">00:00 / 00:00</div>
      </div>
      <div class="title-nav-row">
        <button class="core-btn core-btn-tile core-btn-side moved-to-title" id="ui-prev" aria-label="上一首"><span class="core-btn-icon-wrap"><img class="core-btn-svg" src="assets/ui_icons/prev.svg" alt=""></span><span class="core-btn-note">上一首</span></button>
        <div class="title-nav-center">
          <div class="big-title-line" id="ui-title-big">诗歌</div>
          <div class="sub-title-line" id="ui-title-main"></div>
        </div>
        <button class="core-btn core-btn-tile core-btn-side moved-to-title" id="ui-next" aria-label="下一首"><span class="core-btn-icon-wrap"><img class="core-btn-svg" src="assets/ui_icons/next.svg" alt=""></span><span class="core-btn-note">下一首</span></button>
      </div>
      <div class="core-panel-layer" id="core-panel-layer" hidden>
        <div class="core-panel" id="panel-speed" hidden>
          <div class="core-panel-head"><span>速度</span></div>
          <div class="core-panel-body">
            <input id="ui-speed-range" type="range" min="50" max="150" step="5" value="100" />
            <div class="core-panel-value" id="ui-speed-value">100%</div>
          </div>
          <div class="core-panel-actions"><button type="button" class="core-panel-ghost" id="ui-speed-reset">恢复</button></div>
        </div>
        <div class="core-panel" id="panel-key" hidden>
          <div class="core-panel-head"><span>转调</span></div>
          <div class="core-panel-body core-panel-stepper">
            <button type="button" class="core-step-btn" id="ui-key-minus">−</button>
            <div class="core-panel-value" id="ui-key-value">0</div>
            <button type="button" class="core-step-btn" id="ui-key-plus">+</button>
          </div>
          <div class="core-panel-actions"><button type="button" class="core-panel-ghost" id="ui-key-reset">恢复</button></div>
        </div>
        <div class="core-panel" id="panel-text" hidden>
          <div class="core-panel-head"><span>文字</span></div>
          <div class="core-text-grid">
            <div class="core-control-card">
              <div class="core-control-label">谱词字号</div>
              <div class="core-panel-stepper"><button type="button" class="core-step-btn" id="ui-font-minus">−</button><div class="core-panel-value" id="ui-font-value">30</div><button type="button" class="core-step-btn" id="ui-font-plus">+</button></div>
            </div>
            <div class="core-control-card">
              <div class="core-control-label">谱词距</div>
              <div class="core-panel-stepper"><button type="button" class="core-step-btn" id="ui-spacing-minus">−</button><div class="core-panel-value" id="ui-spacing-value">2.0x</div><button type="button" class="core-step-btn" id="ui-spacing-plus">+</button></div>
            </div>
            <div class="core-control-card">
              <div class="core-control-label">和弦字号</div>
              <div class="core-panel-stepper"><button type="button" class="core-step-btn" id="ui-chord-minus">−</button><div class="core-panel-value" id="ui-chord-value">16</div><button type="button" class="core-step-btn" id="ui-chord-plus">+</button></div>
            </div>
          </div>
          <div class="core-panel-actions"><button type="button" class="core-panel-ghost" id="ui-text-reset">恢复</button></div>
        </div>
        <div class="core-panel" id="panel-lang" hidden>
          <div class="core-panel-head"><span>语言</span></div>
          <div class="core-panel-actions core-panel-actions-left">
            <button type="button" class="core-option-btn" id="ui-lang-simp">简体</button>
            <button type="button" class="core-option-btn" id="ui-lang-trad">繁体</button>
          </div>
        </div>
        <div class="core-panel" id="panel-search" hidden>
          <div class="core-panel-head"><span>搜索</span></div>
          <div class="core-book-row">
            <button type="button" class="core-option-btn" id="ui-book-c">大本</button>
            <button type="button" class="core-option-btn" id="ui-book-ts">小本</button>
          </div>
          <div class="core-search-row">
            <input id="ui-search-input" class="core-search-input" type="text" inputmode="search" placeholder="输入编号、歌名或歌词关键词" />
            <button type="button" class="core-option-btn core-primary" id="ui-search-go">搜索</button>
          </div>
          <div id="ui-search-results" class="core-search-results" hidden></div>
        </div>
        <div class="core-panel" id="panel-staff" hidden>
          <div class="core-panel-head"><span>谱</span></div>
          <div class="core-panel-actions core-panel-actions-left core-panel-actions-icons">
            <button type="button" class="core-option-btn core-option-btn-icon" id="ui-staff-five"><img class="core-option-svg" src="assets/ui_icons/staff-five.svg" alt=""><span>五线谱</span></button>
            <button type="button" class="core-option-btn core-option-btn-icon" id="ui-staff-jian"><img class="core-option-svg" src="assets/ui_icons/jianpu.svg" alt=""><span>简谱</span></button>
            <button type="button" class="core-option-btn core-option-btn-icon" id="ui-staff-lyrics"><img class="core-option-svg" src="assets/ui_icons/lyrics.svg" alt=""><span>歌词</span></button>
          </div>
          <div class="core-panel-note">切换后实时生效，点面板外空白处收起。</div>
        </div>
      </div>
    </div>

    
    <div class="content-card">
      <div class="score-top-toolbar">
        <button class="core-btn core-btn-pill moved-to-score" id="ui-speed">95</button>
        <button class="core-btn core-btn-pill moved-to-score" id="ui-key">--</button>
        <div class="core-btn core-btn-pill core-btn-capo moved-to-score" id="ui-capo">CP0</div>
        <div class="score-toolbar-spacer" aria-hidden="true"></div>
        <div class="score-song-code" id="ui-song-code">C_1&nbsp;&nbsp;V_FINAL_1</div>
      </div>
      <div id="score-view" class="score-wrap" aria-hidden="false">
        <div id="alphaTab" class="at-viewport"></div>
      </div>
      <div id="lyrics-view" class="lyrics-root" style="display: none;" aria-hidden="true">
        
      </div>
    </div>

  </div>
</div>
