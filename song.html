<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>song.html (GTZ timeline version)</title>
</head>
<body>
<div id="alphaTab"></div>

<script>
// ===== GTZ → MusicXML → Chord Timeline (FINAL VERSION) =====

// Decode base64 safely
function decodeBase64ToText(b64) {
  const binary = atob(b64);
  const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}

// Parse MusicXML harmony → timeline
function buildChordTimelineFromXML(xmlText) {
  const parser = new DOMParser();
  const xml = parser.parseFromString(xmlText, "application/xml");

  const measures = xml.querySelectorAll("measure");
  let timeline = [];
  let divisions = 1;
  let currentTime = 0;

  measures.forEach((measure, mIdx) => {
    const divEl = measure.querySelector("attributes > divisions");
    if (divEl) divisions = parseInt(divEl.textContent, 10) || divisions;

    let beatTime = 0;

    measure.childNodes.forEach(node => {
      if (node.nodeName === "note") {
        const dur = parseInt(node.querySelector("duration")?.textContent || 0);
        beatTime += dur;
      }

      if (node.nodeName === "harmony") {
        const root = node.querySelector("root-step")?.textContent || '';
        const alter = node.querySelector("root-alter")?.textContent;
        const kind = node.querySelector("kind")?.textContent || '';

        let chord = root;
        if (alter === "1") chord += "#";
        if (alter === "-1") chord += "b";
        if (kind && kind !== "major") chord += kind;

        timeline.push({
          measure: mIdx + 1,
          beat: beatTime / divisions,
          time: currentTime + beatTime,
          chordRaw: chord
        });
      }
    });

    currentTime += beatTime;
  });

  return timeline;
}

// Example hook (replace your GTZ load point)
function onGtzLoaded(scoreBase64) {
  try {
    const xmlText = decodeBase64ToText(scoreBase64);
    const raw = buildChordTimelineFromXML(xmlText);

    window.__chordTimelineRaw = raw;

    // Display layer (no transpose yet)
    window.__chordTimeline = raw.map(c => ({
      ...c,
      chordDisplay: c.chordRaw
    }));

    console.log("GTZ Timeline OK:", window.__chordTimelineRaw);
  } catch (e) {
    console.error("GTZ parse failed", e);
  }
}

// MOCK trigger (replace with your real GTZ loader)
window.testLoad = function(b64){
  onGtzLoaded(b64);
};

</script>
</body>
</html>
