
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>诗歌</title>

  <link rel="stylesheet" href="style.css" />
  <script src="assets/alphatab/alphaTab.js"></script>
  <!-- 简繁转换库：opencc-js（浏览器 UMD 完整版） -->

  <style>
    .title-nav-row{display:flex;align-items:center;justify-content:center;gap:12px;padding:6px 12px 2px;}
    .title-nav-center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;flex:1;}
    .big-title-line{font-size:20px;font-weight:700;line-height:1.25;text-align:center;word-break:break-word;}
    .sub-title-line{font-size:16px;line-height:1.25;text-align:center;word-break:break-word;margin-top:4px;opacity:.95;}
    .title-nav-row .core-btn{flex:0 0 auto;}
    .score-top-toolbar{display:flex;align-items:center;justify-content:flex-start;gap:8px;flex-wrap:wrap;padding:8px 0 10px;}
    .score-top-toolbar .core-btn,.score-top-toolbar .core-btn-capo{flex:0 0 auto;}
    .score-toolbar-spacer{flex:1 1 auto;min-width:12px;}
    .score-song-code{margin-left:auto;display:flex;align-items:center;justify-content:flex-end;min-width:72px;font-size:16px;font-weight:700;line-height:1;color:#6b4f1d;text-align:right;white-space:nowrap;}
    .core-ui{background:#fff7e8 !important;border:1px solid #ead8b0 !important;border-radius:14px !important;box-shadow:0 2px 10px rgba(0,0,0,.04) !important;}
    .core-ui-toolbar{background:#f3e2b8;border-radius:12px;padding:8px 10px;box-shadow:inset 0 -1px 0 rgba(0,0,0,.05);}
    .title-nav-row{background:#fffaf0;border-radius:10px;padding-top:10px;padding-bottom:8px;margin-top:6px;}
    .content-card{background:transparent !important;box-shadow:none !important;border:none !important;padding:0 !important;}
    #score-view.score-wrap{background:transparent !important;box-shadow:none !important;border:none !important;}
    #alphaTab.at-viewport{background:transparent !important;}

    /* alphaTab 播放光标/当前音符高亮：蓝色系最终版 */
    #alphaTab{position:relative !important;}
    #alphaTab .at-cursor-bar{background:rgba(59,130,246,.10) !important;z-index:50 !important;pointer-events:none !important;}

    #alphaTab .at-selection div{background:rgba(59,130,246,.18) !important;pointer-events:none !important;}
    #alphaTab .at-highlight,

    html,body,.page,.page-inner{background:#fff !important;}

<script>
window.__musicTimelineRaw = { chords: [], measures: [], totalTicks: 0, timeSignatures: [] };
window.__chordTimelineRaw = [];
window.__measureTimelineRaw = [];
window.__chordTimeline = [];
window.__autoAccompanimentSong = [];
window.__autoAccompanimentTabTrack = [];
window.__originalXmlText = null;
window.__lastRenderedAutoXml = null;

function decodeBase64ToText(b64) {
  const binary = atob(b64);
  const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}

function mapHarmonyKindToSuffix(kindEl) {
  if (!kindEl) return '';
  const textAttr = String(kindEl.getAttribute('text') || '').trim();
  if (textAttr) return textAttr;
  const v = String(kindEl.textContent || '').trim();
  const map = {
    'major': '', 'minor': 'm', 'augmented': 'aug', 'diminished': 'dim',
    'dominant': '7', 'major-seventh': 'maj7', 'minor-seventh': 'm7',
    'diminished-seventh': 'dim7', 'augmented-seventh': 'aug7', 'half-diminished': 'm7b5',
    'major-sixth': '6', 'minor-sixth': 'm6', 'dominant-ninth': '9', 'major-ninth': 'maj9',
    'minor-ninth': 'm9', 'dominant-11th': '11', 'major-11th': 'maj11', 'minor-11th': 'm11',
    'dominant-13th': '13', 'major-13th': 'maj13', 'minor-13th': 'm13',
    'suspended-second': 'sus2', 'suspended-fourth': 'sus4', 'power': '5', 'none': ''
  };
  return Object.prototype.hasOwnProperty.call(map, v) ? map[v] : v;
}

function buildChordSymbolFromHarmony(harmonyEl) {
  if (!harmonyEl) return '';
  const rootStep = String(harmonyEl.querySelector('root > root-step')?.textContent || '').trim();
  if (!rootStep) return '';
  const rootAlter = String(harmonyEl.querySelector('root > root-alter')?.textContent || '').trim();
  const bassStep = String(harmonyEl.querySelector('bass > bass-step')?.textContent || '').trim();
  const bassAlter = String(harmonyEl.querySelector('bass > bass-alter')?.textContent || '').trim();
  const kindEl = harmonyEl.querySelector('kind');
  let root = rootStep;
  if (rootAlter === '1') root += '#';
  else if (rootAlter === '-1') root += 'b';
  let bass = bassStep;
  if (bass) {
    if (bassAlter === '1') bass += '#';
    else if (bassAlter === '-1') bass += 'b';
  }
  const suffix = mapHarmonyKindToSuffix(kindEl);
  return root + suffix + (bass ? ('/' + bass) : '');
}

function getTimeSignatureText(beats, beatType) {
  if (!Number.isFinite(beats) || !Number.isFinite(beatType) || !beats || !beatType) return '--';
  return String(beats) + '/' + String(beatType);
}

function buildMusicTimelineFromXML(xmlText) {
  const parser = new DOMParser();
  const xml = parser.parseFromString(xmlText, 'application/xml');
  const part = xml.querySelector('score-partwise > part, score-timewise > part');
  if (!part) throw new Error('未找到 MusicXML part');
  let divisions = 1, beats = 4, beatType = 4, currentStartTicks = 0;
  const timeSignatures = [], chords = [], measures = [];
  part.querySelectorAll(':scope > measure').forEach((measureEl, idx) => {
    const measureNo = parseInt(measureEl.getAttribute('number') || '', 10) || (idx + 1);
    const divEl = measureEl.querySelector(':scope > attributes > divisions');
    if (divEl) { const d = parseInt(divEl.textContent || '1', 10); if (Number.isFinite(d) && d > 0) divisions = d; }
    const beatsEl = measureEl.querySelector(':scope > attributes > time > beats');
    const beatTypeEl = measureEl.querySelector(':scope > attributes > time > beat-type');
    if (beatsEl && beatTypeEl) {
      const nb = parseInt(beatsEl.textContent || '4', 10);
      const nt = parseInt(beatTypeEl.textContent || '4', 10);
      if (Number.isFinite(nb) && nb > 0) beats = nb;
      if (Number.isFinite(nt) && nt > 0) beatType = nt;
    }
    const meterText = getTimeSignatureText(beats, beatType);
    timeSignatures.push({ measure: measureNo, meter: meterText, divisions });
    let pos = 0, maxPos = 0;
    Array.from(measureEl.children).forEach((node) => {
      const name = node.nodeName;
      if (name === 'note') {
        const dur = parseInt(node.querySelector('duration')?.textContent || '0', 10) || 0;
        pos += dur; if (pos > maxPos) maxPos = pos; return;
      }
      if (name === 'backup') { const dur = parseInt(node.querySelector('duration')?.textContent || '0', 10) || 0; pos = Math.max(0, pos - dur); return; }
      if (name === 'forward') { const dur = parseInt(node.querySelector('duration')?.textContent || '0', 10) || 0; pos += dur; if (pos > maxPos) maxPos = pos; return; }
      if (name === 'harmony') {
        const offset = parseInt(node.querySelector('offset')?.textContent || '0', 10) || 0;
        const tick = Math.max(0, pos + offset);
        const chordRaw = buildChordSymbolFromHarmony(node);
        if (chordRaw) chords.push({ measure: measureNo, beat: tick / divisions, tickFromScoreStart: currentStartTicks + tick, tickInMeasure: tick, divisions, meter: meterText, chordRaw });
      }
    });
    let nominal = 0;
    if (Number.isFinite(beats) && Number.isFinite(beatType) && beatType > 0) nominal = Math.round((beats * 4 / beatType) * divisions);
    const durationTicks = Math.max(maxPos, nominal, 1);
    measures.push({ measure: measureNo, startTicks: currentStartTicks, durationTicks, endTicks: currentStartTicks + durationTicks, divisions, beats, beatType, meter: meterText });
    currentStartTicks += durationTicks;
  });
  return { chords, measures, timeSignatures, totalTicks: currentStartTicks };
}

function remapTimelineTimesIfNeeded() {
  const raw = window.__musicTimelineRaw;
  const totalMs = Math.max(0, window.__playbackState?.total || 0);
  if (!raw || !raw.totalTicks || !totalMs) return;
  if (raw.__mappedTotalMs === totalMs) return;
  const tickToMs = (ticks) => Math.round((ticks / raw.totalTicks) * totalMs);
  window.__measureTimelineRaw = (raw.measures || []).map(m => ({ ...m, startMs: tickToMs(m.startTicks), endMs: tickToMs(m.endTicks), durationMs: Math.max(1, tickToMs(m.endTicks) - tickToMs(m.startTicks)) }));
  window.__chordTimelineRaw = (raw.chords || []).map(c => ({ ...c, timeMs: tickToMs(c.tickFromScoreStart) }));
  raw.__mappedTotalMs = totalMs;
}

  const BOOKS = {
    e: {
      label: "英文诗歌",
      shortLabel: "英文",
      folderText: "e_text",
      textSingleFile: "e_1-1360.json",
      gtzPrefix: "assets/e/e",
      gtzSuffix: "_g.gtz",
      svgPrefix: "assets/e/e",
      svgSuffix: "_g.svg",
      codePrefix: "e"
    },
    c: {
      label: "大本诗歌",
      folderText: "c_text",
      gtzPrefix: "assets/c/c",
      gtzSuffix: "_cn_g.gtz",
      svgPrefix: "assets/c/c",
      svgSuffix: "_cn_g.svg",
      codePrefix: "c"
    },
    ts: {
      label: "小本诗歌",
      folderText: "ts_text",
      gtzPrefix: "assets/ts/ts",
      gtzSuffix: "_cn_g.gtz",
      svgPrefix: "assets/ts/ts",
      svgSuffix: "_cn_g.svg",
      codePrefix: "ts"
    }
  };

  const MAX_RANGES = 20; // 最多支持 2000 首（够用了）

  const state = {
    currentBook: "c",
    currentNo: 1,
    // “显示模式”：score=吉他谱，lyrics=歌词
    mode: "score",
    // 歌词当前显示：simplified=简体, traditional=繁体
    script: "simplified",
    lyricsFontSize: 24,
    data: { e: [], c: [], ts: [] },
    loadedRanges: { e: {}, c: {}, ts: {} },
    searchBook: "c",
    searchDraft: "1",
    searchResults: []
  };

  const DEFAULT_VIEWER_PREFS = {
    scoreFontSizePx: 16,
    scoreSpacingFactor: 2.0,
    chordFontSizePx: 16,
    pureLyricsFontSize: 24,
    playbackSpeedPercent: 100,
    transposeSemitones: 0
  };

  let viewerPrefs = loadViewerPrefs();
  let __currentMeta = null;
  let __lastLoadedSongKey = null;

  function resetSongScopedPrefsIfNeeded(bookKey, no) {
    const key = `${bookKey}:${no}`;
    // 首次进入页面不重置；只有真正切到另一首歌时，重置只应作用于单首歌的临时操作。
    if (__lastLoadedSongKey && __lastLoadedSongKey !== key) {
      viewerPrefs.transposeSemitones = DEFAULT_VIEWER_PREFS.transposeSemitones;
      viewerPrefs.playbackSpeedPercent = DEFAULT_VIEWER_PREFS.playbackSpeedPercent;
      saveViewerPrefs();
      try { if (window.__atApi) window.__atApi.playbackSpeed = 1; } catch (e) {}
    }
    __lastLoadedSongKey = key;
  }

  let converterToTraditional = null; // 简 -> 繁
  let converterToSimplified = null;  // 繁 -> 简

  function setupConvertersIfNeeded() {
    if (!window.OpenCC) return;
    if (!converterToTraditional) {
      // 简体（cn） -> 繁体（tw）
      converterToTraditional = OpenCC.Converter({ from: "cn", to: "tw" });
    }
    if (!converterToSimplified) {
      // 繁体（tw） -> 简体（cn）
      converterToSimplified = OpenCC.Converter({ from: "tw", to: "cn" });
    }
  }

  function escapeHtml(str) {
    return String(str || "").replace(/[&<>"']/g, function(ch) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch];
    });
  }

  function convertTextByScript(text) {
    setupConvertersIfNeeded();
    if (state.script === "traditional" && converterToTraditional) {
      return converterToTraditional(text);
    }
    if (state.script === "simplified" && converterToSimplified) {
      return converterToSimplified(text); // 如果原 JSON 就是简体，这里基本等于原文
    }
    return text;
  }

  // ===== 简繁同步到 alphaTab 谱面歌词 =====
  // 说明：纯歌词页面来自 JSON，原本已经会转；谱面歌词是 alphaTab 渲染后的 SVG 文本，
  // 所以必须在 renderFinished / 切换简繁 / 切换谱种后，对 #alphaTab 内的中文 text/tspan 做 DOM 后处理。
  function isChineseTextForScriptConvert(text) {
    return /[㐀-鿿]/.test(String(text || ''));
  }

  function isLeafSvgTextElement(el) {
    if (!el) return false;
    const tag = String(el.tagName || '').toLowerCase();
    if (tag !== 'text' && tag !== 'tspan') return false;
    // 只改叶子节点，避免改 parent <text> 时把子 <tspan> 结构破坏。
    return !Array.from(el.children || []).some(child => {
      const t = String(child.tagName || '').toLowerCase();
      return t === 'text' || t === 'tspan';
    });
  }

  function applyScriptToScore() {
    setupConvertersIfNeeded();
    const root = document.getElementById('alphaTab');
    if (!root) return;

    const nodes = root.querySelectorAll('text, tspan');
    nodes.forEach((el) => {
      if (!isLeafSvgTextElement(el)) return;
      const current = String(el.textContent || '');
      if (!current || !isChineseTextForScriptConvert(current)) return;

      // 记录 alphaTab 原始渲染文本。之后反复切换简/繁都从原文转换，避免多次转换累积误差。
      if (!el.getAttribute('data-sjcg-orig-script-text')) {
        el.setAttribute('data-sjcg-orig-script-text', current);
      }
      const original = el.getAttribute('data-sjcg-orig-script-text') || current;
      let next = original;

      if (state.script === 'traditional' && converterToTraditional) {
        next = converterToTraditional(original);
      } else if (state.script === 'simplified' && converterToSimplified) {
        next = converterToSimplified(original);
      }

      if (next !== current) el.textContent = next;
    });
  }

  function scheduleApplyScriptToScore(delay = 80) {
    setTimeout(() => {
      try { applyScriptToScore(); } catch (e) { console.warn('applyScriptToScore failed', e); }
    }, delay);
  }

  function loadViewerPrefs() {
    try {
      const raw = localStorage.getItem('sjcg.viewerPrefs.v2');
      if (!raw) return { ...DEFAULT_VIEWER_PREFS };
      const obj = JSON.parse(raw);
      if (obj && Object.prototype.hasOwnProperty.call(obj, 'capoOverride')) {
        try { delete obj.capoOverride; } catch (e) {}
      }
      return { ...DEFAULT_VIEWER_PREFS, ...obj };
    } catch (e) {
      return { ...DEFAULT_VIEWER_PREFS };
    }
  }

  function saveViewerPrefs() {
    try { localStorage.setItem('sjcg.viewerPrefs.v2', JSON.stringify(viewerPrefs)); } catch (e) {}
  }

  function getSongCapo() {
    const metaCapo = parseInt(window.__gtzMeta?.capo, 10);
    return Number.isFinite(metaCapo) ? Math.max(0, Math.min(12, metaCapo)) : 0;
  }

  function getEffectiveCapo() {
    return getSongCapo();
  }

  function getDisplayedCapoLabel() {
    return getSongCapo() + getUserTranspose();
  }

  function getUserTranspose() {
    const n = parseInt(viewerPrefs.transposeSemitones, 10);
    return Number.isFinite(n) ? Math.max(-11, Math.min(11, n)) : 0;
  }

  function getEffectiveTranspose() {
    return getUserTranspose();
  }

  function trackUsesTab(track) {
    const staves = Array.isArray(track?.staves) ? track.staves : [];
    return staves.some((staff) => !!staff?.showTablature);
  }

  function getTrackTransposeSemitones(track) {
    const base = getUserTranspose();
    try {
      const scheme = (typeof window.getCurrentSchemeResult === 'function') ? window.getCurrentSchemeResult() : null;
      if (trackUsesTab(track)) {
        // 自动伴奏模式下，TAB 轨的品位/音高已经在重写后的 XML 中确定。
        // UI 转调只用于“重新求方案/和弦”，不能再对 TAB 轨二次转调，
        // 否则会出现：转调 +1，TAB 数字整体 +1、音高也整体 +1 的双重问题。
        if (scheme && scheme.mode === 'auto') return 0;
        return base;
      }
    } catch (e) {}
    return base;
  }

  const NOTE_INDEX_SHARP = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
  const NOTE_INDEX_FLAT  = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];
  const NOTE_TO_INDEX = {
    C: 0, 'B#': 0,
    'C#': 1, Db: 1,
    D: 2,
    'D#': 3, Eb: 3,
    E: 4, Fb: 4,
    F: 5, 'E#': 5,
    'F#': 6, Gb: 6,
    G: 7,
    'G#': 8, Ab: 8,
    A: 9,
    'A#': 10, Bb: 10,
    B: 11, Cb: 11
  };

  function prefersFlatsFromKeyName(keyName) {
    const raw = String(keyName || '').trim();
    const normalized = ({ 'G#':'Ab', 'D#':'Eb', 'A#':'Bb', 'C#':'Db', 'F#':'Gb' })[raw] || raw;
    return ['F','Bb','Eb','Ab','Db','Gb','Cb'].includes(normalized) || /^F(?:$|m)/i.test(normalized);
  }

  function transposePitchName(name, semitones, preferFlats) {
    if (!name || !Number.isFinite(semitones)) return name || '--';
    const normalized = String(name).trim();
    const m = normalized.match(/^([A-G](?:#|b)?)(.*)$/);
    if (!m) return normalized;
    const root = m[1];
    const suffix = m[2] || '';
    const idx = NOTE_TO_INDEX[root];
    if (idx == null) return normalized;
    const next = (idx + semitones % 12 + 12) % 12;
    const names = preferFlats ? NOTE_INDEX_FLAT : NOTE_INDEX_SHARP;
    return names[next] + suffix;
  }


  function transposeChordSymbol(symbol, semitones, preferFlats) {
    const raw = String(symbol || '').trim();
    if (!raw || !Number.isFinite(semitones) || semitones === 0) return raw;
    const m = raw.match(/^([A-G](?:#|b)?)([^/]*?)(?:\/([A-G](?:#|b)?))?$/);
    if (!m) return raw;
    const root = m[1];
    const quality = m[2] || '';
    const bass = m[3] || '';
    if (NOTE_TO_INDEX[root] == null) return raw;
    if (bass && NOTE_TO_INDEX[bass] == null) return raw;
    const nextRoot = transposePitchName(root, semitones, preferFlats);
    const nextBass = bass ? transposePitchName(bass, semitones, preferFlats) : '';
    return nextRoot + quality + (nextBass ? '/' + nextBass : '');
  }

  function getChordFontSizePx() {
    const n = parseInt(viewerPrefs?.chordFontSizePx, 10);
    return Number.isFinite(n) ? Math.max(10, Math.min(36, n)) : 16;
  }

  function looksLikeChordSymbol(text) {
    const s = String(text || '').trim();
    if (!s || s.length > 20) return false;
    if (!/^[A-G](?:#|b)?/.test(s)) return false;
    if (/[^A-Ga-g0-9#b\/()\-+susmajdimaugaddnoø°△mM ]/.test(s)) return false;
    return /^(?:[A-G](?:#|b)?)(?:m|maj|min|sus|dim|aug|add|[0-9]|\(|\/|$)/i.test(s);
  }

  function rewriteRenderedChordTexts() {
    const root = document.getElementById('alphaTab');
    if (!root) return;
    const semitones = getUserTranspose();
    const preferFlats = prefersFlatsFromKeyName((__currentMeta && __currentMeta.key_name) || '');
    const chordFontPx = getChordFontSizePx();
    const nodes = root.querySelectorAll('text, tspan');
    nodes.forEach((el) => {
      if (el.children && el.children.length) return;
      const current = (el.textContent || '').trim();
      if (!current) return;
      const original = el.getAttribute('data-orig-chord') || current;
      if (!looksLikeChordSymbol(original)) return;
      if (!el.getAttribute('data-orig-chord')) {
        el.setAttribute('data-orig-chord', original);
      }
      const next = semitones === 0 ? original : transposeChordSymbol(original, semitones, preferFlats);
      if (next && next !== current) {
        el.textContent = next;
      }
      try {
        el.style.fontSize = chordFontPx + 'px';
      } catch (e) {}
    });
  }

  let __chordObserver = null;
  let __chordRewriteTimer = null;
  function scheduleChordRewrite(delay = 80) {
    try { if (__chordRewriteTimer) clearTimeout(__chordRewriteTimer); } catch (e) {}
    __chordRewriteTimer = setTimeout(() => {
      rewriteRenderedChordTexts();
    }, delay);
  }

  function ensureChordObserver() {
    const root = document.getElementById('alphaTab');
    if (!root || __chordObserver) return;
    __chordObserver = new MutationObserver(() => {
      scheduleChordRewrite(30);
    });
    __chordObserver.observe(root, { childList: true, subtree: true, characterData: false });
  }

  function computeDisplayedKeyName(meta) {
    const m = meta || {};
    const original = m.key_name || '--';
    const semitones = getUserTranspose();
    if (!original || original === '--' || semitones === 0) return original;
    const preferFlats = prefersFlatsFromKeyName(original);
    return transposePitchName(original, semitones, preferFlats);
  }

  function getAllTracks(api) {
    const tracks = api?.score?.tracks || __currentScore?.tracks || [];
    return Array.isArray(tracks) ? tracks : [];
  }

  function getSelectedTrackIndices(api) {
    const tracks = getAllTracks(api);
    if (!tracks.length) return [];
    if (Array.isArray(__visibleTrackIndices)) return __visibleTrackIndices.slice();
    return tracks.map((_, i) => i);
  }

  function applyPlaybackTrackVisibility(api) {
    if (!api) return;
    const tracks = getAllTracks(api);
    if (!tracks.length || typeof api.changeTrackMute !== 'function') return;

    const selected = new Set(getSelectedTrackIndices(api));
    const hasExplicitSelection = Array.isArray(__visibleTrackIndices);
    const useAll = !hasExplicitSelection;

    tracks.forEach((track, i) => {
      const muted = useAll ? false : !selected.has(i);
      try { api.changeTrackMute([track], muted); } catch (e) {}
    });
  }

  function applyScoreTransposition(api) {
    if (!api || !api.settings) return;
    const tracks = getAllTracks(api);
    const trackTranspositions = tracks.length
      ? tracks.map((track) => getTrackTransposeSemitones(track))
      : [getEffectiveTranspose()];
    try {
      if (!api.settings.notation) api.settings.notation = {};
      api.settings.notation.transpositionPitches = trackTranspositions.slice();
      api.updateSettings();
      // 这里不要再叠加 changeTrackTranspositionPitch，避免 sourceCapo/transpose 被双重应用。
      try { api.render(); } catch (e) {}
      scheduleChordRewrite(120);
      scheduleTabCapoOverlay(140);
    } catch (e) {
      console.warn('applyScoreTransposition failed', e);
    }
  }

  function goHome() {
    window.location.href = "index.html";
  }

  async function goPrevSong() {
    await tryGoTo(-1);
  }

  async function goNextSong() {
    await tryGoTo(1);
  }


  window.__playerReady = false;
  window.__pendingPlayRequested = false;

  function updatePlayButtonReadyState() {
    try {
      const btn = document.getElementById('ui-play');
      if (!btn) return;
      const ready = !!window.__playerReady;
      btn.style.opacity = ready ? '1' : '0.55';
      btn.style.filter = ready ? 'none' : 'grayscale(0.2)';
      btn.title = ready ? '播放 / 暂停' : '音频加载中，请稍候';
    } catch (e) {}
  }

  function attachFinalPlayerGuards(api) {
    try {
      if (!api || api.__finalPlayerGuardsInstalled) return;
      api.__finalPlayerGuardsInstalled = true;

      window.__playerReady = false;
      updatePlayButtonReadyState();

      const markReady = () => {
        window.__playerReady = true;
        updatePlayButtonReadyState();
        if (window.__pendingPlayRequested) {
          window.__pendingPlayRequested = false;
          setTimeout(() => {
            try { if (window.__atApi === api) api.playPause(); } catch (e) {}
          }, 0);
        }
      };

      if (api.playerReady && api.playerReady.on) {
        api.playerReady.on(() => {
          markReady();
        });
      }

      if (api.playerStateChanged && api.playerStateChanged.on) {
        api.playerStateChanged.on(() => {
          updatePlayButtonReadyState();
        });
      }

      if (api.player && api.player.soundFontLoadFailed && api.player.soundFontLoadFailed.on) {
        api.player.soundFontLoadFailed.on(() => {
          window.__pendingPlayRequested = false;
          updatePlayButtonReadyState();
        });
      }

      if (api.player && api.player.midiLoadFailed && api.player.midiLoadFailed.on) {
        api.player.midiLoadFailed.on(() => {
          window.__pendingPlayRequested = false;
          updatePlayButtonReadyState();
        });
      }
    } catch (e) {}
  }

  updatePlayButtonReadyState();


  function togglePlayPause() {
    try {
      const api = window.__atApi;
      if (!api) return;
      if (!window.__playerReady) {
        window.__pendingPlayRequested = true;
        updatePlayButtonReadyState();
        return;
      }
      api.playPause();
    } catch (e) {
      console.warn('togglePlayPause failed', e);
    }
  }

  function setPlaybackSpeedPercent(value) {
    viewerPrefs.playbackSpeedPercent = Math.min(150, Math.max(50, parseInt(value, 10) || 100));
    saveViewerPrefs();
    refreshAdjustUI();
    updateMetaRow();
    try { if (window.__atApi) window.__atApi.playbackSpeed = viewerPrefs.playbackSpeedPercent / 100; } catch (e) {}
  }

  function changeTranspose(delta) {
    viewerPrefs.transposeSemitones = Math.max(-11, Math.min(11, getUserTranspose() + delta));
    saveViewerPrefs();
    refreshAdjustUI();
    updateMetaRow();
    applyViewerPrefsToScore();
  }

  function resetTranspose() {
    viewerPrefs.transposeSemitones = 0;
    saveViewerPrefs();
    refreshAdjustUI();
    updateMetaRow();
    applyViewerPrefsToScore();
  }

  function changeScoreFont(delta) {
    viewerPrefs.scoreFontSizePx = Math.max(14, Math.min(52, viewerPrefs.scoreFontSizePx + delta));
    saveViewerPrefs();
    refreshAdjustUI();
    applyViewerPrefsToScore();
  }

  function changeSpacing(delta) {
    const next = Math.round((viewerPrefs.scoreSpacingFactor + delta) * 10) / 10;
    viewerPrefs.scoreSpacingFactor = Math.max(1.0, Math.min(3.5, next));
    saveViewerPrefs();
    refreshAdjustUI();
    applyViewerPrefsToScore();
  }

  function rerenderScorePreserveScroll() {
    const api = window.__atApi;
    if (!api) return;
    const y = window.scrollY || window.pageYOffset || 0;
    try {
      if (typeof window.renderVisibleTracks === 'function') {
        window.renderVisibleTracks(api);
      } else if (typeof api.render === 'function') {
        api.render();
      }
    } catch (e) {
      console.warn('rerenderScorePreserveScroll failed', e);
    }
    setTimeout(() => { try { window.scrollTo({ top: y, behavior: 'instant' }); } catch (e) { try { window.scrollTo(0, y); } catch (e2) {} } }, 0);
    setTimeout(() => { try { window.scrollTo({ top: y, behavior: 'instant' }); } catch (e) { try { window.scrollTo(0, y); } catch (e2) {} } }, 120);
  }

  function changeChordFont(delta) {
    viewerPrefs.chordFontSizePx = Math.max(10, Math.min(36, getChordFontSizePx() + delta));
    saveViewerPrefs();
    if (window.__atApi) {
      applyChordFont(window.__atApi, getChordFontSizePx());

  function resetTextSettings() {

  async function setSearchBook(book, autoSearch = false) {
    state.searchBook = normalizeBook(book, state.searchBook || state.currentBook || 'c');
    const inputEl = document.getElementById('ui-search-input');
    const currentInput = String(inputEl?.value || '').trim();
    if (currentInput) state.searchDraft = currentInput;
    syncBookButtons();
    clearSearchResults();
    syncUI();

    const value = String(state.searchDraft || currentInput || '').trim();
    if (autoSearch && value) {
      return await performSearch(value, state.searchBook);
    }
    return true;
  }

  function setScriptMode(mode) {
    state.script = (mode === 'traditional') ? 'traditional' : 'simplified';
    syncScriptButton();
    getSong(state.currentBook, state.currentNo).then(song => {
      if (song) renderLyrics(song);
    });
    scheduleApplyScriptToScore(30);
    scheduleApplyScriptToScore(160);
    scheduleApplyScriptToScore(420);
  }

  async function setBook(book) {
    const nextBook = normalizeBook(book, state.currentBook || 'c');
    if (state.currentBook === nextBook) return true;
    state.currentBook = nextBook;
    syncBookButtons();
    updateURL();
    await loadAndRenderCurrentSong();
    return true;
  }

  async function performSearch(raw, bookOverride = null) {
    const value = String(raw || '').trim();
    state.searchDraft = value;
    if (!value) {
      clearSearchResults();
      return false;
    }

    const targetBook = isValidBook(bookOverride)
      ? bookOverride
      : normalizeBook(state.searchBook, state.currentBook || 'c');

    const digitsMatch = value.match(/^(\d{1,4})$/);
    if (digitsMatch) {
      const no = parseInt(digitsMatch[1], 10);
      if (!Number.isFinite(no) || no <= 0) {
        clearSearchResults();
        return false;
      }
      const song = await getSong(targetBook, no);
      if (!song) {
        renderSearchResults([], value, targetBook);
        return false;
      }

      state.searchBook = targetBook;
      state.currentBook = targetBook;
      state.currentNo = no;
      state.searchDraft = String(no);
      clearSearchResults();
      updateURL();
      await loadAndRenderCurrentSong();
      return true;
    }

    const results = await searchSongsByKeywordAll(value);
    renderSearchResults(results, value, 'all');
    return results.length > 0;
  }


  function updateMetaRow(meta) {
    __currentMeta = meta || __currentMeta || {};
  }

  function refreshAdjustUI() {

      scoreFontSizePx: viewerPrefs.scoreFontSizePx,

  function applyViewerPrefsToScore() {
    if (!window.__atApi) return;

    try { window.__atApi.playbackSpeed = viewerPrefs.playbackSpeedPercent / 100; } catch (e) {}
    scheduleChordRewrite(30);

  }


  let __tabCapoOverlayTimer = null;

  function ensureTabCapoOverlayRoot() {
    const host = document.getElementById('alphaTab');
    if (!host) return null;
    host.style.position = host.style.position || 'relative';
    let root = host.querySelector('.tab-capo-overlay-root');
    if (!root) {
      root = document.createElement('div');
      root.className = 'tab-capo-overlay-root';
      root.style.position = 'absolute';
      root.style.left = '0';
      root.style.top = '0';
      root.style.right = '0';
      root.style.bottom = '0';
      root.style.pointerEvents = 'none';
      root.style.zIndex = '20';
      host.appendChild(root);
    }
    return root;
  }

  function clearTabCapoOverlay() {
    const root = document.querySelector('#alphaTab .tab-capo-overlay-root');
    if (root) root.innerHTML = '';
  }

  function isTabBarBounds(barBounds) {
    const staff = barBounds?.bar?.staff;
    if (!staff) return false;
    // 只要这一条 staff 显示了 TAB，就允许 overlay；
    // 不再要求它必须是“纯TAB无五线谱”的 staff。
    return !!staff.showTablature;
  }

  function getActiveSchemeCapoForTab() {
    const cached = parseInt(window.__autoTabDisplayCapo, 10);
    if (Number.isFinite(cached)) return Math.max(0, Math.min(11, cached));
    const auto = window.__AUTO13;
    if (auto && auto.mode === 'auto') {
      if (auto.manualCapoMode) {
        const m = parseInt(auto.manualCapo, 10);
        return Number.isFinite(m) ? Math.max(0, Math.min(11, m)) : 0;
      }
      const c = parseInt(auto.currentScheme?.capo, 10);
      if (Number.isFinite(c)) return Math.max(0, Math.min(11, c));
      try {
        if (typeof window.getCurrentSchemeResult === 'function') {
          const s = window.getCurrentSchemeResult();
          const a = parseInt(s?.activeCapo, 10);
          if (Number.isFinite(a)) return Math.max(0, Math.min(11, a));
        }
      } catch (e) {}
      return 0;
    }
    return getEffectiveCapo();
  }

  function getTabDisplayShift() {
    const auto = window.__AUTO13;
    if (auto && auto.mode === 'auto') {
      // 自动伴奏模式下：底层 technical.fret 已经包含方案 CAPO，
      // 显示层只负责还原成“按法数字”。
      return -getActiveSchemeCapoForTab();
    }
    return getEffectiveCapo() + getUserTranspose();
  }

  function getDisplayedFretForCapo(note) {
    if (!note || !Number.isFinite(note.fret) || note.fret < 0) return null;
    const shifted = note.fret + getTabDisplayShift();
    return Math.max(0, shifted);
  }

  function renderTabCapoOverlay() {
    const api = window.__atApi;
    const root = ensureTabCapoOverlayRoot();
    if (!api || !root) return;
    root.innerHTML = '';

    const offset = getTabDisplayShift();
    const lookup = api.boundsLookup || api.renderer?.boundsLookup || null;
    const scheme = (typeof window.getCurrentSchemeResult === 'function') ? window.getCurrentSchemeResult() : null;
    const isAuto = !!(scheme && scheme.mode === 'auto');
    if ((!offset && !isAuto) || !lookup || !Array.isArray(lookup.staffSystems)) return;

    for (const system of lookup.staffSystems) {
      const masterBars = Array.isArray(system?.bars) ? system.bars : [];
      for (const masterBar of masterBars) {
        const barBoundsList = Array.isArray(masterBar?.bars) ? masterBar.bars : [];
        for (const barBounds of barBoundsList) {

              if (displayFret === null || !box) continue;
              const bw = box.w ?? box.width ?? 16;
              const bh = box.h ?? box.height ?? 16;
              const bx = box.x ?? 0;
              const by = box.y ?? 0;

              const el = document.createElement('div');

              el.textContent = String(displayFret);

              el.style.boxSizing = 'border-box';

  function base64ToUint8Array(b64) {
    const binary = atob(b64);
    const len = binary.length;
    const bytes = new Uint8Array(len);
    for (let i = 0; i < len; i++) bytes[i] = binary.charCodeAt(i);
    return bytes;
  }

  async function loadGtzIntoAlphaTab(api, gtzUrl) {
    window.__playerReady = false;
    window.__pendingPlayRequested = false;
    updatePlayButtonReadyState();
    try { api.stop(); } catch(e) {}
    setPlayerUI({ current: 0, total: 0, playing: false });

    const res = await fetch(gtzUrl);
    if (!res.ok) throw new Error(`HTTP ${res.status} ${gtzUrl}`);
    const txt = await res.text();
    let gtz;
    try { gtz = JSON.parse(txt); } catch(e) { throw new Error('gtz 不是合法 JSON: ' + e.message); }

    let scoreB64 = null;
    if (gtz?.gpBase64) scoreB64 = gtz.gpBase64;
    else if (gtz?.score?.data) scoreB64 = gtz.score.data;
    else if (gtz?.scoreBase64) scoreB64 = gtz.scoreBase64;
    if (!scoreB64) throw new Error('gtz 格式错误：缺少谱面数据');

    const st = gtz?.state || null;
    const vs = gtz?.viewerState || null;
    window.__gtzState = {
      fontSizePx: DEFAULT_VIEWER_PREFS.scoreFontSizePx,
      spacingFactor: st?.spacingFactor ?? vs?.spacingFactor ?? DEFAULT_VIEWER_PREFS.scoreSpacingFactor,
      zoom: st?.zoom ?? (vs?.zoom != null ? Math.round(vs.zoom * 100) : 100),
      visibleTrackIndices: st?.visibleTrackIndices ?? vs?.visibleTrackIndices ?? null
    };
    window.__gtzMeta = gtz?.meta || null;
    updateMetaRow(window.__gtzMeta || null);

    try {
      const xmlText = decodeBase64ToText(scoreB64);
      if (/^\s*</.test(xmlText)) {
        window.__originalXmlText = xmlText;
        window.__originalScoreB64 = scoreB64;
        const parsed = buildMusicTimelineFromXML(xmlText);
        window.__musicTimelineRaw = parsed;
        window.__chordTimelineRaw = parsed.chords.slice();
        window.__measureTimelineRaw = parsed.measures.slice();
      }
    } catch (e) {
      console.warn('GTZ时间轴解析失败:', e);
      window.__originalXmlText = null;
      window.__musicTimelineRaw = { chords: [], measures: [], totalTicks: 0, timeSignatures: [] };
      window.__chordTimelineRaw = [];
      window.__measureTimelineRaw = [];
    }

    const bytes = base64ToUint8Array(scoreB64);
    api.load(bytes);

    setPlayerStatus('谱面已加载');
    return gtz;
  }

    return `${m}:${s}`;
  }

  function applyZoom(api, zoom) {
    if (!api || !zoom) return;
    try {
      const settings = api.settings;
      if (!settings.display) settings.display = {};
      // 这里以 1.0 为基准缩放（你导出的 zoom=100 表示不缩放）
      settings.display.scale = (zoom / 100);

  // ===== 响应式：控制每行小节数（barsPerRow）与横竖屏 =====
  // 目标：
  // - 手机竖屏：>=2 小节/行
  // - 手机横屏：>=3 小节/行
  // - iPad/电脑：>=5 小节/行（宽屏可到 6）
  let __exportBaseScale = 1.0; // 来自 .gtz.state.zoom
  let __lastBarsPerRow = null;
  let __lastResponsiveScale = null;

  function computeBarsPerRow(width, isLandscape) {
    // width: alphaTab 容器可用宽度
    if (width <= 0 || !isFinite(width)) return -1;
    if (width < 520) return isLandscape ? 3 : 2;        // 手机
    if (width < 740) return isLandscape ? 4 : 3;        // 大屏手机/小平板
    if (width < 1100) return 5;                         // iPad/笔记本
    return 6;                                           // 大屏桌面
  }

  function computeResponsiveScale(width, isLandscape) {
    // 为了保证“每行小节数”能达到目标，小屏适当缩放
    if (width < 520) return isLandscape ? 0.88 : 0.92;
    if (width < 740) return isLandscape ? 0.90 : 0.94;
    if (width < 1100) return 0.96;
    return 1.0;
  }

  function applyResponsiveLayout(api) {
    if (!api) return;
    const el = document.getElementById('score-view') || document.getElementById('alphaTab') || document.body;
    const w = (el && el.clientWidth) ? el.clientWidth : window.innerWidth;
    const isLandscape = window.matchMedia && window.matchMedia('(orientation: landscape)').matches;

    const bars = computeBarsPerRow(w, isLandscape);
    const mul = computeResponsiveScale(w, isLandscape);

    try {
      const settings = api.settings;
      if (!settings.display) settings.display = {};

      // 强制 Page 布局，barsPerRow 才会生效
      if (window.alphaTab?.LayoutMode) {
        settings.display.layoutMode = window.alphaTab.LayoutMode.Page;
      }

      // 使用系统自动布局（避免小屏变成 1 小节/行）
      if (window.alphaTab?.SystemsLayoutMode) {
        settings.display.systemsLayoutMode = window.alphaTab.SystemsLayoutMode.Automatic;
      }

      // 设置每行小节数
      settings.display.barsPerRow = bars;

      // 缩放：导出基准 * 响应式乘子
      const responsiveScale = (__exportBaseScale || 1.0) * mul;
      settings.display.scale = responsiveScale;

      // 仅当有变化才更新，减少闪烁
      if (__lastBarsPerRow !== bars || Math.abs((__lastResponsiveScale||0) - responsiveScale) > 0.001) {
        __lastBarsPerRow = bars;
        __lastResponsiveScale = responsiveScale;
        api.updateSettings();
        // alphaTab 会自动响应 resize，但 barsPerRow/scale 变化最好强制 render
        try { api.render(); } catch(e) {}
      }
    } catch (e) {
      console.warn('applyResponsiveLayout failed', e);
    }
  }

  let __resizeTimer = null;
  function scheduleResponsiveLayout(api) {
    if (__resizeTimer) clearTimeout(__resizeTimer);
    __resizeTimer = setTimeout(() => applyResponsiveLayout(api), 120);
  }

// ===== 多轨道同页显示 + 轨道开关 =====
  let __currentScore = null;

  function snapshotTrackStaffVisibility(score) {
    if (!score || !Array.isArray(score.tracks)) return;
    for (const track of score.tracks) {
      if (!track || !Array.isArray(track.staves)) continue;
      for (const staff of track.staves) {
        if (!staff) continue;
        if (staff.__origShowStandardNotation == null) staff.__origShowStandardNotation = !!staff.showStandardNotation;
        if (staff.__origShowTablature == null) staff.__origShowTablature = !!staff.showTablature;
        if ('showNumbered' in staff && staff.__origShowNumbered == null) staff.__origShowNumbered = !!staff.showNumbered;
        if ('showNumberedNotation' in staff && staff.__origShowNumberedNotation == null) staff.__origShowNumberedNotation = !!staff.showNumberedNotation;
      }
    }
  }

  function applyTrackSelectionToScore(score, selectedIdxs) {
    if (!score || !Array.isArray(score.tracks)) return;
    snapshotTrackStaffVisibility(score);
    const selected = new Set(Array.isArray(selectedIdxs) ? selectedIdxs : []);
    const showAll = !selected.size || selected.size === score.tracks.length;
    let staffMode = 'five';
    try { staffMode = localStorage.getItem('staffMode') || 'five'; } catch (e) {}
    score.tracks.forEach((track, trackIndex) => {
      if (!track || !Array.isArray(track.staves)) return;
      const keep = showAll || selected.has(trackIndex);
      track.staves.forEach((staff) => {
        if (!staff) return;
        if (keep) {
          if (staff.__origShowStandardNotation != null) staff.showStandardNotation = !!staff.__origShowStandardNotation;
          if (staff.__origShowTablature != null) staff.showTablature = !!staff.__origShowTablature;
          if ('showNumbered' in staff && staff.__origShowNumbered != null) staff.showNumbered = !!staff.__origShowNumbered;
          if ('showNumberedNotation' in staff && staff.__origShowNumberedNotation != null) staff.showNumberedNotation = !!staff.__origShowNumberedNotation;
          if (!staff.showTablature) {
            staff.showStandardNotation = (staffMode !== 'jian');
            if ('showNumbered' in staff) staff.showNumbered = (staffMode === 'jian');
            if ('showNumberedNotation' in staff) staff.showNumberedNotation = (staffMode === 'jian');
          }
        } else {
          staff.showStandardNotation = false;
          staff.showTablature = false;
          if ('showNumbered' in staff) staff.showNumbered = false;
          if ('showNumberedNotation' in staff) staff.showNumberedNotation = false;
        }
      });
    });
  }

  function renderVisibleTracks(api) {
    if (!api || !__currentScore) return;
    let idxs = Array.isArray(__visibleTrackIndices) ? __visibleTrackIndices.slice() : [];
    if (!idxs.length) {
      idxs = __currentScore.tracks.map((_, i) => i);
    }
    window.__visibleTrackIndices = idxs.slice();
    try {
      applyTrackSelectionToScore(__currentScore, idxs);
      if (api.score && api.score !== __currentScore) applyTrackSelectionToScore(api.score, idxs);
      const renderIdxs = __currentScore.tracks.map((_, i) => i);
      api.renderScore(__currentScore, renderIdxs);
    } catch (e) {
      console.warn('renderScore failed, fallback render', e);
      try { api.render(); } catch(e2) {}
    }
    applyPlaybackTrackVisibility(api);
    applyTrackVolumes(api);
  }

  window.renderVisibleTracks = renderVisibleTracks;

  const TRACK_VOLUME_STORE_KEY = 'sjcg.trackVolumes.v1';

  function getCurrentTrackVolumeSongKey() {
    const book = state.currentBook || window.__gtzMeta?.book || 'c';
    const no = state.currentNo || window.__gtzMeta?.no || 1;
    return `${book}:${no}`;
  }

  function loadAllTrackVolumes() {
    try {
      const raw = localStorage.getItem(TRACK_VOLUME_STORE_KEY);
      const obj = raw ? JSON.parse(raw) : {};
      return (obj && typeof obj === 'object') ? obj : {};
    } catch (e) {
      return {};
    }
  }

  function saveAllTrackVolumes(obj) {
    try { localStorage.setItem(TRACK_VOLUME_STORE_KEY, JSON.stringify(obj || {})); } catch (e) {}
  }

  function getTrackVolumePercent(trackIndex) {
    const all = loadAllTrackVolumes();
    const key = getCurrentTrackVolumeSongKey();
    const songMap = all[key] || {};
    const v = parseInt(songMap[String(trackIndex)], 10);
    return Number.isFinite(v) ? Math.max(0, Math.min(100, v)) : 100;
  }

  function setTrackVolumePercent(trackIndex, percent) {
    const p = Math.max(0, Math.min(100, parseInt(percent, 10) || 0));
    const all = loadAllTrackVolumes();
    const key = getCurrentTrackVolumeSongKey();
    if (!all[key] || typeof all[key] !== 'object') all[key] = {};
    all[key][String(trackIndex)] = p;
    saveAllTrackVolumes(all);
    applySingleTrackVolume(window.__atApi, trackIndex, p);
  }

  function applySingleTrackVolume(api, trackIndex, percent) {
    if (!api) return;
    const tracks = getAllTracks(api);
    const track = tracks[trackIndex];
    if (!track) return;

    const p = Math.max(0, Math.min(100, parseInt(percent, 10) || 0));
    const volume16 = Math.round((p / 100) * 16);
    const volume01 = p / 100;

    try {
      if (!track.playbackInfo) track.playbackInfo = {};
      track.playbackInfo.volume = volume16;
    } catch (e) {}

    if (typeof api.changeTrackVolume === 'function') {
      try {
        api.changeTrackVolume([track], volume16);
        return;
      } catch (e1) {
        try { api.changeTrackVolume([track], volume01); return; } catch (e2) {}
      }
    }

    try {
      if (typeof api.updateSettings === 'function') api.updateSettings();
    } catch (e) {}
  }

  function applyTrackVolumes(api) {
    if (!api) return;
    const tracks = getAllTracks(api);
    if (!tracks.length) return;
    tracks.forEach((_, i) => applySingleTrackVolume(api, i, getTrackVolumePercent(i)));
  }

  function getTrackDisplayName(track, index) {
    const name =
      track?.name ||
      track?.trackName ||
      track?.shortName ||
      track?.instrument?.name ||
      track?.playbackInfo?.name ||
      '';
    const s = String(name || '').trim();
    return s || `轨道 ${index + 1}`;
  }

  function closeTracksPanel() {
    const panel = document.getElementById('new-track-panel');
    if (panel) panel.classList.add('hidden');
  }

  function toggleTracksPanel() {
    const panel = document.getElementById('new-track-panel');
    if (!panel) return;
    panel.classList.toggle('hidden');
  }

  function buildTracksPanel(score) {
    if (!score || !Array.isArray(score.tracks)) return null;
    let panel = document.getElementById('new-track-panel');
    if (!panel) {
      panel = document.createElement('div');
      panel.id = 'new-track-panel';
      panel.className = 'new-track-panel hidden';
      document.body.appendChild(panel);
    }

    const tracks = score.tracks || [];
    const selectedSet = new Set(
      Array.isArray(__visibleTrackIndices) && __visibleTrackIndices.length
        ? __visibleTrackIndices
        : tracks.map((_, i) => i)
    );

    const rows = tracks.map((track, i) => {
      const checked = selectedSet.has(i) ? 'checked' : '';
      const vol = getTrackVolumePercent(i);
      const name = escapeHtml(getTrackDisplayName(track, i));
      return `
        <div class="new-track-item-wrap" data-track-index="${i}">
          <label class="new-track-item">
            <input type="checkbox" class="new-track-check" data-track-index="${i}" ${checked}>
            <span class="new-track-name">${name}</span>
          </label>
          <div class="new-track-volume-row">
            <span class="new-track-volume-label">音量</span>
            <input type="range" class="new-track-volume-range" data-track-index="${i}" min="0" max="100" step="5" value="${vol}">
            <span class="new-track-volume-value" data-track-index="${i}">${vol}%</span>
          </div>
        </div>
      `;
    }).join('');

    panel.innerHTML = `
      <div class="new-track-panel-inner">
        <div class="new-track-panel-head">
          <span>轨道</span>
          <button type="button" class="new-track-close" id="new-track-close">×</button>
        </div>
        <div class="new-track-panel-actions">
          <button type="button" class="new-track-ghost" id="new-track-all">全选</button>
          <button type="button" class="new-track-ghost" id="new-track-none">全不选</button>
          <button type="button" class="new-track-ghost" id="new-track-volume-reset">音量恢复</button>
        </div>
        <div class="new-track-list">${rows || '<div class="core-panel-note">没有轨道</div>'}</div>
      </div>
    `;

    const applySelection = () => {
      const checks = Array.from(panel.querySelectorAll('.new-track-check'));
      const idxs = checks
        .filter(ch => ch.checked)
        .map(ch => parseInt(ch.getAttribute('data-track-index'), 10))
        .filter(n => Number.isFinite(n));
      __trackSelectionTouched = true;
      __visibleTrackIndices = idxs;
      window.__visibleTrackIndices = idxs.slice();
      if (__trackSelectionRenderTimer) clearTimeout(__trackSelectionRenderTimer);
      __trackSelectionRenderTimer = setTimeout(() => {
        try {
          if (window.__atApi) window.renderVisibleTracks(window.__atApi);
          applyTrackVolumes(window.__atApi);
        } catch (e) {}
      }, 80);
    };

    panel.querySelectorAll('.new-track-check').forEach(ch => {
      ch.addEventListener('change', applySelection);
    });

    panel.querySelectorAll('.new-track-volume-range').forEach(range => {
      const handler = () => {
        const idx = parseInt(range.getAttribute('data-track-index'), 10);
        const val = parseInt(range.value, 10) || 0;
        const label = panel.querySelector(`.new-track-volume-value[data-track-index="${idx}"]`);
        if (label) label.textContent = `${val}%`;
        setTrackVolumePercent(idx, val);
      };
      range.addEventListener('input', handler);
      range.addEventListener('change', handler);
    });

    const btnClose = panel.querySelector('#new-track-close');
    if (btnClose) btnClose.addEventListener('click', closeTracksPanel);

    const btnAll = panel.querySelector('#new-track-all');
    if (btnAll) btnAll.addEventListener('click', () => {
      panel.querySelectorAll('.new-track-check').forEach(ch => { ch.checked = true; });
      applySelection();
    });

    const btnNone = panel.querySelector('#new-track-none');
    if (btnNone) btnNone.addEventListener('click', () => {
      panel.querySelectorAll('.new-track-check').forEach(ch => { ch.checked = false; });
      applySelection();
    });

    const btnVolReset = panel.querySelector('#new-track-volume-reset');
    if (btnVolReset) btnVolReset.addEventListener('click', () => {
      const all = loadAllTrackVolumes();
      const key = getCurrentTrackVolumeSongKey();
      if (all[key]) {
        delete all[key];
        saveAllTrackVolumes(all);
      }
      panel.querySelectorAll('.new-track-volume-range').forEach(range => {
        range.value = '100';
        const idx = parseInt(range.getAttribute('data-track-index'), 10);
        const label = panel.querySelector(`.new-track-volume-value[data-track-index="${idx}"]`);
        if (label) label.textContent = '100%';
        applySingleTrackVolume(window.__atApi, idx, 100);
      });
    });

    applyTrackVolumes(window.__atApi);
    return panel;
  }

  async function loadRange(bookKey, rangeIndex) {
    if (!isValidBook(bookKey)) return false;
    if (BOOKS[bookKey].textSingleFile && rangeIndex > 0) return false;
    if (state.loadedRanges[bookKey][rangeIndex]) return true;
    const url = getRangeFilePath(bookKey, rangeIndex);
    try {
      const res = await fetch(url);
      if (!res.ok) {
        state.loadedRanges[bookKey][rangeIndex] = true;
        return false;
      }
      const json = await res.json();
      if (!Array.isArray(json) || json.length === 0) {
        state.loadedRanges[bookKey][rangeIndex] = true;
        return false;
      }
      state.data[bookKey] = state.data[bookKey].concat(json);
      state.loadedRanges[bookKey][rangeIndex] = true;
      return true;
    } catch (e) {

      state.loadedRanges[bookKey][rangeIndex] = true;

  function flattenSongText(value, bucket) {
    if (value == null) return;
    if (typeof value === 'string' || typeof value === 'number') {
      const s = String(value).trim();
      if (s) bucket.push(s);
      return;
    }
    if (Array.isArray(value)) {
      value.forEach(item => flattenSongText(item, bucket));
      return;
    }
    if (typeof value === 'object') {
      Object.values(value).forEach(item => flattenSongText(item, bucket));
    }
  }

  function getSongSearchBundle(song) {
    const titleParts = [];
    const bodyParts = [];
    flattenSongText(song?.title, titleParts);
    flattenSongText(song?.full_title, titleParts);
    flattenSongText(song?.big_title, titleParts);
    flattenSongText(song?.subtitle, titleParts);
    flattenSongText(song?.lyrics, bodyParts);
    flattenSongText(song?.verses, bodyParts);
    flattenSongText(song?.chorus, bodyParts);
    flattenSongText(song?.content, bodyParts);
    const titleText = titleParts.join(' ');

      bodyText,
      titleNorm: normalizeSearchText(titleText),
      bodyNorm: normalizeSearchText(bodyText)

  async function searchSongsByKeyword(bookKey, rawQuery) {
    const query = String(rawQuery || '').trim();
    const norm = normalizeSearchText(query);
    if (!norm) return [];
    const songs = await ensureSearchCorpus(bookKey);
    const hits = [];
    songs.forEach(song => {
      if (!song || !song.no) return;
      const bundle = getSongSearchBundle(song);
      const titleHit = bundle.titleNorm.includes(norm);
      const bodyHit = !titleHit && bundle.bodyNorm.includes(norm);
      if (!titleHit && !bodyHit) return;
      const sourceText = titleHit ? (bundle.titleText || '') : (bundle.bodyText || '');
      const idx = sourceText.indexOf(query);
      let snippet = '';
      if (idx >= 0) {
        const start = Math.max(0, idx - 12);
        const end = Math.min(sourceText.length, idx + query.length + 18);
        snippet = sourceText.slice(start, end).replace(/\s+/g, ' ').trim();
      } else if (sourceText) {
        snippet = sourceText.slice(0, 36).replace(/\s+/g, ' ').trim();
      }
      hits.push({
        book: bookKey,
        no: song.no,
        title: song.title || song.full_title || `${BOOKS[bookKey].label} 第 ${song.no} 首`,
        snippet,
        rank: titleHit ? 0 : 1
      });
    });
    hits.sort((a, b) => (a.rank - b.rank) || (a.no - b.no));
    return hits.slice(0, 50);
  }

  async function searchSongsByKeywordAll(rawQuery) {
    const allBooks = getAllBookKeys();
    const groups = await Promise.all(allBooks.map(bookKey => searchSongsByKeyword(bookKey, rawQuery)));
    const merged = groups.flat();
    merged.sort((a, b) => (a.rank - b.rank) || (a.no - b.no) || a.book.localeCompare(b.book));
    return merged.slice(0, 80);
  }

      sec.className = "lyrics-section";

      const noDiv = document.createElement("div");
      noDiv.className = "lyrics-section-no";
      noDiv.textContent = section.section_no || "";

      const linesWrap = document.createElement("div");
      linesWrap.className = "lyrics-lines";

      (section.lines || []).forEach(lineText => {
        const p = document.createElement("p");
        p.textContent = convertTextByScript(lineText || "");
        linesWrap.appendChild(p);
      });

      sec.appendChild(noDiv);
      sec.appendChild(linesWrap);
      root.appendChild(sec);
    });
  }

  function getCurrentSongCodeLabel() {
    const bookKey = normalizeBook(state.currentBook, 'c');
    const prefix = (BOOKS[bookKey]?.codePrefix || bookKey).toUpperCase();
    const no = Number.isFinite(Number(state.currentNo)) ? Number(state.currentNo) : 1;
    return `${prefix}_${no}`;
  }

  function updateSongCodeBadge() {
    const el = document.getElementById('ui-song-code');
    if (el) el.textContent = getCurrentSongCodeLabel();
  }

  function updateTitle(song) {
    const bigTitleEl = document.getElementById("ui-title-big");
    const subTitleEl = document.getElementById("ui-title-main");
    const fallbackTitle = `${BOOKS[state.currentBook].label} 第 ${state.currentNo} 首`;
    const bigTitle = (song && song.big_title) ? song.big_title : ((song && song.title) ? song.title : fallbackTitle);
    const subTitle = (song && song.title && song.big_title) ? song.title : ((song && song.title && !song.big_title) ? '' : '');

    if (bigTitleEl) bigTitleEl.textContent = bigTitle;
    if (subTitleEl) subTitleEl.textContent = subTitle;
    document.title = bigTitle + (subTitle ? ` - ${subTitle}` : '') + " - 召会诗歌吉他谱";
  }

  function setMode(mode) {
    state.mode = mode;
    const scoreView = document.getElementById("score-view");
    const lyricsView = document.getElementById("lyrics-view");

    if (mode === "score") {
      if (scoreView) { scoreView.style.display = ""; scoreView.setAttribute("aria-hidden", "false"); }
      if (lyricsView) { lyricsView.style.display = "none"; lyricsView.setAttribute("aria-hidden", "true"); }
    } else {
      if (scoreView) { scoreView.style.display = "none"; scoreView.setAttribute("aria-hidden", "true"); }
      if (lyricsView) { lyricsView.style.display = ""; lyricsView.setAttribute("aria-hidden", "false"); }
    }
  }

  function syncBookButtons() {
    return;
  }

  function syncScriptButton() {
    return;
  }

  function updateURL() {
    const url = new URL(window.location.href);
    url.searchParams.set("book", state.currentBook);
    url.searchParams.set("no", String(state.currentNo));
    window.history.replaceState({}, "", url.toString());
  }

  async function loadAndRenderCurrentSong() {
    const song = await getSong(state.currentBook, state.currentNo);
    if (!song) {
      alert("找不到这首诗歌的歌词数据。");
      return;
    }
    resetSongScopedPrefsIfNeeded(state.currentBook, state.currentNo);
    updateTitle(song);
    updateSongCodeBadge();
    renderScore(state.currentBook, state.currentNo);
    renderLyrics(song);
    setMode(state.mode); // 保持当前 吉他 / 歌词 模式
    syncScriptButton();
  }

  async function tryGoTo(delta) {
    const newNo = state.currentNo + delta;
    if (newNo <= 0) {
      alert("已经是第一首了。");
      return;
    }
    const song = await getSong(state.currentBook, newNo);
    if (!song) {
      alert(delta > 0 ? "已经是最后一首了。" : "已经是第一首了。");
      return;
    }
    state.currentNo = newNo;
    updateURL();
    await loadAndRenderCurrentSong();
  }

  function goToNumber(no) {
    state.currentNo = no;
    updateURL();
    loadAndRenderCurrentSong();
  }

  function handleSearch() {
    performSearch(document.getElementById("ui-search-input")?.value || "");
  }

  document.addEventListener("DOMContentLoaded", async () => {
    parseQuery();
    applyViewerPrefsToLyricsPage();
    await loadAndRenderCurrentSong();
  });
</script>


<script>
(function(){
  function getStaffMode(){
    try { return localStorage.getItem('staffMode') || 'five'; } catch(e) { return 'five'; }
  }
  function updateCoreStaffUI(){
    const mode = getStaffMode();
    document.getElementById('ui-staff-five')?.classList.toggle('active', mode === 'five');
    document.getElementById('ui-staff-jian')?.classList.toggle('active', mode === 'jian');
    
  }
  function applyStaffModeToTracks(score, mode){
    if (!score || !Array.isArray(score.tracks)) return;
    for (const track of score.tracks){
      if (!track || !Array.isArray(track.staves)) continue;
      for (const staff of track.staves){
        if (!staff || staff.showTablature) continue;
        staff.showStandardNotation = (mode !== 'jian');
        if ('showNumbered' in staff) staff.showNumbered = (mode === 'jian');
        if ('showNumberedNotation' in staff) staff.showNumberedNotation = (mode === 'jian');
      }
    }
  }
  function fixRenderedJianpuDom(mode){
    const showJian = mode === 'jian';
    document.body.classList.toggle('jian-mode', showJian);
    document.querySelectorAll('#alphaTab .atj-keysig, #alphaTab .atj-jianpu, #alphaTab .atj-time-signature').forEach(el => {
      el.style.display = showJian ? '' : 'none';
    });
    scheduleApplyScriptToScore(40);
  }
  let __staffModeRendering = false;
  function rerenderForStaffMode(){
    const api = window.__atApi;
    if (!api || __staffModeRendering) return;
    const mode = getStaffMode();
    applyStaffModeToTracks(window.__currentScore || api.score, mode);
    applyStaffModeToTracks(api.score, mode);
    __staffModeRendering = true;
    try {
      if (typeof window.renderVisibleTracks === 'function') {
        window.renderVisibleTracks(api);
      } else if (typeof api.render === 'function') {
        api.render();
      }
    } catch (e) {
      console.warn('rerenderForStaffMode failed', e);
    } finally {
      setTimeout(() => { __staffModeRendering = false; }, 0);
    }
    setTimeout(() => fixRenderedJianpuDom(mode), 30);
    setTimeout(() => fixRenderedJianpuDom(mode), 180);
  }
  function applyStaffMode(options){
    const opts = options || {};
    const mode = getStaffMode();
    updateCoreStaffUI();
    if (opts.domOnly) {
      fixRenderedJianpuDom(mode);
      return;
    }
    rerenderForStaffMode();
  }
  window.applyStaffMode = applyStaffMode;
  document.addEventListener('DOMContentLoaded', () => {
    updateCoreStaffUI();
    setTimeout(applyStaffMode, 400);
  });
  const t = setInterval(() => {
    if (window.__atApi) {
      clearInterval(t);
      try { window.__atApi.renderFinished.on(() => setTimeout(() => fixRenderedJianpuDom(getStaffMode()), 30)); } catch(e) {}
    }
  }, 300);
})();
</script>

<script>
(function(){
  function $(id){ return document.getElementById(id); }
  function qa(sel, root){ return Array.from((root||document).querySelectorAll(sel)); }
  function openPanel(id){
    const layer = $('core-panel-layer');
    if(!layer) return;
    qa('.core-panel', layer).forEach(p=>p.hidden=true);
    if(!id){
      layer.hidden = true;
      layer.setAttribute('aria-hidden','true');
      return;
    }
    layer.hidden = false;
    layer.setAttribute('aria-hidden','false');
    const p = $(id);
    if(p) p.hidden = false;
  }
  function closePanels(){ openPanel(null); }

    function syncUI(){
    const tempoMeta = (__currentMeta && __currentMeta.tempo != null && __currentMeta.tempo !== '') ? String(__currentMeta.tempo) : '--';
    const keyMeta = computeDisplayedKeyName(__currentMeta || {});
    const capoMeta = String(getDisplayedCapoLabel());
    const speedPct = parseInt(viewerPrefs.playbackSpeedPercent, 10) || 100;
    const transVal = getUserTranspose();
    const transText = transVal > 0 ? `+${transVal}` : String(transVal);
    const fontText = String(viewerPrefs.scoreFontSizePx);
    const spacingText = `${viewerPrefs.scoreSpacingFactor.toFixed(1)}x`;
    const chordText = String(getChordFontSizePx());
    const currentTime = msToMMSS(__playbackState.current || 0);
    const originalTempo = parseInt(tempoMeta,10);
    const displayTempo = Number.isFinite(originalTempo) ? Math.round(originalTempo * speedPct / 100) : speedPct;

    if($('ui-speed')) $('ui-speed').textContent = String(displayTempo || tempoMeta || '95');
    if($('ui-key')) $('ui-key').textContent = keyMeta || '--';
    if($('ui-capo')) $('ui-capo').textContent = 'CP' + capoMeta;
    
    
    if($('ui-time')) $('ui-time').textContent = currentTime;
    if($('ui-progress')) $('ui-progress').value = String(__playbackState.progress || 0);
    if($('ui-speed-range')) $('ui-speed-range').value = String(speedPct);
    if($('ui-speed-value')) $('ui-speed-value').textContent = speedPct + '%';
    if($('ui-key-value')) $('ui-key-value').textContent = transText;
    if($('ui-font-value')) $('ui-font-value').textContent = fontText;
    if($('ui-spacing-value')) $('ui-spacing-value').textContent = spacingText;
    if($('ui-chord-value')) $('ui-chord-value').textContent = chordText;
    const searchPanelOpen = $('panel-search') && !$('panel-search').hidden;
    if($('ui-search-input') && document.activeElement !== $('ui-search-input') && !searchPanelOpen) $('ui-search-input').value = String(state.searchDraft || state.currentNo || '');
    if($('search-input') && document.activeElement !== $('search-input')) $('search-input').value = String(state.searchDraft || state.currentNo || '');
    const activeBookForSearch = normalizeBook(state.searchBook || state.currentBook, 'c');
    $('ui-book-e')?.classList.toggle('active', activeBookForSearch === 'e');
    $('ui-book-c')?.classList.toggle('active', activeBookForSearch === 'c');
    $('ui-book-ts')?.classList.toggle('active', activeBookForSearch === 'ts');
    $('ui-switch-e')?.classList.toggle('active', state.currentBook === 'e');
    $('ui-switch-c')?.classList.toggle('active', state.currentBook === 'c');
    $('ui-switch-ts')?.classList.toggle('active', state.currentBook === 'ts');
    $('ui-mode-score')?.classList.toggle('active', state.mode === 'score');
    $('ui-mode-lyrics')?.classList.toggle('active', state.mode === 'lyrics');
    $('ui-lang-simp')?.classList.toggle('active', state.script === 'simplified');
    $('ui-lang-trad')?.classList.toggle('active', state.script === 'traditional');
    $('ui-staff-lyrics')?.classList.toggle('active', state.mode === 'lyrics');
    const staffBtn = $('ui-staff');
    if (staffBtn) {
      const img = staffBtn.querySelector('img');
      const note = staffBtn.querySelector('.core-btn-note');
      const mode = (state.mode === 'lyrics') ? 'lyrics' : ((function(){ try { return localStorage.getItem('staffMode') || 'five'; } catch(e) { return 'five'; } })());
      if (img) {
        img.src = mode === 'lyrics'
          ? 'assets/ui_icons/lyrics.svg'
          : (mode === 'jian' ? 'assets/ui_icons/jianpu.svg' : 'assets/ui_icons/staff-five.svg');
      }
      if (note) {
        note.textContent = mode === 'lyrics' ? '歌词' : (mode === 'jian' ? '简谱' : '五线谱');
      }
    }
  }

  async function switchToLinkedBook(targetBook) {
    targetBook = normalizeBook(targetBook, null);
    if (!targetBook) return false;
    if (state.currentBook === targetBook) { closePanels(); return true; }
    const currentSong = await getSong(state.currentBook, state.currentNo);
    const targetNo = currentSong?.links?.[targetBook];
    if (targetNo == null || targetNo === '') {
      alert(`这首没有对应的${BOOKS[targetBook]?.shortLabel || BOOKS[targetBook]?.label || targetBook}版本。`);
      return false;
    }
    state.currentBook = targetBook;
    state.searchBook = targetBook;
    state.currentNo = parseInt(targetNo, 10);
    state.searchDraft = String(state.currentNo);
    clearSearchResults();
    updateURL();
    await loadAndRenderCurrentSong();
    closePanels();
    syncUI();
    return true;
  }

  function initBindings(){
    $('ui-home')?.addEventListener('click', goHome);
    $('ui-prev')?.addEventListener('click', ()=>{ goPrevSong(); });
    $('ui-play')?.addEventListener('click', togglePlayPause);
    $('ui-next')?.addEventListener('click', ()=>{ goNextSong(); });
    $('ui-speed')?.addEventListener('click', (e)=>{ e.preventDefault(); e.stopPropagation(); openPanel('panel-speed'); });
    $('ui-key')?.addEventListener('click', (e)=>{ e.preventDefault(); e.stopPropagation(); openPanel('panel-key'); });
        $('ui-text')?.addEventListener('click', (e)=>{ e.preventDefault(); e.stopPropagation(); openPanel('panel-text'); });
    // 轨道按钮由 setupTracksButton() 统一绑定，避免旧 openNewTrackPanel 与新音量面板互相冲突。
    $('ui-staff')?.addEventListener('click', (e)=>{ e.preventDefault(); e.stopPropagation(); openPanel('panel-staff'); });
    $('ui-lang')?.addEventListener('click', (e)=>{ e.preventDefault(); e.stopPropagation(); openPanel('panel-lang'); });
    $('ui-search')?.addEventListener('click', (e)=>{ e.preventDefault(); e.stopPropagation(); openPanel('panel-search'); });
    qa('[data-close-panel]').forEach(btn=>btn.addEventListener('click', closePanels));

    $('ui-speed-range')?.addEventListener('input', e=>{
      setPlaybackSpeedPercent(e.target.value);
      syncUI();
    });
    $('ui-speed-reset')?.addEventListener('click', ()=>{
      setPlaybackSpeedPercent(100);
      syncUI();
    });

    $('ui-key-plus')?.addEventListener('click', ()=>{ changeTranspose(1); syncUI(); });
    $('ui-key-minus')?.addEventListener('click', ()=>{ changeTranspose(-1); syncUI(); });
    $('ui-key-reset')?.addEventListener('click', ()=>{ resetTranspose(); syncUI(); });

    
    $('ui-font-plus')?.addEventListener('click', ()=>{ changeScoreFont(2); syncUI(); });
    $('ui-font-minus')?.addEventListener('click', ()=>{ changeScoreFont(-2); syncUI(); });
    $('ui-spacing-plus')?.addEventListener('click', ()=>{ changeSpacing(0.1); syncUI(); });
    $('ui-spacing-minus')?.addEventListener('click', ()=>{ changeSpacing(-0.1); syncUI(); });
    $('ui-chord-plus')?.addEventListener('click', ()=>{ changeChordFont(1); syncUI(); });
    $('ui-chord-minus')?.addEventListener('click', ()=>{ changeChordFont(-1); syncUI(); });
    $('ui-text-reset')?.addEventListener('click', ()=>{ resetTextSettings(); syncUI(); });

    $('ui-lang-simp')?.addEventListener('click', ()=>{ setScriptMode('simplified'); syncUI(); });
    $('ui-lang-trad')?.addEventListener('click', ()=>{ setScriptMode('traditional'); syncUI(); });

    $('ui-switch-e')?.addEventListener('click', async ()=>{ await switchToLinkedBook('e'); });
    $('ui-switch-c')?.addEventListener('click', async ()=>{ await switchToLinkedBook('c'); });
    $('ui-switch-ts')?.addEventListener('click', async ()=>{ await switchToLinkedBook('ts'); });

    $('ui-book-e')?.addEventListener('click', async ()=>{
      await setSearchBook('e', true);
      syncUI();
    });
    $('ui-book-c')?.addEventListener('click', async ()=>{
      await setSearchBook('c', true);
      syncUI();
    });
    $('ui-book-ts')?.addEventListener('click', async ()=>{
      await setSearchBook('ts', true);
      syncUI();
    });
    $('ui-search-go')?.addEventListener('click', async ()=>{
      const ok = await performSearch($('ui-search-input')?.value || '');
      const v = String($('ui-search-input')?.value || '').trim();
      if (ok && /^\d+$/.test(v)) closePanels();
      syncUI();
    });
    $('ui-search-input')?.addEventListener('input', e=>{
      state.searchDraft = String(e.target?.value || '').trim();
    });
    $('ui-search-input')?.addEventListener('keydown', async e=>{
      if (e.key === 'Enter') {
        e.preventDefault();
        const v = String($('ui-search-input')?.value || '').trim();
        const ok = await performSearch(v);
        if (ok && /^\d+$/.test(v)) closePanels();
        syncUI();
      }
    });

    $('ui-staff-five')?.addEventListener('click', ()=>{
      try { localStorage.setItem('staffMode', 'five'); } catch(e) {}
      setMode('score');
      if (typeof window.applyStaffMode === 'function') window.applyStaffMode();
      closePanels();
      setTimeout(syncUI, 30);
    });
    $('ui-staff-jian')?.addEventListener('click', ()=>{
      try { localStorage.setItem('staffMode', 'jian'); } catch(e) {}
      setMode('score');
      if (typeof window.applyStaffMode === 'function') window.applyStaffMode();
      closePanels();
      setTimeout(syncUI, 30);
    });
    $('ui-staff-lyrics')?.addEventListener('click', ()=>{
      setMode('lyrics');
      closePanels();
      setTimeout(syncUI, 30);
    });

    document.addEventListener('click', (e)=>{
      const layer = $('core-panel-layer');
      if (layer && !layer.hidden && e.target === layer) {
        closePanels();
        return;
      }
      const insidePanel = e.target.closest('.core-panel');
      const insideToolbar = e.target.closest('.core-ui-toolbar');
      if(!insidePanel && !insideToolbar) closePanels();
    });

    $('core-panel-layer')?.addEventListener('click', (e)=>{
      if (e.target === $('core-panel-layer')) closePanels();
    });
    qa('.core-panel', $('core-panel-layer')).forEach((panel)=>{
      panel.addEventListener('click', (e)=>{ e.stopPropagation(); });
    });
  }

    document.addEventListener('DOMContentLoaded', ()=>{
    initBindings();
    syncUI();
    setInterval(syncUI, 400);
    setTimeout(syncUI, 1200);
  });
})();
</script>
