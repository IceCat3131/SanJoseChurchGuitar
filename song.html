<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Staff Toggle Clean</title>
<style>
body{font-family:Arial;}
#toolbar{margin:10px;}
button{padding:6px 12px;margin-right:6px;}
</style>
</head>
<body>

<div id="toolbar">
  <button id="btnToggle">简 / 五</button>
</div>

<div id="alphaTab"></div>

<script>
// 假设 alphaTab 已初始化并挂在 window.__atApi

(function(){
  let mode = localStorage.getItem('staffMode') || 'standard';

  function applyMode(){
    const api = window.__atApi;
    if(!api) return;

    try{
      // 0 = 五线谱, 1 = 简谱（numbered）
      api.settings.notation.displayMode = (mode === 'numbered') ? 1 : 0;
      api.render();
      localStorage.setItem('staffMode', mode);
    }catch(e){
      console.warn(e);
    }
  }

  document.getElementById('btnToggle').onclick = function(){
    mode = (mode === 'standard') ? 'numbered' : 'standard';
    applyMode();
  };

  // 等 alphaTab 初始化后应用
  setTimeout(applyMode, 1000);

})();
</script>

</body>
</html>
