<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>song</title>
</head>
<body>

<!-- 原页面内容保持（这里假设你已有完整页面） -->

<script>
// === SAFE PATCH: timing enriched auto accompaniment track ===
function rebuildAutoTabTrack(){
  const song = window.__autoAccompanimentSong || [];
  const measures = Array.isArray(window.__measureTimelineRaw) ? window.__measureTimelineRaw : [];

  function parseMeterText(meterText){
    const m = String(meterText || '').match(/^(\d+)\/(\d+)$/);
    return {
      beats: m ? parseInt(m[1], 10) : 4,
      beatType: m ? parseInt(m[2], 10) : 4
    };
  }

  window.__autoAccompanimentTabTrack = song.map(bar => {
    const measureObj = measures.find(m => m.measure === bar.measure) || null;
    const meterInfo = parseMeterText(bar.meter || measureObj?.meter || '4/4');

    const stepCount = Math.max(1, (bar.notes || []).length);
    const measureStartMs = measureObj?.startMs ?? null;
    const measureDurationMs = measureObj?.durationMs ?? null;

    const beatsPerBar = meterInfo.beats;
    const durationBeat = beatsPerBar / stepCount;

    return {
      measure: bar.measure,
      meter: bar.meter,
      chordRaw: bar.chordRaw,
      chordDisplay: bar.chordDisplay,
      patternId: bar.patternId || null,
      patternName: bar.patternName || null,
      patternType: bar.patternType || null,

      beats: meterInfo.beats,
      beatType: meterInfo.beatType,
      stepCount,

      measureStartMs,
      measureDurationMs,

      notes: (bar.notes || []).map((n,i)=>{
        const startRatio = i / stepCount;
        const durationRatio = 1 / stepCount;
        const startBeat = +(i * durationBeat).toFixed(4);

        const noteObj = {
          string: n.string,
          fret: n.fret,
          stepIndex: i,
          label: n.label,

          startRatio: +startRatio.toFixed(6),
          durationRatio: +durationRatio.toFixed(6),

          startBeat,
          durationBeat: +durationBeat.toFixed(4)
        };

        if (Number.isFinite(measureStartMs) && Number.isFinite(measureDurationMs)) {
          noteObj.startMs = Math.round(measureStartMs + measureDurationMs * startRatio);
          noteObj.durationMs = Math.max(1, Math.round(measureDurationMs * durationRatio));
        }

        return noteObj;
      })
    };
  });
}

// 自动刷新
if (typeof rebuildAutoAccompanimentSong === 'function') {
  const original = rebuildAutoAccompanimentSong;
  rebuildAutoAccompanimentSong = function(){
    const res = original();
    rebuildAutoTabTrack();
    return res;
  }
}

document.addEventListener("DOMContentLoaded", ()=>{
  setTimeout(()=>{
    if (typeof rebuildAutoAccompanimentSong === 'function') {
      rebuildAutoAccompanimentSong();
    }
  },1000);
});
</script>

</body>
</html>
