<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GTZ 乐谱测试站</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="index-body">
  <main class="index-wrap">
    <h1>GTZ 乐谱测试站</h1>
    <p>此版本按路径读取 <code>.gtz</code>，再从包内解出 MusicXML 交给 alphaTab 渲染。</p>
    <div class="index-card">
      <div class="index-row">
        <label for="fileInput">GTZ 路径</label>
        <input id="fileInput" type="text" value="./assets/c0001_cn_g.gtz" />
      </div>
      <div class="index-actions">
        <a id="openLink" class="primary-btn" href="./song.html?file=./assets/c0001_cn_g.gtz">打开测试页</a>
      </div>
      <p class="index-tip">也可直接打开：<code>song.html?file=./assets/c0001_cn_g.gtz</code></p>
    </div>
  </main>
  <script>
    const fileInput = document.getElementById('fileInput');
    const openLink = document.getElementById('openLink');
    function syncLink() {
      const path = fileInput.value.trim() || './assets/c0001_cn_g.gtz';
      openLink.href = `./song.html?file=${encodeURIComponent(path)}`;
    }
    fileInput.addEventListener('input', syncLink);
    syncLink();
  </script>
</body>
</html>
