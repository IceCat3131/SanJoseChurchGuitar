<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>召会诗歌吉他谱</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body class="page-body">
  <div class="mobile-shell home-shell">
    <header class="home-header">
      <h1 class="site-title">召会诗歌吉他谱</h1>
    </header>

    <section class="search-panel home-search-panel">
      <div class="search-book-toggle">
        <button id="homeBookC" class="book-chip active" type="button">大本</button>
        <button id="homeBookTs" class="book-chip" type="button">小本</button>
      </div>
      <div class="search-input-row">
        <input id="homeSearchInput" class="song-search-input" type="text" placeholder="输入编号，如 1" />
        <button id="homeSearchBtn" class="icon-btn ghost" type="button" aria-label="搜索">⌕</button>
      </div>
    </section>

    <section class="song-list-panel">
      <div class="song-list-head">
        <span id="homeResultLabel">大本</span>
        <span id="homeCountLabel"></span>
      </div>
      <div id="homeSongList" class="song-list"></div>
    </section>
  </div>

  <script src="./app.js"></script>
</body>
</html>
