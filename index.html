
<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8" /><title>召会诗歌吉他谱</title><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" /><link rel="stylesheet" href="style.css" /></head><body><div class="page"><div class="page-inner"><div class="page-title">召会诗歌吉他谱</div><div class="card" id="search-card"><div class="search-bar"><div class="search-book-toggle"><button class="search-book-btn active" data-book="c" id="btn-book-c">大本</button><div class="search-book-divider"></div><button class="search-book-btn" data-book="ts" id="btn-book-ts">小本</button></div><div class="search-input-wrap"><input
            id="search-input"
            class="search-input"
            type="text"
            inputmode="numeric"
            pattern="[0-9]*"
            placeholder="输入编号，如31"
          /><button class="search-icon-btn" id="btn-search"><span class="search-icon">🔍</span></button></div></div></div><div class="list-card"><ul class="song-list" id="song-list"></ul></div><div class="footer-text">本网站仅供诗歌吉他谱查阅使用</div></div></div><script>const BOOKS={c:{label:"大本",folderText:"c_text",codePrefix:"c"},ts:{label:"小本",folderText:"ts_text",codePrefix:"ts"}},MAX_RANGES=20,state={currentBook:"c",data:{c:[],ts:[]},loadedRanges:{c:{},ts:{}},loaded:{c:!1,ts:!1},loading:!1};function pad4(num){return String(num).padStart(4,"0")}function getRangeFilePath(bookKey,rangeIndex){const start=100*rangeIndex+1,end=100*(rangeIndex+1);return`assets/${BOOKS[bookKey].folderText}/${bookKey}_${start}_${end}.json`}async function loadRange(bookKey,rangeIndex){if(state.loadedRanges[bookKey][rangeIndex])return!0;const url=getRangeFilePath(bookKey,rangeIndex);try{const res=await fetch(url);if(!res.ok)return state.loadedRanges[bookKey][rangeIndex]=!0,!1;const json=await res.json();return Array.isArray(json)&&0!==json.length?(state.data[bookKey]=state.data[bookKey].concat(json),state.loadedRanges[bookKey][rangeIndex]=!0,!0):(state.loadedRanges[bookKey][rangeIndex]=!0,!1)}catch(e){return console.error("加载失败:",bookKey,rangeIndex,e),state.loadedRanges[bookKey][rangeIndex]=!0,!1}}async function loadAllRangesForBook(bookKey){if(!state.loaded[bookKey]){state.loading=!0;for(let i=0;i<20;i++){if(!await loadRange(bookKey,i))break}state.data[bookKey].sort((a,b)=>(a.no||0)-(b.no||0)),state.loaded[bookKey]=!0,state.loading=!1}}function renderList(bookKey){const listEl=document.getElementById("song-list"),songs=state.data[bookKey]||[];listEl.innerHTML="",songs.forEach(song=>{if(!song.no)return;const no=song.no,li=(BOOKS[bookKey].codePrefix,pad4(no),document.createElement("li"));li.className="song-item",li.dataset.book=bookKey,li.dataset.no=no;const label=document.createElement("span");label.className="song-item-label",label.textContent=`${BOOKS[bookKey].label} 第 ${no} 首`;const codeSpan=document.createElement("span");codeSpan.className="song-item-code",codeSpan.textContent=song.title?song.title:"",li.appendChild(label),li.appendChild(codeSpan),li.addEventListener("click",()=>{goToSong(bookKey,no)}),listEl.appendChild(li)})}function setActiveBook(bookKey){state.currentBook=bookKey,document.getElementById("btn-book-c").classList.toggle("active","c"===bookKey),document.getElementById("btn-book-ts").classList.toggle("active","ts"===bookKey)}function goToSong(book,no){window.location.href=`song.html?book=${book}&no=${no}`}function handleSearch(){const raw=document.getElementById("search-input").value.trim();if(!raw)return;const match=raw.match(/(\d{1,4})$/);if(!match)return void alert("请输入正确编号，如：31");const no=parseInt(match[1],10);state.data[state.currentBook].some(s=>s.no===no)?goToSong(state.currentBook,no):alert("该编号不在当前册中")}document.addEventListener("DOMContentLoaded",async()=>{document.querySelectorAll(".search-book-btn").forEach(btn=>{btn.addEventListener("click",async()=>{const book=btn.dataset.book;if(state.currentBook===book)return;if(state.loading)return;setActiveBook(book);const listEl=document.getElementById("song-list");state.loaded[book]||(listEl.innerHTML='<li class="song-item"><span class="song-item-label">加载中，请稍候...</span></li>',await loadAllRangesForBook(book)),renderList(book)})}),document.getElementById("btn-search").addEventListener("click",handleSearch),document.getElementById("search-input").addEventListener("keydown",e=>{"Enter"===e.key&&(e.preventDefault(),handleSearch())}),await loadAllRangesForBook("c"),renderList("c"),loadAllRangesForBook("ts")});</script></body></html>
