
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>召会诗歌吉他谱</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="page">
  <div class="page-inner">
    <div class="page-title">召会诗歌吉他谱</div>
    <div class="card" id="search-card">
      <div class="search-bar">
        <div class="search-book-toggle">
          <button class="search-book-btn" data-book="e" id="btn-book-e">英文</button>
          <div class="search-book-divider"></div>
          <button class="search-book-btn active" data-book="c" id="btn-book-c">大本</button>
          <div class="search-book-divider"></div>
          <button class="search-book-btn" data-book="ts" id="btn-book-ts">小本</button>
        </div>
        <div class="search-input-wrap">
          <input
            id="search-input"
            class="search-input"
            type="text"
            inputmode="numeric"
            pattern="[0-9]*"
            placeholder="输入编号，如31"
          />
          <button class="search-icon-btn" id="btn-search">
            <span class="search-icon">🔍</span>
          </button>
        </div>
      </div>
    </div>
    <div class="list-card">
      <ul class="song-list" id="song-list">
      </ul>
    </div>
    <div class="footer-text">本网站仅供诗歌吉他谱查阅使用</div>
  </div>
</div>
<script src="index_main.js"></script>
</body>
</html>
